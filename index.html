<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cavernosos</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --bg:#12100D;
  --bg-elev:#1B1712;
  --bg-card:#201B14;
  --border:#372C1B;
  --border-soft:#2A2317;
  --accent:#F2B705;
  --accent-dim:#B98B0A;
  --grass:#4C7A52;
  --grass-dim:#345239;
  --text:#EDEAE3;
  --text-dim:#A79C87;
  --text-faint:#726A57;
  --danger:#D6604D;
  --radius:2px;
  --accent-soft:rgba(242,183,5,0.08);
  --accent-hover:#FFC91E;
  --on-accent:#191305;
  --ok:#8BC293;
  --hover:rgba(255,255,255,0.03);
  --glow:rgba(242,183,5,0.06);
}
/* ---------- ambientes (tema de cada um) ---------- */
html[data-env="boardgame"]{
  --bg:#EEEFF2; --bg-elev:#FFFFFF; --bg-card:#FFFFFF;
  --border:#D3D6DD; --border-soft:#E3E5EA;
  --accent:#4B5563; --accent-dim:#9CA3AF; --accent-soft:rgba(75,85,99,0.09); --accent-hover:#374151; --on-accent:#FFFFFF;
  --text:#1F2329; --text-dim:#5B6370; --text-faint:#8C939E;
  --grass:#3F8F5A; --grass-dim:#A7D3B5; --ok:#2F7A4A; --danger:#C0392B;
  --hover:rgba(0,0,0,0.04); --glow:rgba(0,0,0,0.035);
}
html[data-env="games"]{
  --bg:#050E26; --bg-elev:#0A1838; --bg-card:#0E1F47;
  --border:#1F3A78; --border-soft:#15295A;
  --accent:#4DA3FF; --accent-dim:#2F6FC4; --accent-soft:rgba(77,163,255,0.12); --accent-hover:#7DBBFF; --on-accent:#04112B;
  --text:#EAF1FF; --text-dim:#9DB2D9; --text-faint:#6480B3;
  --grass:#3FB6A8; --grass-dim:#1E5E68; --ok:#6FE3C6; --danger:#FF6B81;
  --hover:rgba(255,255,255,0.05); --glow:rgba(0,112,209,0.35);
}
html[data-env="outros"]{
  --bg:#FFF6D6; --bg-elev:#FFF0BF; --bg-card:#FFFBEB;
  --border:#E8D48F; --border-soft:#F1E3AE;
  --accent:#A26A00; --accent-dim:#D4A646; --accent-soft:rgba(162,106,0,0.10); --accent-hover:#855700; --on-accent:#FFFFFF;
  --text:#2E2610; --text-dim:#6B5D34; --text-faint:#9A8A5C;
  --grass:#5E8C3A; --grass-dim:#C9DDB2; --ok:#4A7A2A; --danger:#B8412E;
  --hover:rgba(0,0,0,0.04); --glow:rgba(255,200,40,0.25);
}
html[data-env="games"] body{
  background:
    radial-gradient(ellipse 1100px 600px at 50% -20%, var(--glow), transparent),
    radial-gradient(ellipse 700px 500px at 100% 100%, rgba(77,163,255,0.10), transparent),
    linear-gradient(180deg, #071640 0%, #050E26 60%);
  background-attachment:fixed;
}
html[data-env="boardgame"] .modal, html[data-env="outros"] .modal{box-shadow:0 20px 60px rgba(0,0,0,.18);}
html[data-env="boardgame"] .overlay, html[data-env="outros"] .overlay{background:rgba(30,30,30,0.35);}
body, .sidebar, .main{transition:background-color .25s ease, color .25s ease;}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  background:
    radial-gradient(ellipse 900px 500px at 15% -10%, var(--glow), transparent),
    var(--bg);
  color:var(--text);
  font-family:'Inter',sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
h1,h2,h3,.display{
  font-family:'Oswald',sans-serif;
  font-weight:600;
  letter-spacing:0.01em;
  text-transform:uppercase;
}
.num{font-family:'Oswald',sans-serif; font-weight:700;}
a{color:inherit;}
button{
  font-family:'Inter',sans-serif;
  cursor:pointer;
  border:1px solid var(--border);
  background:var(--bg-elev);
  color:var(--text);
  padding:10px 16px;
  border-radius:var(--radius);
  font-size:14px;
  font-weight:600;
  transition:border-color .15s ease, background .15s ease;
}
button:hover{border-color:var(--accent-dim);}
button:active{transform:translateY(1px);}
button.primary{
  background:var(--accent);
  color:var(--on-accent);
  border-color:var(--accent);
}
button.primary:hover{background:var(--accent-hover); border-color:var(--accent-hover);}
button.ghost{background:transparent; border-color:transparent; color:var(--text-dim);}
button.ghost:hover{color:var(--text); border-color:var(--border);}
button.danger{color:var(--danger); border-color:var(--danger); background:transparent;}
button:disabled{opacity:.4; cursor:not-allowed;}
input,select,textarea{
  font-family:'Inter',sans-serif;
  background:var(--bg);
  border:1px solid var(--border);
  color:var(--text);
  padding:10px 12px;
  border-radius:var(--radius);
  font-size:14px;
  width:100%;
}
input:focus,select:focus,textarea:focus{outline:none; border-color:var(--accent-dim);}
label{font-size:12.5px; color:var(--text-dim); display:block; margin-bottom:6px;}
.field{margin-bottom:16px;}

/* ---------- layout shell ---------- */
#app{display:flex; min-height:100vh;}
.sidebar{
  width:232px; flex-shrink:0;
  background:var(--bg-elev);
  border-right:1px solid var(--border-soft);
  display:flex; flex-direction:column;
  padding:20px 0;
  position:sticky; top:0; height:100vh;
  transition:width .2s ease;
}
.brand{
  padding:0 16px 20px 16px;
  border-bottom:1px solid var(--border-soft);
  margin-bottom:16px;
  display:flex; align-items:center; gap:10px;
  position:relative;
}
.brand-text{flex:1; min-width:0; white-space:nowrap;}
/* botão de recolher: preso na linha da borda da barra lateral */
.collapse-btn{
  position:absolute; top:30px; right:-14px; z-index:30;
  width:28px; height:28px; padding:0; border-radius:50%;
  background:var(--bg-elev); border:1px solid var(--border); color:var(--text-dim);
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 2px 8px rgba(0,0,0,.25);
}
.collapse-btn:hover{color:var(--accent); border-color:var(--accent-dim);}
.collapse-btn .lucide{width:15px; height:15px;}

/* seletor de ambiente */
.env-switch{display:grid; grid-template-columns:1fr 1fr; gap:4px; padding:0 12px; margin-bottom:16px;}
.env-switch button{
  display:flex; align-items:center; justify-content:center; gap:6px;
  padding:8px 4px; font-family:'Oswald'; font-size:11.5px; font-weight:500; letter-spacing:.05em; text-transform:uppercase;
  background:transparent; color:var(--text-dim); border:1px solid var(--border-soft);
}
.env-switch button .lucide{width:14px; height:14px;}
.env-switch button:hover{color:var(--text); border-color:var(--border);}
.env-switch button.active{color:var(--on-accent); background:var(--accent); border-color:var(--accent);}
.sidebar.collapsed .env-switch{grid-template-columns:1fr; padding:0 10px;}
.sidebar.collapsed .env-switch .env-label{display:none;}
.sidebar.collapsed .env-switch button{padding:8px 0;}
.nav-global{padding:0 12px; margin-top:8px; border-top:1px solid var(--border-soft); padding-top:10px;}
.sidebar.collapsed .nav-global{padding:10px 10px 0 10px;}
.nav-global button{width:100%;}
.nav-title{font-family:'Oswald'; font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--text-faint); padding:0 12px 6px 12px;}
.sidebar.collapsed .nav-title{display:none;}
.coming-soon{border:1px dashed var(--border); background:var(--bg-card); padding:40px 24px; text-align:center; max-width:560px;}
.coming-soon .lucide{width:34px; height:34px; color:var(--accent); margin-bottom:12px;}
.coming-soon h3{font-size:16px; margin-bottom:8px;}
.coming-soon p{color:var(--text-dim); font-size:14px; line-height:1.5;}
.lucide{width:18px; height:18px; stroke-width:1.9; flex-shrink:0;}
button .lucide{vertical-align:-4px;}
.btn-icon{display:inline-flex; align-items:center; gap:8px;}
.nav-label{white-space:nowrap; overflow:hidden;}
.sidebar.collapsed{width:68px;}
.sidebar.collapsed .brand{flex-direction:column; padding:0 10px 16px 10px;}
.sidebar.collapsed .brand-logo{width:38px; height:38px;}
.sidebar.collapsed .brand-text,
.sidebar.collapsed .nav-label,
.sidebar.collapsed .schedule,
.sidebar.collapsed .account-info{display:none;}
.sidebar.collapsed .nav{padding:0 10px;}
.sidebar.collapsed .nav button{justify-content:center; padding:11px 0;}
.sidebar.collapsed .nav button.active{padding-left:0;}
.sidebar.collapsed .sidebar-foot{padding:14px 10px 0 10px;}
.sidebar.collapsed .account{flex-direction:column;}
.brand-logo{width:44px; height:44px; flex-shrink:0; border-radius:50%; overflow:hidden; border:1px solid var(--border);}
.brand-logo img{width:100%; height:100%; object-fit:cover;}
.brand .kicker{color:var(--accent); font-size:10px; letter-spacing:.1em; font-family:'Oswald'; text-transform:uppercase;}
.brand h1{font-size:17px; margin-top:2px; line-height:1.05; letter-spacing:.02em;}
.nav{flex:1; display:flex; flex-direction:column; gap:2px; padding:0 12px;}
.nav button{
  text-align:left; background:transparent; border:none; color:var(--text-dim);
  padding:11px 12px; font-family:'Oswald'; font-size:13px; letter-spacing:.03em;
  text-transform:uppercase; border-radius:var(--radius); font-weight:500;
  display:flex; align-items:center; gap:12px;
}
.nav button:hover{color:var(--text); background:var(--hover);}
.nav button.active{color:var(--accent); background:var(--accent-soft); border-left:2px solid var(--accent); padding-left:10px;}
.sidebar-foot{padding:16px 16px 0 16px; border-top:1px solid var(--border-soft); margin-top:12px;}
.sidebar-foot .when{font-family:'Oswald'; font-size:14px; color:var(--accent); letter-spacing:.01em;}
.sidebar-foot .where{font-size:12.5px; color:var(--text-dim); margin-top:3px;}
.schedule{margin-bottom:14px;}
.account{display:flex; align-items:center; gap:8px;}
.avatar{
  width:32px; height:32px; border-radius:50%; flex-shrink:0;
  background:var(--accent-soft); color:var(--accent); border:1px solid var(--accent-dim);
  display:flex; align-items:center; justify-content:center; font-family:'Oswald'; font-size:14px; text-transform:uppercase;
}
.account-info{flex:1; min-width:0;}
.account-info .uname{font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.account-info .urole{font-size:11px; color:var(--text-faint);}
.icon-btn{
  background:transparent; border:1px solid transparent; color:var(--text-dim);
  padding:7px; display:inline-flex; align-items:center; justify-content:center;
}
.icon-btn:hover{color:var(--text); border-color:var(--border);}
.icon-btn.danger-hover:hover{color:var(--danger); border-color:var(--danger);}
.login-btn{width:100%; display:flex; align-items:center; justify-content:center; gap:8px;}
.sidebar.collapsed .login-btn{padding:9px 0;}
.sidebar.collapsed .login-btn .nav-label{display:none;}

/* ---------- users ---------- */
.toolbar{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:16px;}
.search-box{position:relative; flex:1; min-width:200px; max-width:320px;}
.search-box .lucide{position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--text-faint); width:16px; height:16px;}
.search-box input{padding-left:34px;}
.chip-filter{display:flex; gap:6px; flex-wrap:wrap;}
.chip-filter button{padding:6px 12px; font-size:12.5px; font-weight:500; color:var(--text-dim); background:transparent;}
.chip-filter button.active{color:var(--accent); border-color:var(--accent-dim); background:var(--accent-soft);}
.users-table{width:100%; border-collapse:collapse; border:1px solid var(--border-soft);}
.users-table th{text-align:left; font-family:'Oswald'; font-weight:500; font-size:11.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-faint); padding:10px 14px; border-bottom:1px solid var(--border); background:var(--bg-elev);}
.users-table td{padding:12px 14px; border-bottom:1px solid var(--border-soft); font-size:13.5px; vertical-align:middle;}
.users-table tr:last-child td{border-bottom:none;}
.users-table tr.inactive td{opacity:.55;}
.user-cell{display:flex; align-items:center; gap:10px;}
.user-cell .you{font-size:10.5px; color:var(--text-faint); border:1px solid var(--border); padding:1px 6px; margin-left:6px; text-transform:uppercase; letter-spacing:.05em;}
.badge{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-family:'Oswald'; letter-spacing:.06em; text-transform:uppercase; padding:3px 8px; border:1px solid var(--border); color:var(--text-dim);}
.badge .lucide{width:13px; height:13px;}
.badge.admin{color:var(--accent); border-color:var(--accent-dim);}
.badge.ok{color:var(--ok); border-color:var(--grass-dim);}
.badge.off{color:var(--text-faint);}
.badge.pending{color:var(--accent); border-color:var(--accent-dim); background:var(--accent-soft);}
.users-table tr.pending-row td{background:var(--accent-soft);}
.td-actions button{margin-left:6px; padding:7px 12px; font-size:13px;}
.pending-notice{align-items:center;}
.pending-notice > div{flex:1;}
.nav-badge{margin-left:auto; background:var(--accent); color:var(--on-accent); font-family:'Inter'; font-size:10.5px; font-weight:700; min-width:18px; height:18px; padding:0 5px; border-radius:9px; display:inline-flex; align-items:center; justify-content:center; letter-spacing:0;}
.nav button{position:relative;}
.sidebar.collapsed .nav-badge{position:absolute; top:4px; right:6px; min-width:15px; height:15px; font-size:9.5px;}
.link-btn{background:none; border:none; padding:0; color:var(--accent); font-weight:600; font-size:inherit;}
.link-btn:hover{text-decoration:underline;}
.login-switch{margin-top:18px; padding-top:16px; border-top:1px solid var(--border-soft); text-align:center; font-size:13px; color:var(--text-dim);}
.login-done{text-align:center;}
.login-done .lucide{width:40px; height:40px; color:var(--accent); margin-bottom:10px;}
.login-done h2{font-size:20px; margin-bottom:8px;}
.login-done p{color:var(--text-dim); font-size:14px; line-height:1.5;}
.chips{display:flex; gap:5px; flex-wrap:wrap;}
.chip{font-size:11.5px; padding:2px 8px; background:var(--bg-elev); border:1px solid var(--border-soft); color:var(--text-dim);}
.td-actions{text-align:right; white-space:nowrap;}

.modal.wide{max-width:640px;}
.modal-sub{font-size:12px; color:var(--text-faint); margin:-12px 0 18px 0;}
.form-section{font-family:'Oswald'; font-size:12.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-dim); margin:22px 0 12px 0; padding-bottom:6px; border-bottom:1px solid var(--border-soft); display:flex; justify-content:space-between; align-items:center;}
.form-section .links{display:flex; gap:12px; text-transform:none; letter-spacing:0; font-family:'Inter';}
.form-section .links button{background:none; border:none; padding:0; font-size:12px; color:var(--accent); font-weight:500;}
.form-section .links button:disabled{color:var(--text-faint);}
.form-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.pw-wrap{position:relative;}
.pw-wrap input{padding-right:40px;}
.pw-wrap .icon-btn{position:absolute; right:3px; top:50%; transform:translateY(-50%); padding:5px;}
.hint{font-size:11.5px; color:var(--text-faint); margin-top:5px;}
.pw-rules{list-style:none; margin-top:8px; display:grid; gap:3px;}
.pw-rules li{display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--text-faint);}
.pw-rules .lucide{width:13px; height:13px;}
.pw-rules .lucide-circle-check{display:none;}
.pw-rules li.ok{color:var(--ok);}
.pw-rules li.ok .lucide-circle{display:none;}
.pw-rules li.ok .lucide-circle-check{display:inline;}
.form-error{color:var(--danger); font-size:12.5px; margin-top:10px; min-height:1em;}
.check-pills{display:flex; gap:8px; flex-wrap:wrap;}
.check-pill{display:flex; align-items:center; gap:7px; border:1px solid var(--border); padding:8px 12px; cursor:pointer; font-size:13px; color:var(--text-dim); margin:0;}
.check-pill:has(input:checked){border-color:var(--accent-dim); color:var(--text); background:var(--accent-soft);}
.check-pill input{width:auto; accent-color:var(--accent);}
.switch-row{display:flex; align-items:center; gap:10px; font-size:13.5px; color:var(--text); margin:0; cursor:pointer;}
.switch-row input{width:auto; accent-color:var(--accent);}

.perm-tree{border:1px solid var(--border-soft); background:var(--bg); padding:6px 0;}
.perm-tree ul{list-style:none;}
.perm-tree ul ul{padding-left:26px;}
.perm-tree li > label{display:flex; align-items:center; gap:9px; padding:6px 12px; margin:0; font-size:13px; color:var(--text); cursor:pointer;}
.perm-tree li > label:hover{background:var(--hover);}
.perm-tree li.group > label{font-weight:600;}
.perm-tree li.group > label .lucide{width:15px; height:15px; color:var(--text-faint);}
.perm-tree input{width:auto; accent-color:var(--accent); width:15px; height:15px;}
.perm-tree.locked{opacity:.6;}
.perm-tree .perm-note{font-size:11.5px; color:var(--text-faint); font-weight:400; margin-left:4px;}
.notice{display:flex; gap:10px; align-items:flex-start; font-size:12.5px; color:var(--text-dim); border:1px solid var(--border); background:var(--bg); padding:10px 12px; margin-bottom:12px;}
.notice .lucide{color:var(--accent); width:16px; height:16px; margin-top:1px;}
.modal-actions .spacer{flex:1;}

.login-screen{
  min-height:100vh; width:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:32px 16px; gap:20px;
  background:
    radial-gradient(ellipse 700px 420px at 50% 0%, var(--accent-soft), transparent),
    var(--bg);
}
.login-card{
  width:100%; max-width:380px; background:var(--bg-elev); border:1px solid var(--border);
  padding:32px 28px; box-shadow:0 20px 60px rgba(0,0,0,.45);
}
.login-brand{text-align:center; margin-bottom:26px;}
.login-logo{
  width:128px; height:128px; margin:0 auto 16px auto; border-radius:50%; overflow:hidden;
  border:2px solid var(--accent-dim); box-shadow:0 0 0 6px rgba(242,183,5,0.07), 0 10px 30px rgba(0,0,0,.5);
}
.login-logo img{width:100%; height:100%; object-fit:cover; display:block;}
.login-brand .kicker{color:var(--accent); font-size:11px; letter-spacing:.18em; font-family:'Oswald'; text-transform:uppercase;}
.login-brand h1{font-size:30px; letter-spacing:.04em; margin-top:2px;}
.login-submit{width:100%; justify-content:center; padding:12px 16px; font-size:15px;}
.login-foot{font-size:12px; color:var(--text-faint); text-align:center;}
.login-card .form-error{margin:0 0 12px 0; min-height:0;}
.toast-wrap{position:fixed; bottom:20px; right:20px; z-index:100; display:flex; flex-direction:column; gap:8px; max-width:calc(100vw - 40px);}
.toast{background:var(--bg-elev); border:1px solid var(--border); border-left:3px solid var(--grass); padding:11px 14px; font-size:13.5px; box-shadow:0 8px 24px rgba(0,0,0,.35); animation:toastIn .18s ease;}
.toast.error{border-left-color:var(--danger);}
@keyframes toastIn{from{opacity:0; transform:translateY(6px);}to{opacity:1; transform:none;}}
.card-del{position:absolute; top:8px; right:8px; background:var(--bg-elev); z-index:2;}
.mural-card, .video-card{position:relative;}
.gate{border:1px solid var(--border-soft); background:var(--bg-card); padding:40px 24px; text-align:center; color:var(--text-dim); max-width:420px;}
.gate .lucide{width:28px; height:28px; color:var(--accent); margin-bottom:10px;}

.main{flex:1; padding:36px 44px; max-width:1100px;}
.page-head{margin-bottom:28px;}
.page-head .kicker{color:var(--accent); font-size:11px; letter-spacing:.14em; font-family:'Oswald'; text-transform:uppercase;}
.page-head h2{font-size:30px; margin-top:6px;}
.page-head p{color:var(--text-dim); margin-top:8px; font-size:14.5px; max-width:60ch;}

/* ---------- scoreboard stat cards ---------- */
.stat-row{display:flex; gap:1px; background:var(--border); border:1px solid var(--border); margin-bottom:32px; flex-wrap:wrap;}
.stat{
  flex:1; min-width:150px;
  background:var(--bg-card);
  padding:20px 22px;
}
.stat .label{font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.1em; font-family:'Oswald';}
.stat .value{font-size:40px; color:var(--accent); line-height:1.1; margin-top:6px;}
.stat .sub{font-size:12px; color:var(--text-faint); margin-top:4px;}

.section-title{font-size:14px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.08em; font-family:'Oswald'; margin:32px 0 14px 0; padding-bottom:8px; border-bottom:1px solid var(--border-soft);}
.section-title:first-of-type{margin-top:0;}

/* artilheiros table */
.rank-list{border:1px solid var(--border-soft);}
.rank-row{display:flex; align-items:center; gap:14px; padding:12px 16px; border-bottom:1px solid var(--border-soft);}
.rank-row:last-child{border-bottom:none;}
.rank-pos{font-family:'Oswald'; font-size:15px; color:var(--text-faint); width:22px;}

<div id="app"><p class="empty" style="padding:40px; font-family:'Oswald'; letter-spacing:.08em; text-transform:uppercase;">Carregando...</p></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script>
/* ============ storage helpers (Firestore) ============ */
const firebaseConfig = {
  apiKey: "AIzaSyDciHxLskZdyZ9nWzSAwFmjvwJ2YT26G8A",
  authDomain: "pelada-cavernosos.firebaseapp.com",
  projectId: "pelada-cavernosos",
  storageBucket: "pelada-cavernosos.firebasestorage.app",
  messagingSenderId: "620338588989",
  appId: "1:620338588989:web:08f44dcda38ecef7396954",
  measurementId: "G-8YB51MJKXT"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

// Cada item (jogador, partida, foto, vídeo) é um documento na coleção de mesmo nome.
// `synced` guarda o último JSON salvo/lido de cada item, para só gravar o que mudou
// e só apagar o que este navegador conhecia (nunca itens que outra pessoa acabou de criar).
const synced = {};
let loadFailed = false;

async function sGet(key){
  try{
    const snap = await db.collection(key).get();
    const items = snap.docs.map(d=> d.data()).sort((a,b)=> (a._order||0) - (b._order||0));
    synced[key] = {};
    items.forEach(it=>{ delete it._order; synced[key][it.id] = JSON.stringify(it); });
    return items;
  }catch(e){
    console.error('storage get failed', key, e);
    loadFailed = true;
    return null;
  }
}
async function sSet(key, val){
  try{
    const known = synced[key] || (synced[key] = {});
    const batch = db.batch();
    const col = db.collection(key);
    const ids = new Set();
    let ops = 0;
    val.forEach((item, i)=>{
      ids.add(item.id);
      const json = JSON.stringify(item);
      if(known[item.id] === json) return;
      batch.set(col.doc(item.id), {...JSON.parse(json), _order: i});
      known[item.id] = json; ops++;
    });
    Object.keys(known).forEach(id=>{
      if(!ids.has(id)){ batch.delete(col.doc(id)); delete known[id]; ops++; }
    });
    if(ops) await batch.commit();
    return true;
  }catch(e){
    console.error('storage set failed', key, e);
    toast(e.code === 'permission-denied'
      ? 'Você não tem permissão para essa ação.'
      : 'Não foi possível salvar. Verifique a conexão e tente de novo.', 'error');
    // desfaz a mudança local recarregando o que está no banco
    const fresh = await sGet(key);
    if(fresh) state[key] = fresh;
    render();
    return false;
  }
}

/* ============ UI helpers ============ */
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function icon(name, extra){ return `<i data-lucide="${name}"${extra ? ' '+extra : ''}></i>`; }
function toast(msg, type){
  let wrap = document.querySelector('.toast-wrap');
  if(!wrap){ wrap = document.createElement('div'); wrap.className = 'toast-wrap'; document.body.appendChild(wrap); }
  const t = document.createElement('div');
  t.className = 'toast' + (type === 'error' ? ' error' : '');
  t.textContent = msg;
  wrap.appendChild(t);
  setTimeout(()=> t.remove(), type === 'error' ? 5000 : 3000);
}
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }

/* ============ users & permissions ============ */
const PROFILES = ['Pelada', 'BoardGame', 'Games', 'Outros'];
const ROLES = {admin: 'Admin', user: 'User'};
const LOGIN_DOMAIN = 'usuarios.cavernosos.app';

// Árvore de permissões: grupos (com filhos) e permissões finais (com key).
const PERM_TREE = [
  {label:'Pelada', icon:'goal', children:[
    {label:'Painel', icon:'layout-dashboard', children:[
      {key:'dashboard.view', label:'Ver painel'},
    ]},
    {label:'Jogadores', icon:'users', children:[
      {key:'players.view', label:'Ver jogadores'},
      {key:'players.create', label:'Adicionar jogadores'},
      {key:'players.edit', label:'Editar jogadores'},
      {key:'players.delete', label:'Excluir jogadores'},
    ]},
    {label:'Partidas', icon:'calendar-days', children:[
      {key:'matches.view', label:'Ver partidas'},
      {key:'matches.create', label:'Criar partidas'},
      {key:'matches.score', label:'Marcar presença e gols'},
      {key:'matches.finalize', label:'Encerrar e reabrir partidas'},
      {key:'matches.delete', label:'Excluir partidas'},
    ]},
    {label:'Melhores Momentos', icon:'clapperboard', children:[
      {key:'moments.view', label:'Ver melhores momentos'},
      {label:'Vídeos', children:[
        {key:'videos.create', label:'Adicionar vídeos'},
        {key:'videos.delete', label:'Excluir vídeos'},
      ]},
      {label:'Fotos', children:[
        {key:'photos.create', label:'Enviar fotos'},
        {key:'photos.delete', label:'Excluir fotos'},
      ]},
    ]},
  ]},
  {label:'BoardGame', icon:'dices', children:[
    {key:'boardgame.view', label:'Ver ambiente BoardGame'},
  ]},
  {label:'Games', icon:'gamepad-2', children:[
    {key:'games.view', label:'Ver ambiente Games'},
    {label:'Vídeos', children:[
      {key:'games.videos.create', label:'Adicionar vídeos'},
      {key:'games.videos.delete', label:'Excluir vídeos'},
    ]},
  ]},
  {label:'Outros', icon:'sparkles', children:[
    {key:'outros.view', label:'Ver ambiente Outros'},
  ]},
  {label:'Usuários', icon:'user-cog', children:[
    {key:'users.view', label:'Ver lista de usuários', note:'criar e editar usuários é exclusivo de Admin'},
  ]},
];
function permLeaves(nodes){ return nodes.flatMap(n=> n.children ? permLeaves(n.children) : [n.key]); }
const ALL_PERMS = permLeaves(PERM_TREE);
const DEFAULT_USER_PERMS = ['dashboard.view','players.view','matches.view','matches.score','moments.view','videos.create','photos.create',
  'boardgame.view','games.view','games.videos.create','outros.view'];

// O site é fechado: sem login, ninguém pode nada.
function can(perm){
  const u = state.currentUser;
  return !!u && (u.role === 'admin' || (u.perms||[]).includes(perm));
}
const isAdmin = ()=> !!state.currentUser && state.currentUser.role === 'admin';
const normUsername = s => (s||'').trim().toLowerCase();
const validUsername = s => /^[a-z0-9._-]{3,30}$/.test(s);
const normEmail = s => (s||'').trim().toLowerCase();
const validEmail = s => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(s);

// Política de senha: 6 a 30 caracteres, maiúscula, minúscula, número e caractere especial.
const PASSWORD_RULES = [
  {label:'6 a 30 caracteres', test: p=> p.length >= 6 && p.length <= 30},
  {label:'Uma letra maiúscula', test: p=> /\p{Lu}/u.test(p)},
  {label:'Uma letra minúscula', test: p=> /\p{Ll}/u.test(p)},
  {label:'Um número', test: p=> /\d/.test(p)},
  {label:'Um caractere especial (ex.: ! @ # $ % *)', test: p=> /[^\p{L}\d]/u.test(p)},
];
function passwordProblem(p){
  const failed = PASSWORD_RULES.filter(r=> !r.test(p));
  return failed.length ? 'A senha precisa ter: ' + failed.map(r=> r.label.toLowerCase()).join(', ') + '.' : '';
}

function authErrorMsg(e){
  const c = (e && e.code) || '';
  if(['auth/invalid-credential','auth/wrong-password','auth/user-not-found','auth/invalid-login-credentials'].includes(c)) return 'Usuário ou senha incorretos.';
  if(c === 'auth/too-many-requests') return 'Muitas tentativas. Aguarde alguns minutos e tente de novo.';
  if(c === 'auth/weak-password' || c === 'auth/password-does-not-meet-requirements') return 'A senha não atende às regras: 6 a 30 caracteres, maiúscula, minúscula, número e caractere especial.';
  if(c === 'auth/requires-recent-login') return 'Por segurança, saia e entre de novo antes de trocar a senha.';
  if(c === 'auth/network-request-failed') return 'Sem conexão. Verifique a internet.';
  if(c === 'auth/operation-not-allowed') return 'O login por senha não está ativado no Firebase.';
  if(c === 'permission-denied') return 'Sem permissão no banco de dados. Confira as regras do Firestore.';
  return 'Algo deu errado. Tente de novo.';
}

async function loadSettings(){
  try{
    const app = await db.collection('settings').doc('app').get();
    state.appInitialized = app.exists;
  }catch(e){
    console.error('settings load failed', e);
    state.appInitialized = true;
  }
}
// Carrega os dados do site; só é chamado depois do login.
async function enterApp(){
  loadFailed = false;
  await Promise.all([loadAll(), loadUsers()]);
  if(!loadFailed && can('players.edit')) await migratePlayers();
}
function clearData(){
  Object.assign(state, {players:[], matches:[], mural:[], videos:[], games_videos:[], users:[], modal:null, openMatchId:null});
  Object.keys(synced).forEach(k=> delete synced[k]);
}
async function loadUsers(){
  if(!can('users.view')){ state.users = []; return; }
  try{
    const snap = await db.collection('users').get();
    state.users = snap.docs.map(d=> d.data()).sort((a,b)=> a.username.localeCompare(b.username));
  }catch(e){ console.error('users load failed', e); state.users = []; }
}
// Resolve o perfil do usuário logado (documento users/{uid}).
async function resolveCurrentUser(fbUser){
  if(state.settingUp) return; // o cadastro do primeiro admin ainda está sendo gravado
  state.currentUser = null;
  if(!fbUser) return;
  try{
    const doc = await db.collection('users').doc(fbUser.uid).get();
    const u = doc.exists ? doc.data() : null;
    if(!u || u.active === false){
      await auth.signOut();
      state.justLoggedIn = false;
      state.loginNotice = !u ? 'Usuário não encontrado.'
        : userStatus(u) === 'pending' ? 'Seu cadastro está aguardando aprovação dos administradores.'
        : 'Este usuário está desativado. Fale com um administrador.';
      return;
    }
    state.loginNotice = '';
    state.currentUser = u;
    if(state.justLoggedIn){ state.justLoggedIn = false; toast(`Bem-vindo, ${u.username}!`); }
  }catch(e){
    console.error('profile load failed', e);
    await auth.signOut();
  }
}
// Status do cadastro: pending (aguardando aprovação), active ou inactive.
const STATUS_LABELS = {pending:'Aguardando aprovação', active:'Ativo', inactive:'Inativo'};
function userStatus(u){ return u.status || (u.active === false ? 'inactive' : 'active'); }
function statusBadge(u){
  const s = userStatus(u);
  const cls = s === 'active' ? 'ok' : s === 'pending' ? 'pending' : 'off';
  return `<span class="badge ${cls}">${s === 'pending' ? icon('clock') : ''}${STATUS_LABELS[s]}</span>`;
}
const pendingCount = ()=> state.users.filter(u=> userStatus(u) === 'pending').length;

// App auxiliar para criar contas sem mexer no login de quem está usando o site.
function helperApp(){
  return firebase.apps.find(a=> a.name === 'helper') || firebase.initializeApp(firebaseConfig, 'helper');
}
function helperAuth(){ return helperApp().auth(); }

// Pede ao servidor (função da Vercel) para mandar o e-mail de "cadastro aprovado".
async function sendApprovalEmail(userId){
  try{
    const token = await auth.currentUser.getIdToken();
    const r = await fetch('/api/send-approval-email', {
      method:'POST',
      headers:{'Content-Type':'application/json', Authorization:'Bearer ' + token},
      body: JSON.stringify({userId}),
    });
    const data = await r.json().catch(()=> ({}));
    if(!r.ok) throw new Error(data.error || r.status);
    return true;
  }catch(e){
    console.error('approval email failed', e);
    return false;
  }
}
async function approveUser(u){
  const now = new Date().toISOString();
  const me = state.currentUser.username;
  await db.collection('users').doc(u.id).update({
    status:'active', active:true, approvedAt: now, approvedBy: me, updatedAt: now, updatedBy: me,
    perms: (u.perms && u.perms.length) ? u.perms : DEFAULT_USER_PERMS,
  });
  const sent = await sendApprovalEmail(u.id);
  await loadUsers();
  render();
  toast(sent ? `${u.username} aprovado. E-mail de aviso enviado para ${u.email}.`
             : `${u.username} aprovado, mas o e-mail de aviso não pôde ser enviado.`, sent ? undefined : 'error');
}
async function createAuthAccount(username, password){
  const email = `${username}-${Math.random().toString(36).slice(2,8)}@${LOGIN_DOMAIN}`;
  const h = helperAuth();
  await h.setPersistence(firebase.auth.Auth.Persistence.NONE);
  const cred = await h.createUserWithEmailAndPassword(email, password);
  await h.signOut();
  return {uid: cred.user.uid, email};
}

async function migratePlayers(){
  let changed = false;
  state.players.forEach(p=>{
    if(!p.attrs){
      const key = Object.keys(KNOWN_ATTRS).find(k=> p.name.toLowerCase().includes(k));
      p.attrs = key ? KNOWN_ATTRS[key] : {rit:50,fin:50,pas:50,dri:50,def:50,fis:50};
      changed = true;
    }
  });

}

function extractYoutubeId(url){
  const m = (url||'').match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
  return m ? m[1] : null;
}

/* ============ image resize helper ============ */
function resizeImage(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e =>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > h){ if(w > maxDim){ h = Math.round(h * maxDim/w); w = maxDim; } }
        else { if(h > maxDim){ w = Math.round(w * maxDim/h); h = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

let booted = false;
function render(){
  if(!booted) return;
  const app = document.getElementById('app');
  // mantém o foco/cursor da busca de usuários entre renders
  const search = document.getElementById('usersSearch');
  const keepFocus = search && document.activeElement === search;
  const caret = keepFocus ? search.selectionStart : null;
  applyEnvTheme();
  if(!state.currentUser){
    app.innerHTML = renderLoginScreen();
    bindAuthModals();
  } else if(loadFailed){
    app.innerHTML = `<div class="login-screen"><div class="login-card"><p class="empty">Não foi possível carregar os dados. Verifique a conexão.</p><button class="primary" onclick="location.reload()">Tentar de novo</button></div></div>`;
  } else {
    app.innerHTML = renderShell();
    bindShell();
  }
  if(window.lucide) lucide.createIcons();
  const newSearch = keepFocus && document.getElementById('usersSearch');
  if(newSearch){ newSearch.focus(); newSearch.setSelectionRange(caret, caret); }
}

function navButton(n){
  const badge = n.id === 'users' && isAdmin() ? pendingCount() : 0;
  return `<button data-nav="${n.id}" class="${state.view===n.id?'active':''}" title="${n.label}${badge ? ` (${badge} aguardando aprovação)` : ''}">${icon(n.icon)}<span class="nav-label">${n.label}</span>${badge ? `<span class="nav-badge">${badge}</span>` : ''}</button>`;
}
function renderShell(){
  const nav = visibleNav();
  if(!nav.some(n=> n.id === state.view) && nav.length) state.view = nav[0].id;
  const env = currentEnv();
  const envs = visibleEnvs();
  const envItems = env ? envNav(env) : [];
  const globalItems = GLOBAL_NAV.filter(n=> can(n.perm));
  const collapsed = state.sidebarCollapsed;
  const u = state.currentUser;
  return `
  <div class="sidebar ${collapsed ? 'collapsed' : ''}">
    <button class="collapse-btn" id="collapseBtn" title="${collapsed ? 'Expandir menu' : 'Recolher menu'}" aria-label="${collapsed ? 'Expandir menu' : 'Recolher menu'}">
      ${icon(collapsed ? 'chevron-right' : 'chevron-left')}
    </button>
    <div class="brand">
      <div class="brand-logo"><img src="${LOGO_DATA_URI}" alt="Cavernosos"></div>
      <div class="brand-text"><h1>CAVERNOSOS</h1></div>
    </div>
    ${envs.length > 1 ? `
    <div class="env-switch" role="tablist" aria-label="Ambiente">
      ${envs.map(e=>`<button role="tab" data-env="${e.id}" class="${env && env.id===e.id?'active':''}" aria-selected="${env && env.id===e.id}" title="${e.label}">${icon(e.icon)}<span class="env-label">${e.label}</span></button>`).join('')}
    </div>` : ''}
    <div class="nav">
      ${envItems.map(navButton).join('')}
    </div>
    ${globalItems.length ? `
    <div class="nav nav-global" style="flex:0 0 auto;">
      <div class="nav-title">Geral</div>
      ${globalItems.map(navButton).join('')}
    </div>` : ''}
    <div class="sidebar-foot">
      ${env && env.id === 'pelada' ? `
      <div class="schedule">
        <div class="when">Quinta-feira, 21h às 22h30</div>
        <div class="where">Sargento Wolf, Afogados</div>
      </div>` : ''}
      <div class="account">
        <div class="avatar" title="${esc(u.username)}">${esc(u.username.charAt(0))}</div>
        <div class="account-info">
          <div class="uname">${esc(u.username)}</div>
          <div class="urole">${ROLES[u.role] || u.role}</div>
        </div>
        <button class="icon-btn" id="myAccountBtn" title="Minha conta" aria-label="Minha conta">${icon('key-round')}</button>
        <button class="icon-btn danger-hover" id="logoutBtn" title="Sair" aria-label="Sair">${icon('log-out')}</button>
      </div>
    </div>
  </div>
  <div class="main">
    ${nav.length ? renderView() : renderNoAccess()}
  </div>
  ${state.modal ? renderModal() : ''}
  `;
}
function renderNoAccess(){
  return `
    <div class="gate">
      ${icon('lock')}
      <p>Seu usuário ainda não tem acesso a nenhuma área do site. Fale com um administrador.</p>
    </div>`;
}
function bindShell(){
  document.querySelectorAll('[data-nav]').forEach(b=>{
    b.onclick = ()=>{
      state.view = b.dataset.nav; state.modal=null; state.openMatchId=null;
      const env = currentEnv();
      if(env && env.nav.some(n=> n.id === state.view)) state.envViews[env.id] = state.view;
      render();
    };
  });
  document.querySelectorAll('.env-switch [data-env]').forEach(b=>{
    b.onclick = ()=>{
      const env = ENVS.find(e=> e.id === b.dataset.env);
      state.env = env.id;
      lsSet('cavernosos:env', env.id);
      const nav = envNav(env);
      state.view = nav.some(n=> n.id === state.envViews[env.id]) ? state.envViews[env.id] : nav[0].id;
      state.modal = null; state.openMatchId = null;
      render();
    };
  });
  const collapseBtn = document.getElementById('collapseBtn');
  if(collapseBtn) collapseBtn.onclick = ()=>{
    state.sidebarCollapsed = !state.sidebarCollapsed;
    lsSet('cavernosos:sidebar', state.sidebarCollapsed ? 'collapsed' : 'open');
    render();
  };
  const logoutBtn = document.getElementById('logoutBtn');
  if(logoutBtn) logoutBtn.onclick = async ()=>{ await auth.signOut(); toast('Você saiu.'); };
  const myAccountBtn = document.getElementById('myAccountBtn');
  if(myAccountBtn) myAccountBtn.onclick = ()=>{ state.modal = {type:'account', data:null}; render(); };
  bindViewEvents();
  bindOtherEnvEvents();
  bindUsersEvents();
  bindModalEvents();
  bindAuthModals();
}

function renderView(){
  if(state.view === 'dashboard') return renderDashboard();
  if(state.view === 'players') return renderPlayers();
  if(state.view === 'matches') return renderMatches();
  if(state.view === 'mural') return renderMural();
  if(state.view === 'users') return renderUsers();
  if(state.view === 'games-videos') return renderGamesVideos();
  if(state.view === 'bg-matches') return renderComingSoon('BoardGame', 'Partidas', 'swords',
    'Aqui vão ficar as partidas de jogos de tabuleiro: qual jogo, quem jogou, pontuação e quem venceu.');
  if(state.view === 'bg-rankings') return renderComingSoon('BoardGame', 'Rankings', 'trophy',
    'Ranking geral e por jogo, calculado a partir das partidas registradas.');
  if(state.view === 'bg-library') return renderComingSoon('BoardGame', 'Biblioteca', 'library',
    'A coleção de jogos do grupo: número de jogadores, duração e quem é o dono de cada caixa.');
  if(state.view === 'bg-media') return renderComingSoon('BoardGame', 'Mídia', 'image',
    'Fotos e vídeos das jogatinas.');
  if(state.view === 'outros-home') return renderComingSoon('Outros', 'Outros', 'sparkles',
    'Um espaço para tudo que não é pelada, tabuleiro nem videogame. Conte o que você quer ver aqui.');
  return '';
}

/* ============ DASHBOARD ============ */
function computeStats(){
  const totalMatches = state.matches.length;
  const totalGoals = state.matches.reduce((s,m)=> s + Object.values(m.goals||{}).reduce((a,b)=>a+b,0), 0);
  const totalPresences = state.matches.reduce((s,m)=> s + (m.presence||[]).length, 0);
  const scorers = {};
  const presences = {};
  state.matches.forEach(m=>{
    (m.presence||[]).forEach(pid=>{ presences[pid] = (presences[pid]||0)+1; });
    Object.entries(m.goals||{}).forEach(([pid,g])=>{ scorers[pid] = (scorers[pid]||0)+g; });
  });
  const topScorers = Object.entries(scorers).sort((a,b)=>b[1]-a[1]).slice(0,8)
    .map(([pid,g])=>({player: state.players.find(p=>p.id===pid), goals:g}))
    .filter(x=>x.player);
  const topPresence = Object.entries(presences).sort((a,b)=>b[1]-a[1]).slice(0,8)
    .map(([pid,c])=>({player: state.players.find(p=>p.id===pid), count:c}))
    .filter(x=>x.player);
  return {totalMatches, totalGoals, totalPresences, topScorers, topPresence};
}
function renderDashboard(){
  const s = computeStats();
  const avgGoals = s.totalMatches ? (s.totalGoals/s.totalMatches).toFixed(1) : '0.0';
  return `
    <div class="page-head">
      <div class="kicker">Placar geral</div>
      <h2>Painel</h2>
      <p>Quinta-feira, 21h às 22h30 · Sargento Wolf, Afogados</p>
    </div>
    <div class="stat-row">
      <div class="stat"><div class="label">Partidas</div><div class="value num">${s.totalMatches}</div></div>
      <div class="stat"><div class="label">Gols no total</div><div class="value num">${s.totalGoals}</div><div class="sub">${avgGoals} por partida</div></div>
      <div class="stat"><div class="label">Presenças confirmadas</div><div class="value num">${s.totalPresences}</div></div>
      <div class="stat"><div class="label">Jogadores cadastrados</div><div class="value num">${state.players.length}</div></div>
    </div>

    <div class="section-title">Artilheiros</div>
    ${s.topScorers.length === 0 ? `<div class="empty">Nenhum gol registrado ainda. Marque os gols em uma partida para ver o ranking.</div>` : `
    <div class="rank-list">
      ${s.topScorers.map((x,i)=>`
        <div class="rank-row">
          <div class="rank-pos">${i+1}</div>
          ${playerPhotoTag(x.player,'rank-photo')}
          <div class="rank-name">${esc(x.player.name)}<span class="pos-tag">${esc(x.player.position)}</span></div>
          <div class="rank-goals">${x.goals}</div>
        </div>
      `).join('')}
    </div>`}

    <div class="section-title">Mais presentes</div>
    ${s.topPresence.length === 0 ? `<div class="empty">Nenhuma presença confirmada ainda.</div>` : `
    <div class="rank-list">
      ${s.topPresence.map((x,i)=>`
        <div class="rank-row">
          <div class="rank-pos">${i+1}</div>
          ${playerPhotoTag(x.player,'rank-photo')}
          <div class="rank-name">${esc(x.player.name)}<span class="pos-tag">${esc(x.player.position)}</span></div>
          <div class="rank-goals">${x.count}</div>
        </div>
      `).join('')}
    </div>`}
  `;
}
function playerPhotoTag(player, cls){
  if(player && player.photo) return `<img src="${player.photo}" class="${cls}">`;
  const initial = player ? esc(player.name.charAt(0).toUpperCase()) : '?';
  return `<div class="${cls}" style="display:flex;align-items:center;justify-content:center;font-family:Oswald;font-size:13px;color:var(--text-faint);">${initial}</div>`;
}

function renderMatches(){
  if(state.openMatchId){
    return renderMatchDetail(state.openMatchId);
  }
  const sorted = [...state.matches].sort((a,b)=> b.date.localeCompare(a.date));
  return `
    <div class="page-head" style="display:flex; align-items:flex-end; justify-content:space-between; gap:20px; flex-wrap:wrap;">
      <div>
        <div class="kicker">Registro</div>
        <h2>Partidas</h2>
        <p>Confirme presença e registre os gols de cada rodada.</p>
      </div>
      ${can('matches.create') ? `<button class="primary btn-icon" id="addMatchBtn">${icon('plus')}Nova partida</button>` : ''}
    </div>
    ${sorted.length === 0 ? `<div class="empty">Nenhuma partida registrada ainda.</div>` : `
    <div class="match-list">
      ${sorted.map(m=>{
        const goals = Object.values(m.goals||{}).reduce((a,b)=>a+b,0);
        const dateFmt = formatDate(m.date);
        return `
        <div class="match-row" data-open-match="${m.id}">
          <div class="match-date">${dateFmt}</div>
          <div class="match-info">
            <div class="label-line">${esc(m.label || 'Pelada')}</div>
            <div class="sub-line">${(m.presence||[]).length} presentes · ${goals} gol${goals===1?'':'s'}</div>
          </div>
          <div class="match-status ${m.finalized ? 'closed' : 'open'}">${m.finalized ? 'Encerrada' : 'Aberta'}</div>
        </div>`;
      }).join('')}
    </div>`}
  `;
}
function renderMatchDetail(matchId){
  const m = state.matches.find(x=>x.id===matchId);
  if(!m){ state.openMatchId = null; return renderMatches(); }
  const presenceSet = new Set(m.presence||[]);
  const locked = m.finalized || !can('matches.score');
  const canFinalize = can('matches.finalize'), canDelete = can('matches.delete');
  return `
    <div class="page-head">
      <button class="ghost btn-icon" id="backToMatches" style="padding:6px 0; margin-bottom:14px;">${icon('arrow-left')}Partidas</button>
      <div class="kicker">${formatDate(m.date)}</div>
      <h2>${esc(m.label || 'Pelada')}</h2>
      <p>${can('matches.score') ? 'Marque quem esteve presente e registre os gols de cada um.' : 'Presenças e gols desta partida.'}</p>
    </div>
    <div class="presence-grid">
      ${state.players.map(p=>{
        const present = presenceSet.has(p.id);
        const g = (m.goals && m.goals[p.id]) || 0;
        return `
        <div class="presence-item ${present?'present':''}">
          <input type="checkbox" class="checkbox" data-presence-toggle="${p.id}" ${present?'checked':''} ${locked?'disabled':''}>
          ${playerPhotoTag(p,'')}
          <div class="pname">${esc(p.name)}</div>
          ${present ? `
          <div class="goal-ctrl">
            ${locked ? '' : `<button data-goal-minus="${p.id}">&minus;</button>`}
            <div class="gnum">${g}</div>
            ${locked ? '' : `<button data-goal-plus="${p.id}">+</button>`}
          </div>` : ''}
        </div>`;
      }).join('')}
    </div>
    ${canFinalize || canDelete ? `
    <div style="margin-top:24px; display:flex; gap:10px;">
      ${canFinalize ? `<button id="toggleFinalize">${m.finalized ? 'Reabrir partida' : 'Encerrar partida'}</button>` : ''}
      ${canDelete ? `<button class="danger" id="deleteMatch">Excluir partida</button>` : ''}
    </div>` : ''}
  `;
}
function formatDate(iso){
  const d = new Date(iso + 'T12:00:00');
  return d.toLocaleDateString('pt-BR', {day:'2-digit', month:'short'}).replace('.','');
}

/* ============ VIEW EVENTS ============ */
function bindViewEvents(){
  // players
  const addPlayerBtn = document.getElementById('addPlayerBtn');
  if(addPlayerBtn) addPlayerBtn.onclick = ()=>{ state.modal = {type:'player', data:null}; render(); };
  document.querySelectorAll('[data-players-view]').forEach(b=>{
    b.onclick = ()=>{ state.playersView = b.dataset.playersView; render(); };
  });
  document.querySelectorAll('[data-edit-player]').forEach(b=>{
    b.onclick = ()=>{ const p = state.players.find(x=>x.id===b.dataset.editPlayer); state.modal = {type:'player', data:p}; render(); };
  });
  document.querySelectorAll('[data-del-player]').forEach(b=>{
    b.onclick = async ()=>{
      if(!confirm('Excluir este jogador?')) return;
      state.players = state.players.filter(p=>p.id !== b.dataset.delPlayer);
      await savePlayers();
      render();
    };
  });

  // matches
  const addMatchBtn = document.getElementById('addMatchBtn');
  if(addMatchBtn) addMatchBtn.onclick = ()=>{ state.modal = {type:'match', data:null}; render(); };
  document.querySelectorAll('[data-open-match]').forEach(b=>{
    b.onclick = ()=>{ state.openMatchId = b.dataset.openMatch; render(); };
  });
  const backBtn = document.getElementById('backToMatches');
  if(backBtn) backBtn.onclick = ()=>{ state.openMatchId = null; render(); };

  document.querySelectorAll('[data-presence-toggle]').forEach(cb=>{
    cb.onchange = async ()=>{
      const m = state.matches.find(x=>x.id===state.openMatchId);
      const pid = cb.dataset.presenceToggle;
      m.presence = m.presence || [];
      if(cb.checked){ if(!m.presence.includes(pid)) m.presence.push(pid); }
      else { m.presence = m.presence.filter(x=>x!==pid); if(m.goals) delete m.goals[pid]; }
      await saveMatches();
      render();
    };
  });
  document.querySelectorAll('[data-goal-plus]').forEach(b=>{
    b.onclick = async ()=>{
      const m = state.matches.find(x=>x.id===state.openMatchId);
      m.goals = m.goals || {};
      const pid = b.dataset.goalPlus;
      m.goals[pid] = (m.goals[pid]||0) + 1;
      await saveMatches();
      render();
    };
  });
  document.querySelectorAll('[data-goal-minus]').forEach(b=>{
    b.onclick = async ()=>{
      const m = state.matches.find(x=>x.id===state.openMatchId);
      const pid = b.dataset.goalMinus;
      if(m.goals && m.goals[pid]) m.goals[pid] = Math.max(0, m.goals[pid]-1);
      await saveMatches();
      render();
    };
  });
  const toggleFinalize = document.getElementById('toggleFinalize');
  if(toggleFinalize) toggleFinalize.onclick = async ()=>{
    const m = state.matches.find(x=>x.id===state.openMatchId);
    m.finalized = !m.finalized;
    await saveMatches();
    render();
  };
  const deleteMatch = document.getElementById('deleteMatch');
  if(deleteMatch) deleteMatch.onclick = async ()=>{
    if(!confirm('Excluir esta partida?')) return;
    state.matches = state.matches.filter(x=>x.id !== state.openMatchId);
    state.openMatchId = null;
    await saveMatches();
    render();
  };

  // mural
  const addPhotoBtn = document.getElementById('addPhotoBtn');
  if(addPhotoBtn) addPhotoBtn.onclick = ()=>{ state.modal = {type:'photo', data:null}; render(); };
  const addVideoBtn = document.getElementById('addVideoBtn');
  if(addVideoBtn) addVideoBtn.onclick = ()=>{ state.modal = {type:'video', data:null}; render(); };
  document.querySelectorAll('[data-momentos-tab]').forEach(b=>{
    b.onclick = ()=>{ state.momentosTab = b.dataset.momentosTab; render(); };
  });
  document.querySelectorAll('[data-del-video]').forEach(b=>{
    b.onclick = async ()=>{
      if(!confirm('Excluir este vídeo?')) return;
      state.videos = state.videos.filter(v=> v.id !== b.dataset.delVideo);
      if(await saveVideos()){ render(); toast('Vídeo excluído.'); }
    };
  });
  document.querySelectorAll('[data-del-photo]').forEach(b=>{
    b.onclick = async ()=>{
      if(!confirm('Excluir esta foto?')) return;
      state.mural = state.mural.filter(p=> p.id !== b.dataset.delPhoto);
      if(await saveMural()){ render(); toast('Foto excluída.'); }
    };
  });
}

function bindModalEvents(){
  const overlay = document.getElementById('modalOverlay');
  if(!overlay) return;
  overlay.onclick = (e)=>{ if(e.target === overlay){ state.modal = null; render(); } };
  const cancel = document.getElementById('cancelModal');
  if(cancel) cancel.onclick = ()=>{ state.modal = null; render(); };

  // player modal
  const photoPick = document.getElementById('photoPick');
  const photoInput = document.getElementById('photoInput');
  let pendingPhoto = state.modal.data ? state.modal.data.photo : null;
  if(photoPick){
    photoPick.onclick = ()=> photoInput.click();
    photoInput.onchange = async ()=>{
      const file = photoInput.files[0];
      if(!file) return;
      const dataUrl = await resizeImage(file, 400, 0.75);
      pendingPhoto = dataUrl;
      document.getElementById('photoPreview').outerHTML = `<img src="${dataUrl}" id="photoPreview">`;
    };
  }
  const starPicker = document.getElementById('starPicker');
  if(starPicker){
    starPicker.querySelectorAll('[data-star]').forEach(s=>{
      s.onclick = ()=>{
        const val = parseInt(s.dataset.star, 10);
        document.getElementById('starsInput').value = val;
        starPicker.querySelectorAll('[data-star]').forEach(x=>{
          x.classList.toggle('filled', parseInt(x.dataset.star,10) <= val);
        });
      };
    });
  }
  const playerForm = document.getElementById('playerForm');
  if(playerForm){
    playerForm.onsubmit = async (e)=>{
      e.preventDefault();
      const fd = new FormData(playerForm);
      const name = fd.get('name').trim();
      if(!name) return;
      const stars = parseInt(fd.get('stars')||'0', 10);
      const clamp99 = v => Math.max(0, Math.min(99, parseInt(v||'0',10)));
      const attrs = {
        rit: clamp99(fd.get('rit')), fin: clamp99(fd.get('fin')), pas: clamp99(fd.get('pas')),
        dri: clamp99(fd.get('dri')), def: clamp99(fd.get('def')), fis: clamp99(fd.get('fis'))
      };
      const existing = state.modal.data;
      let player;
      if(existing){
        player = state.players.find(p=>p.id === existing.id);
        player.name = name;
        player.position = fd.get('position');
        player.number = fd.get('number') || '';
        player.photo = pendingPhoto;
        player.stars = stars;
        player.attrs = attrs;
      } else {
        player = {id: uid(), name, position: fd.get('position'), number: fd.get('number')||'', photo: pendingPhoto, stars, attrs};
        state.players.push(player);
      }
      await savePlayers();
      state.modal = null;
      render();
    };
  }

  // match modal
  const matchForm = document.getElementById('matchForm');
  if(matchForm){
    matchForm.onsubmit = async (e)=>{
      e.preventDefault();
      const fd = new FormData(matchForm);
      const match = {id: uid(), date: fd.get('date'), label: fd.get('label')||'', presence: [], goals: {}, finalized:false};
      state.matches.push(match);
      await saveMatches();
      state.modal = null;
      state.openMatchId = match.id;
      render();
    };
  }

  // video modal
  const videoForm = document.getElementById('videoForm');
  if(videoForm){
    videoForm.onsubmit = async (e)=>{
      e.preventDefault();
      const fd = new FormData(videoForm);
      const url = fd.get('url').trim();
      if(!extractYoutubeId(url)){ toast('Não consegui reconhecer esse link do YouTube. Confira e tente de novo.', 'error'); return; }
      const video = {id: uid(), title: fd.get('title').trim(), url};
      if(state.currentUser) video.addedBy = state.currentUser.username;
      const key = (state.modal.data && state.modal.data.collection) || 'videos';
      state[key].push(video);
      state.modal = null;
      if(await sSet(key, state[key])){ render(); toast('Vídeo publicado.'); }
    };
  }

  // mural modal
  const muralPick = document.getElementById('muralPhotoPick');
  const muralInput = document.getElementById('muralPhotoInput');
  let pendingMuralPhoto = null;
  if(muralPick){
    muralPick.onclick = ()=> muralInput.click();
    muralInput.onchange = async ()=>{
      const file = muralInput.files[0];
      if(!file) return;
      const dataUrl = await resizeImage(file, 900, 0.7);
      pendingMuralPhoto = dataUrl;
      document.getElementById('muralPhotoPreviewWrap').outerHTML = `<img src="${dataUrl}" style="max-width:100%; max-height:160px; border-radius:0;">`;
    };
  }
  const photoForm = document.getElementById('photoForm');
  if(photoForm){
    photoForm.onsubmit = async (e)=>{
      e.preventDefault();
      if(!pendingMuralPhoto){ toast('Escolha uma foto.', 'error'); return; }
      const fd = new FormData(photoForm);
      state.mural.push({
        id: uid(), photo: pendingMuralPhoto, caption: fd.get('caption')||'',
        author: (fd.get('authorName')||'').trim() || 'Anônimo', date: new Date().toISOString().slice(0,10)
      });
      state.modal = null;
      if(await saveMural()){ render(); toast('Foto publicada.'); }
    };
  }
}

/* ---------- árvore de permissões com checkboxes ---------- */
function renderPermTree(selected, opts){
  const sel = new Set(selected);
  const locked = !!opts.locked;
  const nodes = PERM_TREE;
  const renderNodes = list => `<ul>${list.map(n=> n.children ? `
    <li class="group">
      <label><input type="checkbox" data-perm-group ${locked?'disabled':''}>${n.icon ? icon(n.icon) : ''}${esc(n.label)}</label>
      ${renderNodes(n.children)}
    </li>` : `
    <li><label><input type="checkbox" data-perm="${n.key}" ${locked || sel.has(n.key) ? 'checked' : ''} ${locked?'disabled':''}>${esc(n.label)}${n.note ? `<span class="perm-note">(${esc(n.note)})</span>` : ''}</label></li>`
  ).join('')}</ul>`;
  return `<div class="perm-tree ${locked?'locked':''}" id="${opts.id}">${renderNodes(nodes)}</div>`;
}
function syncPermGroups(tree){
  [...tree.querySelectorAll('li.group')].reverse().forEach(li=>{
    const leaves = [...li.querySelectorAll('input[data-perm]')];
    const on = leaves.filter(x=> x.checked).length;
    const g = li.querySelector(':scope > label > input');
    g.checked = leaves.length > 0 && on === leaves.length;
    g.indeterminate = on > 0 && on < leaves.length;
  });
}
function bindPermTree(tree){
  if(!tree) return;
  syncPermGroups(tree);
  tree.addEventListener('change', e=>{
    const t = e.target;
    // seção = o grupo mais próximo que tenha uma permissão "Ver ..." como filha direta
    let section = t.closest('li.group'), viewBox = null;
    while(section && !(viewBox = section.querySelector(':scope > ul > li > label > input[data-perm$=".view"]'))){
      section = section.parentElement.closest('li.group');
    }
    if(t.hasAttribute('data-perm-group')){
      t.closest('li').querySelectorAll('input[data-perm]').forEach(x=> x.checked = t.checked);
      // ligar um subgrupo (ex.: Vídeos) exige poder ver a seção
      if(t.checked && viewBox) viewBox.checked = true;
    } else if(t.dataset.perm){
      // qualquer ação exige a permissão de ver a seção; tirar "ver" tira as ações
      if(t.checked && viewBox) viewBox.checked = true;
      if(!t.checked && t === viewBox) section.querySelectorAll('input[data-perm]').forEach(x=> x.checked = false);
    }
    syncPermGroups(tree);
  });
}
function readPermTree(tree){ return [...tree.querySelectorAll('input[data-perm]:checked')].map(x=> x.dataset.perm); }
function setPermTree(tree, perms){
  tree.querySelectorAll('input[data-perm]').forEach(x=> x.checked = perms.includes(x.dataset.perm));
  syncPermGroups(tree);
}

                .map(([k,l])=>`<option value="${k}" ${status===k?'selected':''}>${l}</option>`).join('')}
            </select>
            ${status === 'pending' ? '<div class="hint">Ao mudar para Ativo, a pessoa recebe um e-mail avisando da aprovação.</div>' : ''}
            ${self ? '<div class="hint">Você não pode desativar a si mesmo.</div>' : ''}` : ''}
          </div>
        </div>
        <div class="field">
          <label>Perfis</label>
          <div class="check-pills">
            ${PROFILES.map(p=>`<label class="check-pill"><input type="checkbox" name="profiles" value="${p}" ${profiles.includes(p)?'checked':''}>${p}</label>`).join('')}
          </div>
        </div>

        <div class="form-section">
          Permissões de acesso
          <span class="links"><button type="button" id="permAll" ${role==='admin'?'disabled':''}>Marcar tudo</button><button type="button" id="permNone" ${role==='admin'?'disabled':''}>Limpar</button></span>
        </div>
        <div class="notice" id="adminNotice" style="${role==='admin' ? '' : 'display:none'}">${icon('shield-check')}<div>Administradores têm acesso total, incluindo criar e editar usuários.</div></div>
        <div id="permTreeWrap">${renderPermTree(role === 'admin' ? ALL_PERMS : perms, {id:'userTree', locked: role === 'admin'})}</div>

        <div class="form-error" id="formError"></div>
        <div class="modal-actions">
          ${isEdit && !self ? `<button type="button" class="danger btn-icon" id="deleteUserBtn">${icon('trash-2')}Excluir</button>` : ''}
          <span class="spacer"></span>
          <button type="button" class="ghost" id="cancelModal">Cancelar</button>
          <button type="submit" class="primary" id="formSubmit">${isEdit ? 'Salvar alterações' : 'Criar usuário'}</button>
        </div>
      </form>
    </div>
  </div>`;
}

/* ---------- eventos ---------- */
function formBusy(busy, label){
  const b = document.getElementById('formSubmit');
  if(!b) return;
  if(busy){ b.dataset.label = b.textContent; b.textContent = label || 'Salvando...'; b.disabled = true; }
  else { b.textContent = b.dataset.label || b.textContent; b.disabled = false; }
}
function formError(msg){ const el = document.getElementById('formError'); if(el) el.textContent = msg || ''; }

function bindUsersEvents(){
  const newUserBtn = document.getElementById('newUserBtn');
  if(newUserBtn) newUserBtn.onclick = ()=>{ state.modal = {type:'user', data:null}; render(); };
  document.querySelectorAll('[data-edit-user]').forEach(b=>{
    b.onclick = ()=>{ state.modal = {type:'user', data: state.users.find(u=> u.id === b.dataset.editUser)}; render(); };
  });
  document.querySelectorAll('[data-approve-user]').forEach(b=>{
    b.onclick = async ()=>{
      const u = state.users.find(x=> x.id === b.dataset.approveUser);
      if(!u || !confirm(`Aprovar o cadastro de "${u.username}"${u.email ? ` (${u.email})` : ''}?`)) return;
      b.disabled = true; b.textContent = 'Aprovando...';
      try{ await approveUser(u); }
      catch(e){ console.error(e); toast(authErrorMsg(e), 'error'); b.disabled = false; b.textContent = 'Aprovar'; }
    };
  });
  document.querySelectorAll('[data-users-filter]').forEach(b=>{
    b.onclick = ()=>{ state.usersFilter = b.dataset.usersFilter; render(); };
  });
  const search = document.getElementById('usersSearch');
  if(search) search.oninput = ()=>{ state.usersSearch = search.value; render(); };
}

function bindAuthModals(){
  document.querySelectorAll('[data-pw-rules]').forEach(input=>{
    const items = input.closest('.field').querySelectorAll('.pw-rules li');
    const update = ()=> items.forEach(li=> li.classList.toggle('ok', PASSWORD_RULES[li.dataset.rule].test(input.value)));
    input.addEventListener('input', update);
    update();
  });
  document.querySelectorAll('[data-toggle-pw]').forEach(b=>{
    b.onclick = ()=>{
      const input = b.parentElement.querySelector('input');
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      b.innerHTML = icon(show ? 'eye-off' : 'eye');
      b.title = show ? 'Ocultar senha' : 'Mostrar senha';
      lucide.createIcons();
    };
  });

  const loginForm = document.getElementById('loginForm');
  if(loginForm) loginForm.onsubmit = async e=>{
    e.preventDefault();
    const fd = new FormData(loginForm);
    const username = normUsername(fd.get('username'));
    formError(''); formBusy(true, 'Entrando...');
    try{
      if(!validUsername(username)) throw {code:'auth/invalid-credential'};
      const login = await db.collection('logins').doc(username).get();
      if(!login.exists) throw {code:'auth/invalid-credential'};
      const keep = !!fd.get('keep');
      lsSet('cavernosos:keep', keep ? '1' : '0');
      await auth.setPersistence(keep ? firebase.auth.Auth.Persistence.LOCAL : firebase.auth.Auth.Persistence.SESSION);
      state.justLoggedIn = true;
      await auth.signInWithEmailAndPassword(login.data().email, fd.get('password'));
      // a tela troca sozinha quando o Firebase confirma o login (onAuthStateChanged)
    }catch(err){
      state.justLoggedIn = false;
      formBusy(false); formError(authErrorMsg(err));
    }
  };

  document.querySelectorAll('[data-auth-mode]').forEach(b=>{
    b.onclick = ()=>{ state.authMode = b.dataset.authMode; state.loginNotice = ''; render(); };
  });

  const registerForm = document.getElementById('registerForm');
  if(registerForm) registerForm.onsubmit = async e=>{
    e.preventDefault();
    const fd = new FormData(registerForm);
    const username = normUsername(fd.get('username'));
    const contactEmail = normEmail(fd.get('email'));
    const password = fd.get('password');
    if(!validUsername(username)) return formError('Nome de usuário inválido. Use 3 a 30 letras minúsculas, números, ponto, hífen ou _.');
    if(!validEmail(contactEmail)) return formError('Informe um e-mail válido.');
    if(passwordProblem(password)) return formError(passwordProblem(password));
    if(password !== fd.get('confirm')) return formError('As senhas não conferem.');
    formError(''); formBusy(true, 'Enviando...');
    // A conta é criada num app auxiliar: a pessoa não fica logada e o cadastro
    // é gravado com a identidade dela (as regras só permitem status "pending").
    const h = helperApp();
    try{
      const taken = await db.collection('logins').doc(username).get();
      if(taken.exists) throw {message: 'Esse nome de usuário já está em uso. Escolha outro.'};
      await h.auth().setPersistence(firebase.auth.Auth.Persistence.NONE);
      const authEmail = `${username}-${Math.random().toString(36).slice(2,8)}@${LOGIN_DOMAIN}`;
      const cred = await h.auth().createUserWithEmailAndPassword(authEmail, password);
      const now = new Date().toISOString();
      const user = {id: cred.user.uid, username, email: contactEmail, role:'user', profiles:[], perms:[],
                    active:false, status:'pending', selfRegistered:true, createdAt: now, createdBy: username};
      const hdb = h.firestore();
      const batch = hdb.batch();
      batch.set(hdb.collection('users').doc(user.id), user);
      batch.set(hdb.collection('logins').doc(username), {uid: user.id, email: authEmail});
      try{ await batch.commit(); }
      catch(err){ await cred.user.delete().catch(()=>{}); throw err; }
      await h.auth().signOut();
      state.authMode = 'registered';
      state.registeredEmail = contactEmail;
      render();
    }catch(err){
      console.error(err);
      await h.auth().signOut().catch(()=>{});
      formBusy(false);
      formError(err.message && !err.code ? err.message : authErrorMsg(err));
    }
  };

  const setupForm = document.getElementById('setupForm');
  if(setupForm) setupForm.onsubmit = async e=>{
    e.preventDefault();
    const fd = new FormData(setupForm);
    const username = normUsername(fd.get('username'));
    const password = fd.get('password');
    const contactEmail = normEmail(fd.get('email'));
    if(!validUsername(username)) return formError('Usuário inválido. Use 3 a 30 letras minúsculas, números, ponto, hífen ou _.');
    if(!validEmail(contactEmail)) return formError('Informe um e-mail válido.');
    if(passwordProblem(password)) return formError(passwordProblem(password));
    if(password !== fd.get('confirm')) return formError('As senhas não conferem.');
    formError(''); formBusy(true, 'Criando...');
    state.settingUp = true;
    try{
      const email = `${username}-${Math.random().toString(36).slice(2,8)}@${LOGIN_DOMAIN}`;
      const cred = await auth.createUserWithEmailAndPassword(email, password);
      const now = new Date().toISOString();
      const user = {id: cred.user.uid, username, email: contactEmail, role:'admin', profiles:[], perms:[], active:true, status:'active', createdAt: now, createdBy: username};
      const batch = db.batch();
      batch.set(db.collection('users').doc(user.id), user);
      batch.set(db.collection('logins').doc(username), {uid: user.id, email});
      batch.set(db.collection('settings').doc('app'), {initialized: true, createdAt: now});
      await batch.commit();
      state.settingUp = false;
      state.appInitialized = true;
      await resolveCurrentUser(auth.currentUser);
      await enterApp();
      state.modal = null;
      state.view = 'users';
      render();
      toast(`Administrador ${username} criado. Bem-vindo!`);
    }catch(err){
      console.error(err);
      state.settingUp = false;
      if(auth.currentUser) await auth.currentUser.delete().catch(()=> auth.signOut());
      formBusy(false); formError(authErrorMsg(err));
    }
  };

  const accountForm = document.getElementById('accountForm');
  if(accountForm) accountForm.onsubmit = async e=>{
    e.preventDefault();
    const fd = new FormData(accountForm);
    const password = fd.get('password');
    if(passwordProblem(password)) return formError(passwordProblem(password));
    if(password !== fd.get('confirm')) return formError('As senhas não conferem.');
    formError(''); formBusy(true);
    try{
      const cred = firebase.auth.EmailAuthProvider.credential(auth.currentUser.email, fd.get('current'));
      await auth.currentUser.reauthenticateWithCredential(cred);
      await auth.currentUser.updatePassword(password);
      state.modal = null; render();
      toast('Senha alterada.');
    }catch(err){
      formBusy(false);
      formError(['auth/invalid-credential','auth/wrong-password'].includes(err.code) ? 'Senha atual incorreta.' : authErrorMsg(err));
    }
  };

  const userForm = document.getElementById('userForm');
  if(userForm) bindUserForm(userForm, state.modal.data);
}

function bindUserForm(form, existing){
  const self = !!existing && existing.id === state.currentUser.id;
  const wrap = document.getElementById('permTreeWrap');
  let tree = document.getElementById('userTree');
  let customPerms = existing ? (existing.perms || []) : DEFAULT_USER_PERMS;
  bindPermTree(tree);

  const roleSelect = document.getElementById('roleSelect');
  roleSelect.onchange = ()=>{
    const admin = roleSelect.value === 'admin';
    if(admin) customPerms = readPermTree(tree);
    wrap.innerHTML = renderPermTree(admin ? ALL_PERMS : customPerms, {id:'userTree', locked: admin});
    tree = document.getElementById('userTree');
    bindPermTree(tree);
    document.getElementById('adminNotice').style.display = admin ? '' : 'none';
    document.getElementById('permAll').disabled = admin;
    document.getElementById('permNone').disabled = admin;
    lucide.createIcons();
  };
  document.getElementById('permAll').onclick = ()=> setPermTree(tree, ALL_PERMS);
  document.getElementById('permNone').onclick = ()=> setPermTree(tree, []);

  const del = document.getElementById('deleteUserBtn');
  if(del) del.onclick = async ()=>{
    if(!confirm(`Excluir o usuário "${existing.username}"? Ele perderá o acesso imediatamente.`)) return;
    try{
      const batch = db.batch();
      batch.delete(db.collection('users').doc(existing.id));
      batch.delete(db.collection('logins').doc(existing.username));
      await batch.commit();
      await loadUsers();
      state.modal = null; render();
      toast(`Usuário ${existing.username} excluído.`);
    }catch(err){ console.error(err); formError(authErrorMsg(err)); }
  };

  form.onsubmit = async e=>{
    e.preventDefault();
    const fd = new FormData(form);
    const username = normUsername(fd.get('username'));
    const password = fd.get('password') || '';
    const role = self ? existing.role : fd.get('role');
    const perms = role === 'admin' ? customPerms : readPermTree(tree);
    const profiles = fd.getAll('profiles');
    const status = self || !existing ? 'active' : fd.get('status');
    const active = status === 'active';
    const approving = !!existing && userStatus(existing) === 'pending' && status === 'active';
    const email = normEmail(fd.get('email'));

    if(!validUsername(username)) return formError('Usuário inválido. Use 3 a 30 letras minúsculas, números, ponto, hífen ou _.');
    if(!validEmail(email)) return formError('Informe um e-mail válido.');
    if(state.users.some(u=> u.email === email && (!existing || u.id !== existing.id))) return formError('Já existe um usuário com esse e-mail.');
    if(!existing && !password) return formError('Defina uma senha.');
    if(password && passwordProblem(password)) return formError(passwordProblem(password));
    formError(''); formBusy(true);

    try{
      const now = new Date().toISOString();
      const me = state.currentUser.username;
      if(!existing || username !== existing.username){
        const taken = await db.collection('logins').doc(username).get();
        if(taken.exists) throw {message: 'Já existe um usuário com esse nome.'};
      }
      const batch = db.batch();
      if(!existing){
        const acc = await createAuthAccount(username, password);
        const user = {id: acc.uid, username, email, role, profiles, perms, active: true, status: 'active', createdAt: now, createdBy: me, updatedAt: now};
        batch.set(db.collection('users').doc(acc.uid), user);
        batch.set(db.collection('logins').doc(username), {uid: acc.uid, email: acc.email});
        await batch.commit();
        toast(`Usuário ${username} criado.`);
      } else {
        const loginSnap = await db.collection('logins').doc(existing.username).get();
        let login = loginSnap.exists ? loginSnap.data() : null;
        const updated = {...existing, username, email, role, profiles, perms, active, status, updatedAt: now, updatedBy: me};
        if(approving){ updated.approvedAt = now; updated.approvedBy = me; }
        if(password){
          if(self){
            await auth.currentUser.updatePassword(password);
          } else {
            // Sem servidor não dá para trocar a senha de outra conta: criamos uma conta
            // nova com a senha definida e movemos o cadastro para ela.
            const acc = await createAuthAccount(username, password);
            batch.delete(db.collection('users').doc(existing.id));
            updated.id = acc.uid;
            login = {uid: acc.uid, email: acc.email};
          }
        }
        if(!login) throw {message: 'Este usuário está sem login configurado. Defina uma nova senha para ele.'};
        batch.set(db.collection('users').doc(updated.id), updated);
        if(username !== existing.username) batch.delete(db.collection('logins').doc(existing.username));
        batch.set(db.collection('logins').doc(username), {uid: updated.id, email: login.email});
        await batch.commit();
        if(self) state.currentUser = updated;
        if(approving){
          const sent = await sendApprovalEmail(updated.id);
          toast(sent ? `${username} aprovado. E-mail de aviso enviado para ${email}.`
                     : `${username} aprovado, mas o e-mail de aviso não pôde ser enviado.`, sent ? undefined : 'error');
        } else {
          toast(`Usuário ${username} atualizado.`);
        }
      }
      await loadUsers();
      state.modal = null;
      render();
    }catch(err){
      console.error(err);
      formBusy(false);
      formError(err.message && !err.code ? err.message : authErrorMsg(err));
    }
  };
}
</script>
