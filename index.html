/* ============ VOTAÇÃO ============ */
// Cada usuário tem um documento em votes/{uid} com as notas que deu: ratings[playerId] = {rit, fin, ...}.
function myVotes(){
  const me = state.currentUser;
  const uid = auth.currentUser ? auth.currentUser.uid : me && me.id;
  const v = uid && state.votes.find(x=> x.id === uid);
  return (v && v.ratings) || {};
}
function myVotesScale(){
  const uid = auth.currentUser ? auth.currentUser.uid : state.currentUser && state.currentUser.id;
  const v = uid && state.votes.find(x=> x.id === uid);
  return v && v.scale;
}
function renderVotes(){
  const mine = myVotes();
  const mineScale = myVotesScale();
  const players = [...state.players].sort((a,b)=> playerName(a).localeCompare(playerName(b)));
  const done = players.filter(p=> playerAttrDefs(p).every(d=> mine[p.id] && typeof mine[p.id][d.k] === 'number')).length;
  const meId = state.currentUser && state.currentUser.id;
  const legend = (title, defs)=> `<div><div class="vote-legend-title">${title}</div>${defs.map(d=>`<div class="vote-legend-row"><b>${d.abbr}</b> ${d.name}${d.hint ? ` <span>— ${d.hint}</span>` : ''}</div>`).join('')}</div>`;
  return `
    <div class="page-head">
      <div class="kicker">Elenco</div>
      <h2>Votação</h2>
      <p>Dê sua nota de 0 a 10 (só números inteiros) em cada habilidade. A média dos votos de todos forma as habilidades e as estrelas dos cards.</p>
    </div>
    ${players.length === 0 ? `<div class="empty">Nenhum jogador cadastrado ainda.</div>` : `
    <details class="vote-legend">
      <summary>${icon('info')}O que significa cada item</summary>
      <div class="vote-legend-body">${legend('Jogadores de linha', FIELD_ATTRS)}${legend('Goleiros', GK_ATTRS)}</div>
    </details>
    <form id="votesForm" autocomplete="off">
      <div class="vote-grid">
        ${players.map(p=>{
          const r = mine[p.id] || {};
          const n = playerVotes(p).length;
          return `
          <div class="vote-card ${playerAttrDefs(p).every(d=> typeof r[d.k] === 'number') ? 'voted' : ''}" data-vote-card="${p.id}">
            <div class="vote-head">
              ${playerPhotoTag(p, 'vote-photo')}
              <div style="flex:1; min-width:0;">
                <div class="vote-name">${esc(playerName(p))}${p.userId && p.userId === meId ? '<span class="you">você</span>' : ''}</div>
                <div class="vote-meta">${esc(p.position)}${p.type ? ' · '+esc(p.type) : ''}</div>
              </div>
              <div class="vote-score">
                ${starsHtml(playerStars(p), 'stars')}
                <div class="vote-meta">${n ? `${n} voto${n===1?'':'s'}` : 'sem votos'}</div>
              </div>
            </div>
            <div class="vote-fields">
              ${playerAttrDefs(p).map(d=>`
              <label class="vote-field" title="${d.name}${d.hint ? ': '+d.hint : ''}">
                <span>${d.abbr}</span>
                <input type="number" min="0" max="10" step="1" inputmode="numeric" placeholder="–" name="${p.id}.${d.k}" value="${typeof r[d.k] === 'number' ? (mineScale === 10 ? r[d.k] : from99(r[d.k])) : ''}" aria-label="${esc(playerName(p))}: ${d.name}">
              </label>`).join('')}
            </div>
          </div>`;
        }).join('')}
      </div>
      <div class="vote-bar">
        <div class="vote-progress">Você votou em <b>${done}</b> de <b>${players.length}</b> jogador${players.length===1?'':'es'}.</div>
        <div class="form-error" id="formError" style="margin:0;"></div>
        <button type="submit" class="primary btn-icon" id="formSubmit">${icon('check')}Salvar votos</button>
      </div>
    </form>`}
  `;
}
function bindVotesEvents(){
  const form = document.getElementById('votesForm');
  if(!form) return;
  form.onsubmit = async e=>{
    e.preventDefault();
    const me = state.currentUser;
    const ratings = {};
    const incomplete = [];
    state.players.forEach(p=>{
      const defs = playerAttrDefs(p);
      const vals = defs.map(d=> form.elements[`${p.id}.${d.k}`].value.trim());
      if(vals.every(v=> v === '')) return;               // não votou nesse jogador
      if(vals.some(v=> v === '')){ incomplete.push(playerName(p)); return; }
      ratings[p.id] = {};
      defs.forEach((d,i)=> ratings[p.id][d.k] = clamp10(vals[i]));
    });
    if(incomplete.length) return formError(`Preencha os 6 campos de: ${incomplete.join(', ')}.`);
    formError(''); formBusy(true);
    const vid = auth.currentUser.uid;   // as regras exigem o documento com o uid do login
    const doc = {id: vid, voter: me.username, ratings, scale: 10, updatedAt: new Date().toISOString()};
    try{
      await db.collection('votes').doc(vid).set(doc);
      state.votes = state.votes.filter(v=> v.id !== vid).concat(doc);
      render();
      toast(`Votos salvos (${Object.keys(ratings).length} jogador${Object.keys(ratings).length===1?'':'es'}).`);
    }catch(err){
      console.error(err);
      formBusy(false);
      formError(err.code === 'permission-denied'
        ? (isAdmin() ? 'O banco recusou o voto: publique as regras novas do Firebase (arquivo firestore.rules) no console.' : 'O banco recusou o voto. Peça a um administrador para conferir sua permissão de votar.')
        : 'Não foi possível salvar. Verifique a conexão e tente de novo.');
    }
  };
}

function formatDate(iso){
  const d = new Date(iso + 'T12:00:00');
  return d.toLocaleDateString('pt-BR', {day:'2-digit', month:'short'}).replace('.','');
}

// Partida: {id, date, presence[], notes, goals (registros antigos), createdBy}.
// Fotos ficam em "mural" e vídeos em "videos", cada um no próprio documento e ligado pela matchId
// (um documento do Firestore tem limite de 1MB, então as fotos não cabem dentro da partida).
// Vídeos antigos sem matchId aparecem na partida da mesma data.
const matchPhotos = m => state.mural.filter(p=> p.matchId === m.id);
const matchVideos = m => state.videos.filter(v=> v.matchId === m.id || (!v.matchId && v.date && v.date === m.date));
const playerById = id => state.players.find(p=> p.id === id);
function matchPlayers(m){
  return (m.presence||[]).map(playerById).filter(Boolean).sort((a,b)=> playerName(a).localeCompare(playerName(b)));
}
// fotos e vídeos que não pertencem a nenhuma partida (publicados antes, ou de partidas excluídas)
function looseMedia(){
  const ids = new Set(state.matches.map(m=> m.id));
  const dates = new Set(state.matches.map(m=> m.date));
  return {
    videos: state.videos.filter(v=> !(v.matchId && ids.has(v.matchId)) && !(!v.matchId && v.date && dates.has(v.date))),
    photos: state.mural.filter(p=> !(p.matchId && ids.has(p.matchId))),
  };
}
function ytThumb(url){ const id = extractYoutubeId(url); return id ? `https://i.ytimg.com/vi/${id}/hqdefault.jpg` : ''; }

function renderMatches(){

// flag do tipo do jogador (Mensalista / Diarista / Goleiro)
const TYPE_FLAG_CLS = {Mensalista:'men', Diarista:'dia', Goleiro:'gol'};
function typeFlag(p){

function typeSummary(players){

function matchCard(m){

  const slides = [
    ...photos.slice(0, 6).map(p=> `<div class="pm-slide"><img src="${p.photo}" loading="lazy" alt=""></div>`),
    ...videos.map((v,i)=> `<div class="pm-slide pm-slide-video" data-play-match="${m.id}" data-play-idx="${i}" title="Assistir: ${esc(v.title)}">
        <img src="${ytThumb(v.url)}" loading="lazy" alt=""><span class="pm-play">${icon('play')}</span></div>`),
  ];
  const firstVideo = slides.length - videos.length;
  return `
  <div class="pm-card" data-open-match="${m.id}" role="button" tabindex="0">
    <div class="pm-cover">
      ${slides.length ? `<div class="pm-slides" data-slides>${slides.join('')}</div>` : icon('calendar-days')}

      <div class="pm-date">${formatFullDate(m.date)}</div>
      ${m.label ? `<div class="pm-label">${esc(m.label)}</div>` : ''}

      <div class="pm-meta">
        <span>${icon('users')}${players.length} presente${players.length===1?'':'s'}</span>
        <span>${icon('image')}${photos.length}</span>

function formatFullDate(iso){
  const d = new Date(iso + 'T12:00:00');
  const s = d.toLocaleDateString('pt-BR', {weekday:'short', day:'2-digit', month:'short', year:'numeric'}).replace(/\./g,'');
  return s.charAt(0).toUpperCase() + s.slice(1);
}
// quem publicou pode corrigir o próprio vídeo; quem pode excluir pode editar qualquer um
const canEditVideo = (cfg, v)=> can(cfg.deletePerm) || (can(cfg.createPerm) && state.currentUser && v.addedBy === state.currentUser.username);
const videoFilter = col=> state.videoFilters[col] || (state.videoFilters[col] = {date:'', q:''});

// cfg: {collection, createPerm, deletePerm, items (opcional: só estes), noToolbar}
function renderVideoGrid(cfg){
  const all = cfg.items || state[cfg.collection];
  if(!all.length) return `<div class="empty">Nenhum vídeo publicado ainda.</div>`;
  const f = cfg.noToolbar ? {date:'', q:''} : videoFilter(cfg.collection);
  const q = f.q.trim().toLowerCase();
  // datas distintas, mais recentes primeiro, com a contagem de vídeos
  const counts = {};
  all.forEach(v=>{ const k = v.date || 'none'; counts[k] = (counts[k]||0) + 1; });
  const dates = Object.keys(counts).filter(k=> k !== 'none').sort((a,b)=> b.localeCompare(a));
  const list = all
    .filter(v=> !f.date || (f.date === 'none' ? !v.date : v.date === f.date))
    .filter(v=> !q || v.title.toLowerCase().includes(q) || (v.addedBy||'').toLowerCase().includes(q))
    .sort((a,b)=> (b.date||'').localeCompare(a.date||''));
  const col = cfg.collection;
  return `
    ${cfg.noToolbar ? '' : `<div class="toolbar">
      <div class="search-box">${icon('search')}<input data-video-search="${col}" placeholder="Buscar pelo título" value="${esc(f.q)}" autocomplete="off"></div>
      <select data-video-date="${col}" style="width:auto; min-width:200px;" aria-label="Filtrar por data">
        <option value="">Todas as datas (${all.length})</option>
        ${dates.map(d=> `<option value="${d}" ${f.date===d?'selected':''}>${formatFullDate(d)} (${counts[d]})</option>`).join('')}
        ${counts.none ? `<option value="none" ${f.date==='none'?'selected':''}>Sem data (${counts.none})</option>` : ''}

function fmtPlayerCounts(counts){

/* ---------- regras da partida ---------- */
const bgChrono = list => [...list].sort((a,b)=> (a.date||'').localeCompare(b.date||'') || (a.time||'').localeCompare(b.time||'') || (a.createdAt||'').localeCompare(b.createdAt||''));
function bgWinnerKeys(m){
  const rs = m.results || [];
  if(m.mode === 'coop') return m.coopWin ? rs.map(r=> bgCanon(r.userId)) : [];
  return rs.filter(r=> Number(r.position) === 1).map(r=> bgCanon(r.userId));
}

/* ---------- ELO: sobe ou desce conforme contra quem você ganha ---------- */
const ELO_START = 1000, ELO_K = 32;
let eloCache = {key:null, val:null};
function bgElo(gameId){
  const ck = state.bg_matches.length + ':' + (state.bg_matches.map(m=> m.updatedAt || m.createdAt || '').join('|')) + ':' + (gameId||'');
  if(eloCache.key === ck) return eloCache.val;
  const rating = {}, games = {}, deltas = {};
  bgChrono(state.bg_matches.filter(m=> !gameId || m.gameId === gameId)).forEach(m=>{
    if(m.mode === 'coop') return;
    const rs = (m.results||[]).filter(r=> r.position);
    if(rs.length < 2) return;
    const keys = rs.map(r=> bgCanon(r.userId));
    const R = keys.map(k=> rating[k] ?? ELO_START);
    const mates = (i,j)=> m.mode === 'teams' && rs[i].team && rs[i].team === rs[j].team;
    deltas[m.id] = {};
    keys.forEach((k,i)=>{
      let sum = 0, opp = 0;
      keys.forEach((k2,j)=>{
        if(i === j || k === k2 || mates(i,j)) return;
        const exp = 1 / (1 + Math.pow(10, (R[j] - R[i]) / 400));
        const act = rs[i].position < rs[j].position ? 1 : rs[i].position === rs[j].position ? 0.5 : 0;
        sum += act - exp; opp++;
      });
      if(!opp) return;
      const delta = Math.round(ELO_K * sum / opp);
      deltas[m.id][k] = delta;
    });
    Object.entries(deltas[m.id]).forEach(([k,d])=>{ rating[k] = (rating[k] ?? ELO_START) + d; games[k] = (games[k]||0) + 1; });
  });
  eloCache = {key: ck, val: {rating, games, deltas}};
  return eloCache.val;
}

/* ---------- estatísticas agregadas por jogador ---------- */
function hIndex(counts){ const c = [...counts].sort((a,b)=> b-a); let h = 0; while(h < c.length && c[h] >= h+1) h++; return h; }
function bgAggregate(matches){
  const P = {};
  const get = (k, r)=> P[k] || (P[k] = {key:k, name: bgName(k, r.username), guest: isGuestKey(k), played:0, wins:0, gold:0, silver:0, bronze:0,
    coopPlayed:0, coopWins:0, minutes:0, games:{}, partners:{}, beatenBy:{}, beat:{}, cur:0, bestStreak:0, maxMinutes:0, firstTimeWins:0, months:{}, last:''});
  bgChrono(matches).forEach(m=>{
    const rs = m.results || [];
    const winners = new Set(bgWinnerKeys(m));
    const keys = rs.map(r=> bgCanon(r.userId));
    rs.forEach((r,i)=>{
      const k = keys[i], p = get(k, r), won = winners.has(k);
      p.played++; p.last = m.date || p.last;
      if(won){ p.wins++; p.cur++; p.bestStreak = Math.max(p.bestStreak, p.cur); } else p.cur = 0;
      if(m.mode === 'coop'){ p.coopPlayed++; if(won) p.coopWins++; }
      else { if(r.position === 1) p.gold++; if(r.position === 2) p.silver++; if(r.position === 3) p.bronze++; }
      const dur = Number(m.duration) || 0;
      p.minutes += dur; p.maxMinutes = Math.max(p.maxMinutes, dur);
      const g = p.games[m.gameId] || (p.games[m.gameId] = {played:0, wins:0});
      g.played++; if(won) g.wins++;
      if(r.firstTime && won) p.firstTimeWins++;
      const mo = (m.date||'').slice(0,7); p.months[mo] = (p.months[mo]||0) + 1;
      keys.forEach((k2,j)=>{
        if(j === i || k2 === k) return;
        p.partners[k2] = (p.partners[k2]||0) + 1;
        if(m.mode !== 'coop' && r.position && rs[j].position){
          if(rs[j].position < r.position) p.beatenBy[k2] = (p.beatenBy[k2]||0) + 1;
          if(rs[j].position > r.position) p.beat[k2] = (p.beat[k2]||0) + 1;
        }
      });
    });
  });
  Object.values(P).forEach(p=>{
    p.winRate = p.played ? p.wins / p.played : 0;
    p.distinct = Object.keys(p.games).length;
    p.hIndex = hIndex(Object.values(p.games).map(g=> g.played));
  });
  return P;
}
// recordes de pontos e "reis" (maior vencedor) de cada jogo
function bgRecords(){
  const records = {}, kings = {};
  state.bg_games.forEach(g=>{
    const ms = bgMatchesOf(g.id);
    let best = null;
    ms.forEach(m=> (m.results||[]).forEach(r=>{
      if(bgHasScore(r) && (!best || Number(r.score) > best.score)) best = {score: Number(r.score), key: bgCanon(r.userId), name: r.username, matchId: m.id, date: m.date};
    }));
    if(best) records[g.id] = best;
    if(ms.length >= 5){
      const wins = {};
      ms.forEach(m=> bgWinnerKeys(m).forEach(k=> wins[k] = (wins[k]||0) + 1));
      const top = Object.entries(wins).sort((a,b)=> b[1]-a[1]);
      if(top.length && (!top[1] || top[1][1] < top[0][1])) kings[g.id] = {key: top[0][0], wins: top[0][1]};
    }
  });
  return {records, kings};
}

/* ---------- gráfico de barras simples (uma série) ---------- */
// items: [{label, value, tip}] — barras verticais, sem legenda (o título da seção nomeia a série)
function barChart(items, opts = {}){
  const max = Math.max(1, ...items.map(i=> i.value));
  const H = 120, W = Math.max(items.length * 34, 200), bw = Math.min(24, W / items.length - 6);
  const step = W / items.length;
  return `<div class="bar-chart" style="--h:${H}px">
    <svg viewBox="0 0 ${W} ${H + 22}" preserveAspectRatio="none" role="img" aria-label="${esc(opts.title || '')}">
      <line x1="0" y1="${H}" x2="${W}" y2="${H}" class="bc-axis"/>
      ${items.map((it,i)=>{
        const h = it.value ? Math.max(3, it.value / max * (H - 16)) : 0;
        const x = i * step + (step - bw) / 2;
        return `<g class="bc-g" data-tip="${esc(it.tip || `${it.label}: ${it.value}`)}">
          <rect class="bc-hit" x="${i*step}" y="0" width="${step}" height="${H}"/>
          ${h ? `<path class="bc-bar" d="M${x},${H} V${H-h+4} Q${x},${H-h} ${x+4},${H-h} H${x+bw-4} Q${x+bw},${H-h} ${x+bw},${H-h+4} V${H} Z"/>` : ''}
          ${it.value && (opts.labelAll || it.value === max) ? `<text x="${x + bw/2}" y="${H-h-5}" class="bc-val">${it.value}</text>` : ''}
          <text x="${x + bw/2}" y="${H + 15}" class="bc-lbl">${esc(it.label)}</text>
        </g>`;
      }).join('')}
    </svg>
  </div>`;
}
// barras horizontais (jogos mais jogados)
function hBars(items){
  const max = Math.max(1, ...items.map(i=> i.value));
  return `<div class="hbars">${items.map(it=>`
    <div class="hbar" data-tip="${esc(it.tip || '')}">
      <div class="hbar-lbl">${it.labelHtml}</div>
      <div class="hbar-track"><div class="hbar-fill" style="width:${Math.max(2, it.value / max * 100)}%"></div></div>
      <div class="hbar-val">${it.valueHtml}</div>
    </div>`).join('')}</div>`;
}

function renderBgMatches(){
  const f = state.bgMatchFilter;

  const list = all.filter(m=> (!f.game || m.gameId === f.game)

  const gamesPlayed = state.bg_games.filter(g=> bgMatchesOf(g.id).length).sort(byName);

    g.items.push(m);
  });
  return `
    ${pageHead('BoardGame', 'Partidas', 'Quem jogou, o que jogou, quem ganhou e como foi cada jogatina.',

      </select>
      <select data-bg-mfilter="player" style="width:auto;" aria-label="Filtrar por jogador">
        <option value="">Todos os jogadores</option>
        ${playersIn.map(p=> `<option value="${esc(p.key)}" ${f.player===p.key?'selected':''}>${esc(p.name)}</option>`).join('')}
      </select>
      <select data-bg-mfilter="period" style="width:auto;" aria-label="Filtrar por período">${bgPeriodOptions(all, f.period)}</select>
      ${f.game || f.player || f.period ? `<button class="ghost btn-icon" id="bgMatchFilterClear">${icon('x')}Limpar</button>` : ''}
    </div>
    <div class="stat-row">
      <div class="stat"><div class="label">Partidas</div><div class="value num">${list.length}</div></div>
      <div class="stat"><div class="label">Horas jogadas</div><div class="value num">${fmtMinutes(minutes)}</div></div>
      <div class="stat"><div class="label">Jogos diferentes</div><div class="value num">${new Set(list.map(m=> m.gameId)).size}</div></div>
      <div class="stat"><div class="label">Jogadores</div><div class="value num">${new Set(list.flatMap(m=> (m.results||[]).map(r=> bgCanon(r.userId)))).size}</div></div>
    </div>` : ''}
    ${!all.length ? `<div class="empty">${state.bg_games.length ? 'Nenhuma partida registrada ainda.' : 'Cadastre um jogo em Jogos para registrar a primeira partida.'}</div>`
      : !list.length ? `<div class="empty">Nenhuma partida com esses filtros.</div>`
      : groups.map(g=> `
        <div class="section-title">${capFirst(monthLabel(g.ym))} <span class="type-summary">· ${g.items.length} partida${g.items.length===1?'':'s'}</span></div>
        <div class="bgm-list">${g.items.map(bgMatchRow).join('')}</div>`).join('')}
  `;
}
function bgMatchRow(m){
  const g = bgGame(m.gameId);
  const rs = [...(m.results||[])].sort((a,b)=> (a.position||99) - (b.position||99));
  const winners = new Set(bgWinnerKeys(m));
  const photos = bgMatchPhotos(m).length;
  const sub = [formatFullDate(m.date), m.duration ? fmtMinutes(m.duration) : '', m.location || '', `${rs.length} jogador${rs.length===1?'':'es'}`].filter(Boolean).join(' · ');
  return `
  <div class="bgm-row" data-bg-open="match:${m.id}" role="button" tabindex="0">
    ${gameThumb(g, 'bg-thumb')}
    <div class="bgm-main">
      <div class="bgm-title">${esc(bgGameName(m))}${(m.expansions||[]).length ? `<span class="chip">+${m.expansions.length} exp.</span>` : ''}${bgModeBadge(m)}</div>
      <div class="bg-meta">${sub}</div>
      <div class="bgm-players">${rs.map(r=>{
        const k = bgCanon(r.userId), won = winners.has(k);
        return `<span class="bgm-p ${won ? 'won' : ''}">${won ? icon('trophy') : m.mode !== 'coop' && r.position ? `<i class="pos-num">${r.position}º</i>` : ''}${esc(bgName(k, r.username))}${bgHasScore(r) ? `<em>${fmtNum(Number(r.score))}</em>` : ''}</span>`;
      }).join('')}</div>
    </div>
    ${photos ? `<span class="bgm-side" title="${photos} foto${photos===1?'':'s'}">${icon('image')}${photos}</span>` : ''}
  </div>`;
}

/* ---------- Jogos (coleção do grupo) ---------- */
function renderBgLibrary(){
  const f = state.bgLibFilter;
  const q = f.q.trim().toLowerCase();
  const my = bgMyColl();
  const counts = {};
  state.bg_matches.forEach(m=> counts[m.gameId] = (counts[m.gameId]||0) + 1);
  let list = state.bg_games
    .filter(g=> f.showExp || g.type !== 'expansao')
    .filter(g=> !q || [g.name, g.publisher, g.designers, (g.mechanics||[]).join(' ')].join(' ').toLowerCase().includes(q))
    .filter(g=> !f.players || (g.players||[]).map(Number).includes(Number(f.players)))
    .filter(g=> !f.status
      || (f.status === 'owned' && (g.owners||[]).length)
      || (f.status === 'mine' && (g.owners||[]).includes(bgMyUid()))
      || (f.status === 'wantPlay' && bgWanting(g.id, 'wantPlay').length)
      || (f.status === 'wishlist' && bgWanting(g.id, 'wishlist').length)
      || (f.status === 'never' && !counts[g.id]));
  const sorters = {
    name: byName,
    played: (a,b)=> (counts[b.id]||0) - (counts[a.id]||0) || byName(a,b),
    rating: (a,b)=> (bgGameRating(b.id).avg ?? -1) - (bgGameRating(a.id).avg ?? -1) || byName(a,b),
    recent: (a,b)=> (b.createdAt||'').localeCompare(a.createdAt||''),
  };
  list = list.sort(sorters[f.sort] || byName);
  const bases = state.bg_games.filter(g=> g.type !== 'expansao').length;
  const exps = state.bg_games.length - bases;
  return `
    ${pageHead('BoardGame', 'Jogos', `${bases} jogo${bases===1?'':'s'}${exps ? ` e ${exps} ${exps===1?'expansão':'expansões'}` : ''} na coleção do grupo.`,

    ${state.bg_games.length ? `

      <div class="search-box">${icon('search')}<input id="bgLibSearch" placeholder="Jogo, editora, designer, mecânica" value="${esc(f.q)}" autocomplete="off"></div>

        <option value="">Qualquer nº de pessoas</option>
        ${Array.from({length: MAX_BG_PLAYERS}, (_,i)=> i+1).map(n=> `<option value="${n}" ${String(f.players)===String(n)?'selected':''}>Para ${n} pessoa${n===1?'':'s'}</option>`).join('')}

      <select data-bg-lfilter="status" style="width:auto;" aria-label="Coleção">
        <option value="">Todos os jogos</option>
        <option value="owned" ${f.status==='owned'?'selected':''}>Alguém do grupo tem</option>
        <option value="mine" ${f.status==='mine'?'selected':''}>Os que eu tenho</option>
        <option value="wantPlay" ${f.status==='wantPlay'?'selected':''}>Alguém quer jogar</option>
        <option value="wishlist" ${f.status==='wishlist'?'selected':''}>Na lista de desejos</option>
        <option value="never" ${f.status==='never'?'selected':''}>Nunca jogados</option>
      </select>
      <select data-bg-lfilter="sort" style="width:auto;" aria-label="Ordenar">
        <option value="name" ${f.sort==='name'?'selected':''}>Ordem alfabética</option>
        <option value="played" ${f.sort==='played'?'selected':''}>Mais jogados</option>
        <option value="rating" ${f.sort==='rating'?'selected':''}>Melhor nota do grupo</option>
        <option value="recent" ${f.sort==='recent'?'selected':''}>Cadastrados por último</option>

  const list = [...everyone.values()]
    .filter(p=> state.bgShowGuests || !p.guest)
    .map(p=> ({...p, s: agg[p.key], elo: elo.rating[p.key]}))
    .sort((a,b)=> ((b.s && b.s.played) || 0) - ((a.s && a.s.played) || 0) || byName(a,b));

function renderBgRankings(){

  const period = state.bgRankPeriod;
  const matches = state.bg_matches.filter(m=> (!gameId || m.gameId === gameId) && bgInPeriod(m, period));
  const agg = Object.values(bgAggregate(matches));
  const elo = bgElo(gameId || undefined);
  const gamesPlayed = state.bg_games.filter(g=> bgMatchesOf(g.id).length).sort(byName);
  const tabs = `
    <div class="momentos-tabs">
      <button data-bg-rank-tab="medals" class="${tab==='medals'?'active':''}">Medalhas</button>
      <button data-bg-rank-tab="elo" class="${tab==='elo'?'active':''}">Rating ELO</button>
      <button data-bg-rank-tab="games" class="${tab==='games'?'active':''}">Jogos</button>

    <div class="toolbar">
      <select id="bgRankGameSel" style="width:auto;" aria-label="Jogo">

        ${gamesPlayed.map(g=> `<option value="${g.id}" ${gameId===g.id?'selected':''}>${esc(g.name)}</option>`).join('')}

    </div>`;
  let body = '';
  if(tab === 'medals'){
    const rows = agg.sort((a,b)=> b.gold - a.gold || b.silver - a.silver || b.bronze - a.bronze || b.winRate - a.winRate || byName(a,b));
    body = !matches.length ? `<div class="empty">Nenhuma partida nesse filtro.</div>` : `
    <div class="table-wrap"><table class="rank-table">
      <thead><tr><th>#</th><th>Jogador</th><th>Partidas</th>
        <th title="1º lugar"><span class="trophy gold">${icon('trophy')}</span></th>
        <th title="2º lugar"><span class="trophy silver">${icon('trophy')}</span></th>
        <th title="3º lugar"><span class="trophy bronze">${icon('trophy')}</span></th>
        <th>Coop</th><th>Vitórias</th><th>Aproveitamento</th></tr></thead>
      <tbody>${rows.map((r,i)=> `<tr>
        <td class="rank-pos-cell">${i < 3 && r.gold + r.silver + r.bronze ? trophy(i+1) : `<span class="pos-num">${i+1}º</span>`}</td>
        <td><div class="user-cell">${bgAvatar(r.key)}${bgPlayerLink(r.key, r.name)}</div></td>
        <td>${r.played}</td><td class="medal">${r.gold}</td><td class="medal">${r.silver}</td><td class="medal">${r.bronze}</td>
        <td>${r.coopPlayed ? `${r.coopWins}/${r.coopPlayed}` : '—'}</td>
        <td>${r.wins}</td><td>${pct(r.winRate)}</td></tr>`).join('')}</tbody>
    </table></div>
    <div class="hint" style="margin-top:10px;">Ordem: mais 1º lugares, depois 2º, 3º e aproveitamento. Vitórias incluem as dos cooperativos e dos times.</div>`;
  } else if(tab === 'elo'){
    const rows = Object.entries(elo.rating).map(([k, r])=> ({key: k, r, n: elo.games[k]})).sort((a,b)=> b.r - a.r);
    body = !rows.length ? `<div class="empty">Sem partidas competitivas ainda.</div>` : `
    <div class="table-wrap"><table class="rank-table">
      <thead><tr><th>#</th><th>Jogador</th><th>Rating</th><th>Partidas</th><th></th></tr></thead>
      <tbody>${rows.map((x,i)=> `<tr>
        <td class="rank-pos-cell">${i < 3 ? trophy(i+1) : `<span class="pos-num">${i+1}º</span>`}</td>
        <td><div class="user-cell">${bgAvatar(x.key)}${bgPlayerLink(x.key)}</div></td>
        <td class="medal">${Math.round(x.r)}</td><td>${x.n}</td>
        <td>${x.n < 5 ? '<span class="chip" title="Menos de 5 partidas: o rating ainda está se ajustando">provisório</span>' : ''}</td></tr>`).join('')}</tbody>
    </table></div>
    <div class="hint" style="margin-top:10px;">Todo mundo começa com ${ELO_START}. Ganhar de quem tem rating alto vale mais pontos; perder para quem tem rating baixo tira mais. Cooperativos não contam.</div>`;
  } else {
    const rows = state.bg_games.filter(g=> g.type !== 'expansao').map(g=> ({g, n: bgMatchesOf(g.id).length, r: bgGameRating(g.id)}));
    const byPlays = rows.filter(x=> x.n).sort((a,b)=> b.n - a.n).slice(0, 10);
    const byRating = rows.filter(x=> x.r.avg != null).sort((a,b)=> b.r.avg - a.r.avg || b.r.n - a.r.n).slice(0, 10);
    body = `
      <div class="bg-duo" style="grid-template-columns:repeat(auto-fit, minmax(300px,1fr));">
        <div><div class="section-title" style="margin-top:0;">Mais jogados</div>
          ${byPlays.length ? hBars(byPlays.map(x=> ({value: x.n, labelHtml: `<a class="bg-link" data-bg-open="game:${x.g.id}">${esc(x.g.name)}</a>`, valueHtml: String(x.n), tip: `${x.g.name}: ${x.n} partidas`}))) : '<div class="empty">—</div>'}</div>
        <div><div class="section-title" style="margin-top:0;">Favoritos do grupo (nota)</div>
          ${byRating.length ? hBars(byRating.map(x=> ({value: x.r.avg, labelHtml: `<a class="bg-link" data-bg-open="game:${x.g.id}">${esc(x.g.name)}</a>`, valueHtml: `${fmtNum(x.r.avg)} <span class="hint">(${x.r.n})</span>`, tip: `${x.g.name}: nota ${fmtNum(x.r.avg)} com ${x.r.n} voto${x.r.n===1?'':'s'}`}))) : '<div class="empty">Ninguém deu nota ainda. Dê a sua na página de cada jogo.</div>'}</div>
      </div>`;
  }
  return `${pageHead('BoardGame', 'Rankings', 'Quadro de medalhas, rating ELO e os jogos preferidos do grupo.')}${tabs}${filters}${body}`;
}

/* ---------- Retrospectiva (estilo Ludohall) ---------- */
function renderBgRecap(){
  const years = [...new Set(state.bg_matches.map(m=> (m.date||'').slice(0,4)).filter(Boolean))].sort().reverse();
  const year = years.includes(state.bgRecapYear) ? state.bgRecapYear : years[0];
  if(!year) return `${pageHead('BoardGame', 'Retrospectiva', 'O resumo do ano da mesa.')}<div class="empty">Registre partidas para ver a retrospectiva.</div>`;
  const ms = state.bg_matches.filter(m=> (m.date||'').startsWith(year));
  const agg = Object.values(bgAggregate(ms));
  const minutes = ms.reduce((s,m)=> s + (Number(m.duration)||0), 0);
  const perGame = {};
  ms.forEach(m=> perGame[m.gameId] = (perGame[m.gameId]||0) + 1);
  const topGame = Object.entries(perGame).sort((a,b)=> b[1]-a[1])[0];
  const champion = [...agg].sort((a,b)=> b.wins - a.wins || b.winRate - a.winRate)[0];
  const mostActive = [...agg].sort((a,b)=> b.played - a.played)[0];
  const before = new Set(state.bg_matches.filter(m=> (m.date||'') < year).map(m=> m.gameId));
  const novelties = [...new Set(ms.map(m=> m.gameId))].filter(id=> !before.has(id)).map(bgGame).filter(Boolean);
  const perMonth = Array.from({length:12}, (_,i)=> ({label: MONTHS[i].slice(0,3), value: ms.filter(m=> Number((m.date||'').slice(5,7)) === i+1).length}));
  perMonth.forEach((x,i)=> x.tip = `${capFirst(MONTHS[i])}: ${x.value} partida${x.value===1?'':'s'}`);
  const bestMonth = perMonth.reduce((a,b)=> b.value > a.value ? b : a);
  const WD = ['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
  const wd = {};
  ms.forEach(m=>{ const d = new Date(m.date + 'T12:00:00').getDay(); wd[d] = (wd[d]||0) + 1; });
  const topWd = Object.entries(wd).sort((a,b)=> b[1]-a[1])[0];
  const locs = {};
  ms.forEach(m=>{ if(m.location) locs[m.location] = (locs[m.location]||0) + 1; });
  const topLoc = Object.entries(locs).sort((a,b)=> b[1]-a[1])[0];
  const longest = ms.filter(m=> Number(m.duration)).sort((a,b)=> b.duration - a.duration)[0];
  let bestScore = null;
  ms.forEach(m=> (m.results||[]).forEach(r=>{ if(bgHasScore(r) && (!bestScore || Number(r.score) > bestScore.score)) bestScore = {score: Number(r.score), key: bgCanon(r.userId), name: r.username, m}; }));
  const pairs = {};
  ms.forEach(m=>{ const ks = [...new Set((m.results||[]).map(r=> bgCanon(r.userId)))].sort(); ks.forEach((a,i)=> ks.slice(i+1).forEach(b=> pairs[a+'|'+b] = (pairs[a+'|'+b]||0) + 1)); });
  const topPair = Object.entries(pairs).sort((a,b)=> b[1]-a[1])[0];
  const me = agg.find(p=> p.key === bgMyUid());
  const myFav = me && Object.entries(me.games).sort((a,b)=> b[1].played - a[1].played)[0];
  const myPartner = me && Object.entries(me.partners).sort((a,b)=> b[1]-a[1])[0];
  const card = (ic, label, value, sub)=> `<div class="bg-recap-card">${icon(ic)}<span>${label}</span><b>${value}</b>${sub ? `<em>${sub}</em>` : ''}</div>`;
  return `
    ${pageHead('BoardGame', `Retrospectiva ${year}`, 'O resumo do ano da mesa, no estilo Ludohall.')}
    ${years.length > 1 ? `<div class="toolbar"><div class="chip-filter">${years.map(y=> `<button data-bg-recap-year="${y}" class="${y===year?'active':''}">${y}</button>`).join('')}</div></div>` : ''}
    <div class="bg-recap-hero">
      <div><b>${ms.length}</b><span>partidas</span></div>
      <div><b>${fmtMinutes(minutes)}</b><span>de jogo</span></div>
      <div><b>${Object.keys(perGame).length}</b><span>jogos diferentes</span></div>
      <div><b>${agg.length}</b><span>jogadores</span></div>

/* ---------- placar para compartilhar (imagem) ---------- */
async function bgShareScoreboard(m){
  const rs = [...(m.results||[])].sort((a,b)=> (a.position||99) - (b.position||99));
  const W = 1080, rowH = 86, H = Math.max(1080, 420 + rs.length * rowH + 120);
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  x.fillStyle = '#141210'; x.fillRect(0,0,W,H);
  x.fillStyle = '#C9A227'; x.fillRect(0,0,W,12);
  const g = bgGame(m.gameId);
  let top = 90;
  if(g && g.photo && g.photo.startsWith('data:')){
    const img = await new Promise(res=>{ const i = new Image(); i.onload = ()=> res(i); i.onerror = ()=> res(null); i.src = g.photo; });
    if(img){ const r = Math.min(220 / img.width, 220 / img.height); x.drawImage(img, 80, top, img.width * r, img.height * r); }
  }
  x.fillStyle = '#C9A227'; x.font = '600 30px Oswald, sans-serif'; x.fillText('CAVERNOSOS · BOARDGAME', 330, top + 36);
  x.fillStyle = '#F2EEE6'; x.font = '700 64px Oswald, sans-serif'; x.fillText(bgGameName(m).slice(0, 26), 330, top + 112);
  x.fillStyle = '#A79C87'; x.font = '32px Inter, sans-serif';
  x.fillText([formatFullDate(m.date), m.duration ? fmtMinutes(m.duration) : '', m.location || ''].filter(Boolean).join(' · ').slice(0, 48), 330, top + 166);
  top = 400;
  if(m.mode === 'coop'){
    x.fillStyle = m.coopWin ? '#4CBF7A' : '#E0645A'; x.font = '700 54px Oswald, sans-serif';
    x.fillText(m.coopWin ? 'VITÓRIA DO GRUPO!' : 'DERROTA PARA O JOGO', 80, top); top += 50;
  }
  const medal = ['#D4A017','#9AA3AE','#B87333'];
  rs.forEach((r,i)=>{
    const y = top + i * rowH;
    x.fillStyle = i % 2 ? '#1B1814' : '#211D18'; x.fillRect(60, y, W - 120, rowH - 8);
    x.fillStyle = m.mode !== 'coop' && r.position <= 3 ? medal[r.position-1] : '#A79C87';
    x.font = '700 44px Oswald, sans-serif';
    x.fillText(m.mode === 'coop' ? '•' : `${r.position}º`, 90, y + 56);
    x.fillStyle = '#F2EEE6'; x.font = '600 40px Inter, sans-serif';
    x.fillText(bgName(bgCanon(r.userId), r.username).slice(0, 26) + (m.mode === 'teams' && r.team ? `  (Time ${r.team})` : ''), 200, y + 54);
    if(bgHasScore(r)){ x.fillStyle = '#C9A227'; x.font = '700 42px Oswald, sans-serif'; x.textAlign = 'right'; x.fillText(`${fmtNum(Number(r.score))} pts`, W - 90, y + 56); x.textAlign = 'left'; }
  });
  const blob = await new Promise(res=> c.toBlob(res, 'image/png'));
  const file = new File([blob], `placar-${(bgGameName(m)).replace(/[^\w]+/g,'-').toLowerCase()}-${m.date}.png`, {type:'image/png'});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title: `Placar: ${bgGameName(m)}`}); return; }catch(e){ if(e.name === 'AbortError') return; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = file.name; a.click();
  setTimeout(()=> URL.revokeObjectURL(a.href), 5000);
  toast('Imagem do placar baixada.');
}

/* ---------- Ludopedia (via função da Vercel) ---------- */
async function ludopediaApi(params){
  const token = await auth.currentUser.getIdToken();
  const r = await fetch('/api/ludopedia?' + new URLSearchParams(params), {headers: {Authorization: 'Bearer ' + token}});
  const data = await r.json().catch(()=> ({}));
  if(!r.ok) throw new Error(data.error || 'Falha ao consultar a Ludopedia.');
  return data;
}

/* ---------- eventos ---------- */
function bindOtherEnvEvents(){
  document.querySelectorAll('[data-add-video]').forEach(b=>{
    b.onclick = ()=>{ state.modal = {type:'video', data:{collection: b.dataset.addVideo}}; render(); };
  });
  document.querySelectorAll('[data-add-photo]').forEach(b=>{
    b.onclick = ()=>{ state.modal = {type:'photo', data:{collection: b.dataset.addPhoto, matchId: b.dataset.photoMatch || ''}}; render(); };
  });
  document.querySelectorAll('[data-del-item]').forEach(b=>{
    b.onclick = async e=>{
      e.stopPropagation();
      const [col, id] = b.dataset.delItem.split(':');
      const label = b.dataset.delLabel || 'item';
      if(!confirm(`Excluir ${label === 'foto' ? 'esta' : 'este'} ${label}?`)) return;
      state[col] = state[col].filter(x=> x.id !== id);
      if(await sSet(col, state[col])){ render(); toast(`${label[0].toUpperCase() + label.slice(1)} excluíd${label === 'foto' ? 'a' : 'o'}.`); }
    };
  });
  document.querySelectorAll('[data-video-date]').forEach(s=>{
    s.onchange = ()=>{ videoFilter(s.dataset.videoDate).date = s.value; render(); };
  });
  document.querySelectorAll('[data-video-date-pick]').forEach(s=>{
    s.onchange = ()=>{ videoFilter(s.dataset.videoDatePick).date = s.value; render(); };
  });
  document.querySelectorAll('[data-video-clear]').forEach(b=>{
    b.onclick = ()=>{ state.videoFilters[b.dataset.videoClear] = {date:'', q:''}; render(); };
  });
  document.querySelectorAll('[data-video-search]').forEach(inp=>{
    inp.oninput = ()=>{
      const col = inp.dataset.videoSearch;
      videoFilter(col).q = inp.value;
      render();
      const el = document.querySelector(`[data-video-search="${col}"]`);
      if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    };
  });
  document.querySelectorAll('[data-edit-video]').forEach(b=>{
    b.onclick = ()=>{
      const [collection, id] = b.dataset.editVideo.split(':');
      state.modal = {type:'video', data:{collection, id}};
      render();
    };
  });
  document.querySelectorAll('[data-bg-media-tab]').forEach(b=>{
    b.onclick = ()=>{ state.bgMediaTab = b.dataset.bgMediaTab; render(); };
  });

  // navegação para partida / jogo / jogador
  document.querySelectorAll('[data-bg-open]').forEach(el=>{
    const open = e=>{
      e.stopPropagation();
      const [kind, ...rest] = el.dataset.bgOpen.split(':');
      const id = rest.join(':');
      if(state.bgOpen) state.bgStack.push(state.bgOpen);
      state.bgOpen = {kind, id};
      state.modal = null;
      if(!state.view.startsWith('bg-')) state.view = 'bg-matches';
      render(); window.scrollTo(0,0);
    };
    el.onclick = open;
    if(el.getAttribute('role') === 'button') el.onkeydown = e=>{ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); open(e); } };
  });
  document.querySelectorAll('[data-bg-back]').forEach(b=>{
    b.onclick = ()=>{ state.bgOpen = state.bgStack.pop() || null; render(); window.scrollTo(0,0); };
  });

  // filtros
  document.querySelectorAll('[data-bg-mfilter]').forEach(s=>{
    s.onchange = ()=>{ state.bgMatchFilter[s.dataset.bgMfilter] = s.value; render(); };
  });
  const mClear = document.getElementById('bgMatchFilterClear');
  if(mClear) mClear.onclick = ()=>{ state.bgMatchFilter = {game:'', player:'', period:''}; render(); };
  document.querySelectorAll('[data-bg-lfilter]').forEach(s=>{
    s.onchange = ()=>{ state.bgLibFilter[s.dataset.bgLfilter] = s.type === 'checkbox' ? s.checked : s.value; render(); };
  });
  const libSearch = document.getElementById('bgLibSearch');
  if(libSearch) libSearch.oninput = ()=>{
    state.bgLibFilter.q = libSearch.value;
    render();
    const el = document.getElementById('bgLibSearch');
    if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  };
  document.querySelectorAll('[data-bg-rank-tab]').forEach(b=>{ b.onclick = ()=>{ state.bgRankTab = b.dataset.bgRankTab; render(); }; });
  const rg = document.getElementById('bgRankGameSel');
  if(rg) rg.onchange = ()=>{ state.bgRankGame = rg.value; render(); };
  const rp = document.getElementById('bgRankPeriodSel');
  if(rp) rp.onchange = ()=>{ state.bgRankPeriod = rp.value; render(); };
  document.querySelectorAll('[data-bg-recap-year]').forEach(b=>{ b.onclick = ()=>{ state.bgRecapYear = b.dataset.bgRecapYear; render(); }; });
  const sg = document.getElementById('bgShowGuests');
  if(sg) sg.onchange = ()=>{ state.bgShowGuests = sg.checked; render(); };

  // tooltips dos gráficos
  document.querySelectorAll('[data-tip]').forEach(el=>{
    el.onmouseenter = ()=> showTip(el);
    el.onmouseleave = hideTip;
  });

  // jogos
  const addGame = document.getElementById('addBgGameBtn');
  if(addGame) addGame.onclick = ()=>{ state.modal = {type:'bgGame', data:null}; render(); };
  const randomBtn = document.getElementById('bgRandomBtn');
  if(randomBtn) randomBtn.onclick = ()=>{ state.modal = {type:'bgRandom', data:{owned: state.bg_games.some(g=> (g.owners||[]).length)}}; render(); };
  document.querySelectorAll('[data-edit-bg-game]').forEach(b=>{
    b.onclick = e=>{ e.stopPropagation(); state.modal = {type:'bgGame', data: bgGame(b.dataset.editBgGame)}; render(); };
  });
  document.querySelectorAll('[data-del-bg-game]').forEach(b=>{
    b.onclick = async e=>{
      e.stopPropagation();
      const g = bgGame(b.dataset.delBgGame);
      const n = bgMatchesOf(g.id).length;
      if(n){ toast(`"${g.name}" tem ${n} partida${n===1?'':'s'} registrada${n===1?'':'s'}. Exclua as partidas antes para não bagunçar o ranking.`, 'error'); return; }
      if(bgExpansionsOf(g.id).length){ toast(`"${g.name}" tem expansões cadastradas. Exclua ou mude as expansões antes.`, 'error'); return; }
      if(!confirm(`Excluir "${g.name}"?`)) return;
      state.bg_games = state.bg_games.filter(x=> x.id !== g.id);
      if(await sSet('bg_games', state.bg_games)){ state.bgOpen = state.bgStack.pop() || null; render(); toast('Jogo excluído.'); }
    };
  });
  document.querySelectorAll('[data-bg-own]').forEach(b=>{
    b.onclick = async ()=>{
      const g = bgGame(b.dataset.bgOwn), me = bgMyUid();
      const owners = new Set(g.owners || []);
      owners.has(me) ? owners.delete(me) : owners.add(me);
      g.owners = [...owners];
      if(await sSet('bg_games', state.bg_games)) render();
    };
  });
  document.querySelectorAll('[data-bg-coll]').forEach(b=>{
    b.onclick = async ()=>{
      const [list, gameId] = b.dataset.bgColl.split(':');
      const c = bgMyColl();
      c[list] = c[list].includes(gameId) ? c[list].filter(x=> x !== gameId) : [...c[list], gameId];
      if(await bgSaveMyColl(c)) render();
    };
  });
  document.querySelectorAll('[data-bg-rate]').forEach(s=>{
    s.onchange = async ()=>{
      const c = bgMyColl();
      c.ratings = {...c.ratings};
      if(s.value === '') delete c.ratings[s.dataset.bgRate]; else c.ratings[s.dataset.bgRate] = clamp10(s.value);
      if(await bgSaveMyColl(c)){ render(); toast('Nota salva.'); }
    };
  });

  // partidas
  const addMatch = document.getElementById('addBgMatchBtn');
  if(addMatch) addMatch.onclick = ()=>{ state.modal = {type:'bgMatch', data:null}; render(); };
  document.querySelectorAll('[data-edit-bg-match]').forEach(b=>{
    b.onclick = ()=>{ state.modal = {type:'bgMatch', data: state.bg_matches.find(m=> m.id === b.dataset.editBgMatch)}; render(); };
  });
  document.querySelectorAll('[data-del-bg-match]').forEach(b=>{
    b.onclick = async ()=>{
      const m = state.bg_matches.find(x=> x.id === b.dataset.delBgMatch);
      if(!confirm(`Excluir a partida de ${bgGameName(m)} (${formatDate(m.date)})? Ela sai do ranking.`)) return;
      state.bg_matches = state.bg_matches.filter(x=> x.id !== m.id);
      if(await sSet('bg_matches', state.bg_matches)){ state.bgOpen = state.bgStack.pop() || null; render(); toast('Partida excluída.'); }
    };
  });
  document.querySelectorAll('[data-bg-share]').forEach(b=>{
    b.onclick = async ()=>{
      b.disabled = true;
      try{ await bgShareScoreboard(state.bg_matches.find(m=> m.id === b.dataset.bgShare)); }
      catch(e){ console.error(e); toast('Não foi possível gerar a imagem.', 'error'); }
      b.disabled = false;
    };
  });

  // convidados
  const addGuest = document.getElementById('addBgGuestBtn');
  if(addGuest) addGuest.onclick = ()=>{ state.modal = {type:'bgGuest', data:null}; render(); };
  document.querySelectorAll('[data-edit-bg-guest]').forEach(b=>{
    b.onclick = ()=>{ state.modal = {type:'bgGuest', data: state.bg_guests.find(g=> g.id === b.dataset.editBgGuest)}; render(); };
  });

  bindBgGameForm();
  bindBgMatchForm();
  bindBgGuestForm();
  bindBgRandomForm();
}

// tooltip único para os gráficos
function showTip(el){
  let t = document.getElementById('chartTip');
  if(!t){ t = document.createElement('div'); t.id = 'chartTip'; t.className = 'chart-tip'; document.body.appendChild(t); }
  t.textContent = el.dataset.tip;
  const r = el.getBoundingClientRect();
  t.style.display = 'block';
  const left = Math.min(window.innerWidth - t.offsetWidth - 8, Math.max(8, r.left + r.width/2 - t.offsetWidth/2));
  t.style.left = left + 'px';
  t.style.top = Math.max(8, r.top - t.offsetHeight - 8) + 'px';
}
function hideTip(){ const t = document.getElementById('chartTip'); if(t) t.style.display = 'none'; }

function bindBgGameForm(){
  const form = document.getElementById('bgGameForm');
  if(!form) return;
  const existing = state.modal.data;
  let photo = existing ? existing.photo || null : null;
  const pick = document.getElementById('bgGamePhotoPick');
  const input = document.getElementById('bgGamePhotoInput');
  const setPreview = src=>{ document.getElementById('bgGamePhotoPreview').outerHTML = `<img src="${src}" id="bgGamePhotoPreview">`; };
  pick.onclick = ()=> input.click();
  input.onchange = async ()=>{
    const file = input.files[0];
    if(!file) return;
    photo = await resizeImage(file, 600, 0.75);
    setPreview(photo);
  };
  const remove = document.getElementById('bgGamePhotoRemove');
  if(remove) remove.onclick = ()=>{
    photo = null;
    document.getElementById('bgGamePhotoPreview').outerHTML = `<div id="bgGamePhotoPreview"><div>Foto removida. Toque para escolher outra.</div></div>`;
    remove.remove();
  };
  const typeSel = document.getElementById('bgGameType');
  typeSel.onchange = ()=>{ document.getElementById('bgGameBaseField').hidden = typeSel.value !== 'expansao'; };

  // busca na Ludopedia
  const out = document.getElementById('ludoResults');
  const q = document.getElementById('ludoQuery');
  const search = async ()=>{
    if(!q.value.trim()) return;
    out.innerHTML = '<div class="hint">Buscando...</div>';
    try{
      const data = await ludopediaApi({search: q.value.trim()});
      const games = data.jogos || [];
      out.innerHTML = games.length ? `<div class="ludo-list">${games.slice(0, 10).map(j=> `
        <button type="button" class="ludo-item" data-ludo-id="${j.id}">${j.thumb ? `<img src="${esc(j.thumb)}" alt="" referrerpolicy="no-referrer">` : icon('dices')}<span>${esc(j.name)}${j.year ? ` <em>(${j.year})</em>` : ''}</span></button>`).join('')}</div>`
        : '<div class="hint">Nada encontrado com esse nome.</div>';
      lucide.createIcons();
      out.querySelectorAll('[data-ludo-id]').forEach(b=> b.onclick = ()=> fill(b.dataset.ludoId));
    }catch(e){ out.innerHTML = `<div class="form-error">${esc(e.message)}</div>`; }
  };
  const fill = async id=>{
    out.innerHTML = '<div class="hint">Carregando a ficha...</div>';
    try{
      const {jogo: j} = await ludopediaApi({id});
      const set = (n, v)=>{ if(v != null && v !== '') form.elements[n].value = v; };
      set('name', j.name); set('year', j.year); set('minAge', j.minAge); set('time', j.time);
      set('publisher', j.publisher); set('designers', (j.designers||[]).join(', '));
      set('mechanics', (j.mechanics||[]).join(', ')); set('categories', (j.categories||[]).join(', '));
      set('ludopediaUrl', j.url); set('ludopediaId', j.id);
      if(j.type === 'expansao'){ typeSel.value = 'expansao'; typeSel.onchange(); }
      if(j.minPlayers){
        const max = Math.min(j.maxPlayers || j.minPlayers, MAX_BG_PLAYERS);
        form.querySelectorAll('input[name=players]').forEach(cb=> cb.checked = Number(cb.value) >= j.minPlayers && Number(cb.value) <= max);
      }
      if(j.image){
        const blob = await (await fetch(j.image)).blob();
        photo = await resizeImage(new File([blob], 'capa.jpg', {type: blob.type}), 600, 0.75);
        setPreview(photo);
      }
      out.innerHTML = `<div class="hint" style="color:var(--accent);">Ficha preenchida com os dados da Ludopedia. Confira e salve.</div>`;
    }catch(e){ out.innerHTML = `<div class="form-error">${esc(e.message)}</div>`; }
  };
  document.getElementById('ludoSearchBtn').onclick = search;
  q.onkeydown = e=>{ if(e.key === 'Enter'){ e.preventDefault(); search(); } };

  const list = v => String(v||'').split(',').map(s=> s.trim()).filter(Boolean);
  const num = v => v === '' || v == null ? null : Number(v);
  form.onsubmit = async e=>{
    e.preventDefault();
    const fd = new FormData(form);
    const name = fd.get('name').trim();
    const players = fd.getAll('players').map(Number);
    const type = fd.get('type');
    if(!name) return formError('Informe o nome do jogo.');
    if(type === 'expansao' && !fd.get('baseId')) return formError('Escolha de qual jogo é a expansão.');
    if(type !== 'expansao' && !players.length) return formError('Marque quantas pessoas o jogo suporta.');
    if(state.bg_games.some(g=> g.name.toLowerCase() === name.toLowerCase() && (!existing || g.id !== existing.id))) return formError('Esse jogo já está cadastrado.');
    formError(''); formBusy(true);
    const now = new Date().toISOString();
    const data = {name, type, baseId: type === 'expansao' ? fd.get('baseId') : '', publisher: fd.get('publisher').trim(), players, photo,
      year: num(fd.get('year')), minAge: num(fd.get('minAge')), time: num(fd.get('time')), weight: num(fd.get('weight')),
      designers: fd.get('designers').trim(), mechanics: list(fd.get('mechanics')), categories: list(fd.get('categories')),
      description: fd.get('description').trim(), owners: fd.getAll('owners'),
      ludopediaUrl: fd.get('ludopediaUrl').trim(), ludopediaId: fd.get('ludopediaId') || ''};
    if(existing) Object.assign(bgGame(existing.id), data, {updatedAt: now, updatedBy: state.currentUser.username});
    else state.bg_games.push({id: uid(), ...data, createdAt: now, createdBy: state.currentUser.username});
    state.modal = null;
    if(await sSet('bg_games', state.bg_games)){ render(); toast(existing ? 'Jogo atualizado.' : `${name} cadastrado.`); }
  };
}

function bindBgMatchForm(){
  const form = document.getElementById('bgMatchForm');
  if(!form) return;
  const existing = state.modal.data;
  const gameSel = document.getElementById('bgMatchGame');
  const rowsEl = document.getElementById('bgResultRows');
  const newGuests = [];            // convidados criados neste formulário
  const newPhotos = [];
  const teamPos = {};              // time → colocação
  // jogador → {name, position, score, faction, firstTime, team}
  const results = new Map((existing && existing.results || []).map(r=>{
    if(existing.mode === 'teams' && r.team) teamPos[r.team] = r.position;
    return [r.userId, {name: bgName(r.userId, r.username), position: r.position || '', score: r.score ?? '', faction: r.faction || '', firstTime: !!r.firstTime, team: r.team || ''}];
  }));
  const mode = ()=> form.querySelector('[name=mode]:checked').value;

  // lista de jogadores: quem mais joga com você aparece primeiro (como no registro da Ludopedia)
  function drawPlayers(){
    const me = bgMyUid();
    const recent = {};
    bgChrono(state.bg_matches).slice(-30).forEach(m=>{
      const ks = (m.results||[]).map(r=> r.userId);
      if(ks.includes(me)) ks.forEach(k=> recent[k] = (recent[k]||0) + 1);
    });
    const all = [...bgPlayers(), ...newGuests.map(g=> ({key: GUEST + g.id, name: g.name, guest: true}))];
    results.forEach((r, k)=>{ if(!all.some(p=> p.key === k)) all.push({key: k, name: r.name, guest: isGuestKey(k)}); });
    all.sort((a,b)=> (b.key === me) - (a.key === me) || (recent[b.key]||0) - (recent[a.key]||0) || byName(a,b));
    document.getElementById('bgMatchPlayers').innerHTML = all.map(p=> `
      <label class="check-pill"><input type="checkbox" value="${esc(p.key)}" data-name="${esc(p.name)}" ${results.has(p.key) ? 'checked' : ''}>${esc(p.name)}${p.guest ? ' <em class="hint">(conv.)</em>' : ''}</label>`).join('');
    document.querySelectorAll('#bgMatchPlayers input').forEach(cb=>{
      cb.onchange = ()=>{
        if(cb.checked) results.set(cb.value, {name: cb.dataset.name, position:'', score:'', faction:'', firstTime: isFirstTime(cb.value), team:''});
        else results.delete(cb.value);
        results.forEach(r=>{ if(r.position > results.size) r.position = ''; });
        drawRows();
      };
    });
  }
  // 1ª vez: nunca jogou este jogo antes desta partida
  function isFirstTime(key){
    const gid = gameSel.value;
    if(!gid) return false;
    const date = form.elements.date.value;
    return !state.bg_matches.some(m=> m.gameId === gid && (!existing || m.id !== existing.id) && (m.date||'') <= date && (m.results||[]).some(r=> bgCanon(r.userId) === bgCanon(key)));
  }
  function drawExpansions(){
    const exps = bgExpansionsOf(gameSel.value);
    const chosen = new Set(existing && existing.gameId === gameSel.value ? existing.expansions || [] : []);
    document.getElementById('bgExpField').hidden = !exps.length;
    document.getElementById('bgExpPills').innerHTML = exps.map(e=> `<label class="check-pill"><input type="checkbox" name="expansions" value="${e.id}" ${chosen.has(e.id)?'checked':''}>${esc(e.name)}</label>`).join('');
  }
  function drawRows(){
    const md = mode();
    document.getElementById('bgCoopField').hidden = md !== 'coop';
    document.getElementById('bgSortByScore').hidden = md !== 'comp';
    const n = results.size;
    if(!n){ rowsEl.innerHTML = `<div class="hint" style="padding:4px 0 8px;">Marque quem jogou para lançar o resultado.</div>`; updateHint(); return; }
    const entries = [...results.entries()].sort((a,b)=> md === 'teams' ? (a[1].team||'Z').localeCompare(b[1].team||'Z') : (a[1].position||99) - (b[1].position||99));
    const teamsUsed = [...new Set(entries.map(([,r])=> r.team).filter(Boolean))].sort();
    rowsEl.innerHTML = `
      <div class="result-rows mode-${md}">
        <div class="result-row head"><span>Jogador</span>${md === 'comp' ? '<span>Posição</span>' : md === 'teams' ? '<span>Time</span>' : ''}<span>Pontos</span><span>Facção / personagem</span><span title="Primeira vez jogando">1ª vez</span></div>
        ${entries.map(([id, r])=>`
        <div class="result-row">
          <span class="name">${md === 'comp' && r.position ? trophy(Number(r.position)) : ''}${esc(r.name)}</span>
          ${md === 'comp' ? `<select data-f="position" data-id="${esc(id)}"><option value="">—</option>${Array.from({length:n}, (_, i)=> i+1).map(p=>`<option value="${p}" ${Number(r.position)===p?'selected':''}>${p}º lugar</option>`).join('')}</select>` : ''}
          ${md === 'teams' ? `<select data-f="team" data-id="${esc(id)}"><option value="">—</option>${BG_TEAMS.map(t=> `<option value="${t}" ${r.team===t?'selected':''}>Time ${t}</option>`).join('')}</select>` : ''}
          <input type="number" data-f="score" data-id="${esc(id)}" value="${r.score}" placeholder="pts" step="any" inputmode="decimal">
          <input data-f="faction" data-id="${esc(id)}" value="${esc(r.faction)}" maxlength="40" placeholder="opcional">
          <input type="checkbox" class="checkbox" data-f="firstTime" data-id="${esc(id)}" ${r.firstTime ? 'checked' : ''} aria-label="Primeira vez">
        </div>`).join('')}
      </div>
      ${md === 'teams' && teamsUsed.length ? `
      <div class="bg-team-pos"><span>Colocação dos times:</span>${teamsUsed.map(t=> `<label>Time ${t}<select data-team-pos="${t}"><option value="">—</option>${teamsUsed.map((_,i)=> `<option value="${i+1}" ${Number(teamPos[t])===i+1?'selected':''}>${i+1}º</option>`).join('')}</select></label>`).join('')}</div>` : ''}`;
    rowsEl.querySelectorAll('[data-f]').forEach(el=>{
      const r = results.get(el.dataset.id), f = el.dataset.f;
      if(f === 'firstTime') el.onchange = ()=>{ r.firstTime = el.checked; };
      else if(f === 'position' || f === 'team') el.onchange = ()=>{ r[f] = f === 'position' ? (el.value ? Number(el.value) : '') : el.value; drawRows(); };
      else el.oninput = ()=>{ r[f] = el.value; };
    });
    rowsEl.querySelectorAll('[data-team-pos]').forEach(s=> s.onchange = ()=>{ teamPos[s.dataset.teamPos] = s.value ? Number(s.value) : ''; });
    lucide.createIcons();
    updateHint();
  }
  function updateHint(){
    const g = bgGame(gameSel.value);
    const hint = document.getElementById('bgMatchGameHint');
    if(!g || !(g.players||[]).length){ hint.textContent = ''; return; }
    const n = results.size;
    const ok = !n || g.players.map(Number).includes(Math.min(n, MAX_BG_PLAYERS));
    hint.innerHTML = ok ? `Suporta ${fmtPlayerCounts(g.players)}${g.time ? ` · cerca de ${g.time} min` : ''}.` : `<span style="color:var(--danger)">Atenção: ${esc(g.name)} suporta ${fmtPlayerCounts(g.players)} e a partida tem ${n}.</span>`;
  }
  gameSel.onchange = ()=>{
    drawExpansions();
    results.forEach((r,k)=> r.firstTime = isFirstTime(k));
    const g = bgGame(gameSel.value);
    if(g && g.time && !form.elements.duration.value) form.elements.duration.placeholder = `ex: ${g.time}`;
    drawRows();
  };
  form.querySelectorAll('[name=mode]').forEach(r=> r.onchange = drawRows);
  document.getElementById('bgSortByScore').onclick = ()=>{
    const scored = [...results.values()].filter(r=> r.score !== '' && !isNaN(r.score));
    if(!scored.length){ formError('Preencha a pontuação para ordenar.'); return; }
    formError('');
    const sorted = [...scored].sort((a,b)=> Number(b.score) - Number(a.score));
    sorted.forEach((r,i)=>{ r.position = i > 0 && Number(r.score) === Number(sorted[i-1].score) ? sorted[i-1].position : i + 1; });
    drawRows();
  };
  // convidado na hora
  document.getElementById('bgAddGuestInline').onclick = ()=>{
    const box = document.getElementById('bgGuestInline');
    box.hidden = !box.hidden;
    if(!box.hidden) document.getElementById('bgGuestName').focus();
  };
  const addGuest = ()=>{
    const inp = document.getElementById('bgGuestName');
    const name = cleanName(inp.value);
    if(!name) return;
    const same = [...state.bg_guests, ...newGuests].find(g=> g.name.toLowerCase() === name.toLowerCase());
    const g = same || {id: uid(), name, createdAt: new Date().toISOString(), createdBy: state.currentUser.username};
    if(!same) newGuests.push(g);
    results.set(GUEST + g.id, {name: g.name, position:'', score:'', faction:'', firstTime: isFirstTime(GUEST + g.id), team:''});
    inp.value = '';
    drawPlayers(); drawRows();
  };
  document.getElementById('bgGuestAdd').onclick = addGuest;
  document.getElementById('bgGuestName').onkeydown = e=>{ if(e.key === 'Enter'){ e.preventDefault(); addGuest(); } };

  // fotos (escolher ou arrastar)
  const photoPick = document.getElementById('bgPhotoPick');
  if(photoPick){
    const photoInput = document.getElementById('bgPhotoInput');
    const addFiles = async files=>{
      for(const file of files){
        try{
          const data = await resizeImage(file, 1280, 0.72), key = uid();
          newPhotos.push({key, data});
          const el = document.createElement('div');
          el.className = 'pm-thumb';
          el.innerHTML = `<img src="${data}" alt=""><button type="button" class="pm-thumb-x" aria-label="Remover foto">${icon('x')}</button>`;
          el.querySelector('button').onclick = ()=>{ newPhotos.splice(newPhotos.findIndex(p=> p.key === key), 1); el.remove(); };
          photoPick.before(el);
        }catch(e){ toast(`Não consegui abrir ${file.name}.`, 'error'); }
      }
      lucide.createIcons();
    };
    photoPick.onclick = ()=> photoInput.click();
    photoInput.onchange = ()=>{ const f = [...photoInput.files]; photoInput.value = ''; addFiles(f); };
    const drop = document.getElementById('bgPhotoThumbs');
    drop.ondragover = e=>{ e.preventDefault(); drop.classList.add('drag-over'); };
    drop.ondragleave = e=>{ if(!drop.contains(e.relatedTarget)) drop.classList.remove('drag-over'); };
    drop.ondrop = e=>{ e.preventDefault(); drop.classList.remove('drag-over'); addFiles([...e.dataTransfer.files].filter(f=> f.type.startsWith('image/'))); };
  }

  drawPlayers(); drawExpansions(); drawRows();

  form.onsubmit = async e=>{
    e.preventDefault();
    const fd = new FormData(form);
    const gameId = fd.get('gameId');
    const md = mode();
    if(!gameId) return formError('Selecione o jogo.');
    if(!results.size) return formError('Marque quem jogou.');
    const rows = [...results.entries()];
    if(md === 'comp'){
      const missing = rows.filter(([,r])=> !r.position);
      if(missing.length) return formError(`Defina a posição de ${missing.map(([,r])=> r.name).join(', ')}.`);
    }
    if(md === 'teams'){
      const noTeam = rows.filter(([,r])=> !r.team);
      if(noTeam.length) return formError(`Escolha o time de ${noTeam.map(([,r])=> r.name).join(', ')}.`);
      const teams = [...new Set(rows.map(([,r])=> r.team))];
      if(teams.length < 2) return formError('Numa partida de times, precisa de pelo menos 2 times.');
      const unplaced = teams.filter(t=> !teamPos[t]);
      if(unplaced.length) return formError(`Defina a colocação do${unplaced.length > 1 ? 's times' : ' time'} ${unplaced.join(', ')}.`);
    }
    const coopVal = fd.get('coopWin');
    if(md === 'coop' && coopVal == null) return formError('Marque se o grupo venceu ou perdeu.');
    formError(''); formBusy(true);
    if(newGuests.length){
      state.bg_guests.push(...newGuests.filter(g=> [...results.keys()].includes(GUEST + g.id)));
      if(!await sSet('bg_guests', state.bg_guests)){ formBusy(false); return; }
    }
    const num = v => v === '' || v == null || isNaN(v) ? null : Number(v);
    const payload = {
      date: fd.get('date'), time: fd.get('time') || '', gameId, gameName: bgGame(gameId).name,
      expansions: fd.getAll('expansions'), mode: md, coopWin: md === 'coop' ? coopVal === '1' : null,
      duration: num(fd.get('duration')), location: fd.get('location').trim(), notes: fd.get('notes').trim(),
      results: rows.map(([userId, r])=> ({userId, username: r.name,
        position: md === 'comp' ? Number(r.position) : md === 'teams' ? Number(teamPos[r.team]) : null,
        team: md === 'teams' ? r.team : '', score: num(r.score), faction: r.faction.trim(), firstTime: !!r.firstTime}))
        .sort((a,b)=> (a.position||99) - (b.position||99)),
    };
    const now = new Date().toISOString();
    let id;
    if(existing){
      id = existing.id;
      Object.assign(state.bg_matches.find(m=> m.id === id), payload, {updatedAt: now, updatedBy: state.currentUser.username});
    } else {
      id = uid();
      state.bg_matches.push({id, ...payload, createdAt: now, createdBy: state.currentUser.username});
    }
    if(!await sSet('bg_matches', state.bg_matches)){ formBusy(false); return; }
    if(newPhotos.length){
      newPhotos.forEach(p=> state.bg_photos.push({id: uid(), photo: p.data, caption: bgGame(gameId).name, author: state.currentUser.username, date: payload.date, matchId: id}));
      await sSet('bg_photos', state.bg_photos);
    }
    state.modal = null;
    if(state.bgOpen) state.bgStack.push(state.bgOpen);
    state.bgOpen = {kind:'match', id};
    render(); window.scrollTo(0,0);
    toast(existing ? 'Partida atualizada.' : 'Partida registrada.');
  };
}

function bindBgGuestForm(){
  const form = document.getElementById('bgGuestForm');
  if(!form) return;
  const existing = state.modal.data;
  form.onsubmit = async e=>{
    e.preventDefault();
    const fd = new FormData(form);
    const name = cleanName(fd.get('name'));
    if(!name) return formError('Informe o nome.');
    if(state.bg_guests.some(g=> g.name.toLowerCase() === name.toLowerCase() && (!existing || g.id !== existing.id))) return formError('Já existe um convidado com esse nome.');
    formBusy(true);
    if(existing) Object.assign(state.bg_guests.find(g=> g.id === existing.id), {name, linkedUserId: fd.get('linkedUserId') || ''});
    else state.bg_guests.push({id: uid(), name, linkedUserId: '', createdAt: new Date().toISOString(), createdBy: state.currentUser.username});
    state.modal = null;
    if(await sSet('bg_guests', state.bg_guests)){ render(); toast(existing ? 'Convidado atualizado.' : 'Convidado adicionado.'); }
  };
  const del = document.getElementById('bgGuestDelete');
  if(del) del.onclick = async ()=>{

    state.bg_guests = state.bg_guests.filter(g=> g.id !== existing.id);
    state.modal = null; state.bgOpen = state.bgStack.pop() || null;
    if(await sSet('bg_guests', state.bg_guests)){ render(); toast('Convidado excluído.'); }
  };
}

function bindBgRandomForm(){
  const form = document.getElementById('bgRandomForm');
  if(!form) return;
  form.onsubmit = e=>{
    e.preventDefault();
    const fd = new FormData(form);
    const n = Number(fd.get('n')) || 0, time = Number(fd.get('time')) || 0, owned = !!fd.get('owned'), boost = !!fd.get('boost');
    const pool = state.bg_games.filter(g=> g.type !== 'expansao'
      && (!n || (g.players||[]).map(Number).includes(Math.min(n, MAX_BG_PLAYERS)))
      && (!time || !g.time || g.time <= time)
      && (!owned || (g.owners||[]).length));
    const data = {n: fd.get('n'), time: fd.get('time'), owned, boost};
    if(!pool.length){ state.modal.data = {...data, none: true}; render(); return; }
    // peso: "quero jogar" e jogos pouco jogados têm mais chance
    const weights = pool.map(g=> boost ? 1 + bgWanting(g.id, 'wantPlay').length * 2 + 3 / (1 + bgMatchesOf(g.id).length) : 1);
    const total = weights.reduce((a,b)=> a+b, 0);
    let r = Math.random() * total, pick = pool[0];
    for(let i = 0; i < pool.length; i++){ r -= weights[i]; if(r <= 0){ pick = pool[i]; break; } }
    // pequena animação de "roleta"
    const outEl = document.getElementById('bgRandomOut');
    let spins = 0;
    const timer = setInterval(()=>{
      const g = pool[Math.floor(Math.random() * pool.length)];
      outEl.innerHTML = `<div class="bg-spin">${esc(g.name)}</div>`;
      if(++spins > 12){ clearInterval(timer); state.modal.data = {...data, pickId: pick.id}; render(); }
    }, 70);
  };
}

/* ============ VIEW EVENTS ============ */
function bindViewEvents(){
  bindVotesEvents();
  // players
  const addPlayerBtn = document.getElementById('addPlayerBtn');
  if(addPlayerBtn) addPlayerBtn.onclick = ()=>{ state.modal = {type:'player', data:null}; render(); };
  document.querySelectorAll('[data-players-view]').forEach(b=>{
    b.onclick = ()=>{ state.playersView = b.dataset.playersView; render(); };
  });
  document.querySelectorAll('[data-edit-player]').forEach(b=>{
    b.onclick = ()=>{ const p = state.players.find(x=>x.id===b.dataset.editPlayer); state.modal = {type:'player', data:p}; render(); };
  });
  document.querySelectorAll('[data-del-player]').forEach(b=>{
    b.onclick = async ()=>{
      if(!confirm('Excluir este jogador?')) return;
      state.players = state.players.filter(p=>p.id !== b.dataset.delPlayer);
      await savePlayers();
      render();
    };
  });

  // partidas
  const addMatchBtn = document.getElementById('addMatchBtn');
  if(addMatchBtn) addMatchBtn.onclick = ()=>{ state.modal = {type:'match', data:null}; render(); };
  document.querySelectorAll('[data-play-match]').forEach(b=>{
    b.onclick = e=>{
      e.stopPropagation();   // não abre a partida, só o vídeo
      state.modal = {type:'playVideo', data:{matchId: b.dataset.playMatch, idx: Number(b.dataset.playIdx) || 0}};
      render();
    };
  });
  // carrossel das capas
  document.querySelectorAll('[data-slides]').forEach(track=>{
    const cover = track.parentElement;
    const dots = [...cover.querySelectorAll('.pm-dots span')];
    const prev = cover.querySelector('.pm-nav.prev'), next = cover.querySelector('.pm-nav.next');
    const current = ()=> Math.round(track.scrollLeft / track.clientWidth);
    const sync = ()=>{
      const i = current();
      dots.forEach((d,k)=> d.classList.toggle('on', k === i));
      if(prev) prev.disabled = i === 0;
      if(next) next.disabled = i === dots.length - 1;
    };
    const go = i=> track.scrollTo({left: i * track.clientWidth});
    track.addEventListener('scroll', sync, {passive:true});
    sync();
    cover.querySelectorAll('[data-slide-nav]').forEach(b=>{
      b.onclick = e=>{ e.stopPropagation(); go(current() + Number(b.dataset.slideNav)); };
    });
    cover.querySelectorAll('[data-slide-to]').forEach(b=>{
      b.onclick = e=>{ e.stopPropagation(); go(Number(b.dataset.slideTo)); };
    });
    cover.querySelectorAll('button').forEach(b=> b.onkeydown = e=> e.stopPropagation());
  });
  document.querySelectorAll('[data-play-step]').forEach(b=>{
    b.onclick = ()=>{ state.modal.data.idx += Number(b.dataset.playStep); render(); };
  });
  document.querySelectorAll('[data-open-match]').forEach(b=>{
    const open = ()=>{ state.openMatchId = b.dataset.openMatch; render(); window.scrollTo(0,0); };
    b.onclick = open;
    b.onkeydown = e=>{ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); open(); } };
  });
  const backBtn = document.getElementById('backToMatches');
  if(backBtn) backBtn.onclick = ()=>{ state.openMatchId = null; render(); };
  const editMatch = document.getElementById('editMatch');
  if(editMatch) editMatch.onclick = ()=>{ state.modal = {type:'match', data:{id: state.openMatchId}}; render(); };
  const deleteMatch = document.getElementById('deleteMatch');
  if(deleteMatch) deleteMatch.onclick = async ()=>{
    const m = state.matches.find(x=> x.id === state.openMatchId);
    const photos = state.mural.filter(p=> p.matchId === m.id);
    const videos = state.videos.filter(v=> v.matchId === m.id);
    const dropPhotos = photos.length && can('photos.delete'), dropVideos = videos.length && can('videos.delete');
    const extra = [dropPhotos ? `${photos.length} foto${photos.length===1?'':'s'}` : '', dropVideos ? `${videos.length} vídeo${videos.length===1?'':'s'}` : ''].filter(Boolean);
    if(!confirm(`Excluir a partida de ${formatFullDate(m.date)}${extra.length ? ` junto com ${extra.join(' e ')}` : ''}?`)) return;
    state.matches = state.matches.filter(x=> x.id !== m.id);
    if(!await saveMatches()){ render(); return; }
    if(dropPhotos){ state.mural = state.mural.filter(p=> p.matchId !== m.id); await saveMural(); }
    if(dropVideos){ state.videos = state.videos.filter(v=> v.matchId !== m.id); await saveVideos(); }
    state.openMatchId = null;
    render();
    toast('Partida excluída.');
  };
  const matchSearch = document.getElementById('matchSearch');
  if(matchSearch) matchSearch.oninput = ()=>{
    state.matchFilter.q = matchSearch.value;
    render();
    const el = document.getElementById('matchSearch');
    if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  };
  const matchDateFilter = document.getElementById('matchDateFilter');
  if(matchDateFilter) matchDateFilter.onchange = ()=>{ state.matchFilter.date = matchDateFilter.value; render(); };
  const matchFilterClear = document.getElementById('matchFilterClear');
  if(matchFilterClear) matchFilterClear.onclick = ()=>{ state.matchFilter = {date:'', q:''}; render(); };
}

  const matchDates = col === 'videos'
    ? [...new Set(state.matches.map(m=> m.date).filter(Boolean))].sort((a,b)=> b.localeCompare(a)).slice(0,6) : [];
