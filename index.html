<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cavernosos</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --bg:#12100D;
  --bg-elev:#1B1712;
  --bg-card:#201B14;
  --border:#372C1B;
  --border-soft:#2A2317;
  --accent:#F2B705;
  --accent-dim:#B98B0A;
  --grass:#4C7A52;
  --grass-dim:#345239;
  --text:#EDEAE3;
  --text-dim:#A79C87;
  --text-faint:#726A57;
  --danger:#D6604D;
  --radius:2px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  background:
    radial-gradient(ellipse 900px 500px at 15% -10%, rgba(242,183,5,0.06), transparent),
    var(--bg);
  color:var(--text);
  font-family:'Inter',sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
h1,h2,h3,.display{
  font-family:'Oswald',sans-serif;
  font-weight:600;
  letter-spacing:0.01em;
  text-transform:uppercase;
}
.num{font-family:'Oswald',sans-serif; font-weight:700;}
a{color:inherit;}
button{
  font-family:'Inter',sans-serif;
  cursor:pointer;
  border:1px solid var(--border);
  background:var(--bg-elev);
  color:var(--text);
  padding:10px 16px;
  border-radius:var(--radius);
  font-size:14px;
  font-weight:600;
  transition:border-color .15s ease, background .15s ease;
}
button:hover{border-color:var(--accent-dim);}
button:active{transform:translateY(1px);}
button.primary{
  background:var(--accent);
  color:#191305;
  border-color:var(--accent);
}
button.primary:hover{background:#FFC91E; border-color:#FFC91E;}
button.ghost{background:transparent; border-color:transparent; color:var(--text-dim);}
button.ghost:hover{color:var(--text); border-color:var(--border);}
button.danger{color:var(--danger); border-color:var(--danger); background:transparent;}
button:disabled{opacity:.4; cursor:not-allowed;}
input,select,textarea{
  font-family:'Inter',sans-serif;
  background:var(--bg);
  border:1px solid var(--border);
  color:var(--text);
  padding:10px 12px;
  border-radius:var(--radius);
  font-size:14px;
  width:100%;
}
input:focus,select:focus,textarea:focus{outline:none; border-color:var(--accent-dim);}
label{font-size:12.5px; color:var(--text-dim); display:block; margin-bottom:6px;}
.field{margin-bottom:16px;}

/* ---------- layout shell ---------- */
#app{display:flex; min-height:100vh;}
.sidebar{
  width:220px; flex-shrink:0;
  background:var(--bg-elev);
  border-right:1px solid var(--border-soft);
  display:flex; flex-direction:column;
  padding:24px 0;
}
.brand{
  padding:0 20px 24px 20px;
  border-bottom:1px solid var(--border-soft);
  margin-bottom:16px;
  display:flex; align-items:center; gap:10px;
}
.brand-logo{width:44px; height:44px; flex-shrink:0; border-radius:50%; overflow:hidden; border:1px solid var(--border);}
.brand-logo img{width:100%; height:100%; object-fit:cover;}
.brand .kicker{color:var(--accent); font-size:10px; letter-spacing:.1em; font-family:'Oswald'; text-transform:uppercase;}
.brand h1{font-size:17px; margin-top:2px; line-height:1.05; letter-spacing:.02em;}
.nav{flex:1; display:flex; flex-direction:column; gap:2px; padding:0 12px;}
.nav button{
  text-align:left; background:transparent; border:none; color:var(--text-dim);
  padding:11px 12px; font-family:'Oswald'; font-size:13px; letter-spacing:.03em;
  text-transform:uppercase; border-radius:var(--radius); font-weight:500;
}
.nav button:hover{color:var(--text); background:rgba(255,255,255,0.03);}
.nav button.active{color:var(--accent); background:rgba(242,183,5,0.08); border-left:2px solid var(--accent); padding-left:10px;}
.sidebar-foot{padding:16px 20px 0 20px; border-top:1px solid var(--border-soft); margin-top:12px;}
.sidebar-foot .when{font-family:'Oswald'; font-size:14px; color:var(--accent); letter-spacing:.01em;}
.sidebar-foot .where{font-size:12.5px; color:var(--text-dim); margin-top:3px;}

.main{flex:1; padding:36px 44px; max-width:1100px;}
.page-head{margin-bottom:28px;}
.page-head .kicker{color:var(--accent); font-size:11px; letter-spacing:.14em; font-family:'Oswald'; text-transform:uppercase;}
.page-head h2{font-size:30px; margin-top:6px;}
.page-head p{color:var(--text-dim); margin-top:8px; font-size:14.5px; max-width:60ch;}

/* ---------- scoreboard stat cards ---------- */
.stat-row{display:flex; gap:1px; background:var(--border); border:1px solid var(--border); margin-bottom:32px; flex-wrap:wrap;}
.stat{
  flex:1; min-width:150px;
  background:var(--bg-card);
  padding:20px 22px;
}
.stat .label{font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.1em; font-family:'Oswald';}
.stat .value{font-size:40px; color:var(--accent); line-height:1.1; margin-top:6px;}
.stat .sub{font-size:12px; color:var(--text-faint); margin-top:4px;}

.section-title{font-size:14px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.08em; font-family:'Oswald'; margin:32px 0 14px 0; padding-bottom:8px; border-bottom:1px solid var(--border-soft);}
.section-title:first-of-type{margin-top:0;}

/* artilheiros table */
.rank-list{border:1px solid var(--border-soft);}
.rank-row{display:flex; align-items:center; gap:14px; padding:12px 16px; border-bottom:1px solid var(--border-soft);}
.rank-row:last-child{border-bottom:none;}
.rank-pos{font-family:'Oswald'; font-size:15px; color:var(--text-faint); width:22px;}
.rank-photo{width:34px; height:34px; border-radius:50%; object-fit:cover; background:var(--bg-elev); border:1px solid var(--border);}
.rank-name{flex:1; font-size:14.5px; font-weight:500;}
.rank-name .pos-tag{color:var(--text-faint); font-size:11.5px; margin-left:8px; text-transform:uppercase;}
.rank-goals{font-family:'Oswald'; color:var(--accent); font-size:18px;}

/* player grid */
.grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(180px,1fr)); gap:14px;}
.player-card{
  background:var(--bg-card); border:1px solid var(--border-soft); padding:16px;
  position:relative;
}
.player-card .num-badge{
  position:absolute; top:12px; right:12px; font-family:'Oswald'; font-size:13px;
  color:var(--accent); border:1px solid var(--border); padding:2px 7px;
}
.player-photo{width:100%; aspect-ratio:1; object-fit:cover; background:var(--bg-elev); margin-bottom:12px; border:1px solid var(--border-soft);}
.player-photo.placeholder{display:flex; align-items:center; justify-content:center; font-family:'Oswald'; font-size:34px; color:var(--text-faint);}
.player-card h3{font-size:15px; text-transform:none; letter-spacing:0; font-weight:600;}
.player-card .pos{color:var(--text-dim); font-size:12.5px; margin-top:2px;}
.player-card .freq{color:var(--text-faint); font-size:11.5px; margin-top:8px;}
.stars{margin-top:4px; font-size:14px; letter-spacing:1px; color:var(--border);}
.stars .filled{color:var(--accent);}
.star-picker{display:flex; gap:4px; font-size:22px; color:var(--border); cursor:pointer;}
.star-picker span.filled{color:var(--accent);}

/* fifa-style cards */
.fifa-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:22px;}
.fifa-card{
  position:relative;
  background:
    linear-gradient(160deg, rgba(242,183,5,0.10), transparent 55%),
    var(--bg-card);
  border:1px solid var(--accent-dim);
  clip-path:polygon(0 0, 100% 0, 100% 88%, 50% 100%, 0 88%);
  padding:22px 20px 34px 20px;
  text-align:center;
}
.fifa-top{display:flex; align-items:flex-start; justify-content:space-between; text-align:left;}
.fifa-ovr{font-family:'Oswald'; font-size:34px; color:var(--accent); line-height:1;}
.fifa-pos{font-family:'Oswald'; font-size:14px; color:var(--text-dim); margin-top:4px; letter-spacing:.04em;}
.fifa-num{font-family:'Oswald'; font-size:13px; color:var(--text-faint); border:1px solid var(--border); padding:2px 7px; height:fit-content;}
.fifa-photo{width:92px; height:92px; margin:6px auto 10px auto; border-radius:50%; overflow:hidden; border:2px solid var(--accent-dim); background:var(--bg-elev);}
.fifa-photo img{width:100%; height:100%; object-fit:cover;}
.fifa-photo-ph{width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-family:'Oswald'; font-size:34px; color:var(--text-faint);}
.fifa-name{font-family:'Oswald'; font-size:17px; letter-spacing:.03em; text-transform:uppercase;}
.fifa-stars{justify-content:center; display:flex; gap:2px; margin-top:6px; font-size:13px;}
.fifa-stats{
  display:grid; grid-template-columns:1fr 1fr; column-gap:18px; row-gap:8px;
  margin-top:18px; padding-top:16px; border-top:1px solid var(--border-soft);
}
.fifa-stat{display:flex; align-items:center; justify-content:center; gap:8px; font-family:'Oswald'; font-size:14px;}
.fifa-stat .v{color:var(--accent); font-size:17px;}
.fifa-stat .k{color:var(--text-dim); font-size:12px; letter-spacing:.03em;}
.player-card .actions{display:flex; gap:6px; margin-top:12px;}
.player-card .actions button{flex:1; padding:6px; font-size:12px;}

/* matches */
.match-list{display:flex; flex-direction:column; gap:10px;}
.match-row{
  background:var(--bg-card); border:1px solid var(--border-soft);
  padding:16px 18px; display:flex; align-items:center; gap:16px; cursor:pointer;
}
.match-row:hover{border-color:var(--border);}
.match-date{font-family:'Oswald'; font-size:20px; color:var(--text); width:110px;}
.match-info{flex:1;}
.match-info .label-line{font-size:14px; font-weight:600;}
.match-info .sub-line{font-size:12.5px; color:var(--text-dim); margin-top:2px;}
.match-status{font-size:11px; text-transform:uppercase; letter-spacing:.08em; font-family:'Oswald'; padding:4px 9px; border:1px solid var(--border);}
.match-status.open{color:var(--accent); border-color:var(--accent-dim);}
.match-status.closed{color:var(--text-faint);}

.presence-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:10px; margin-top:16px;}
.presence-item{
  display:flex; align-items:center; gap:10px; padding:10px 12px;
  border:1px solid var(--border-soft); background:var(--bg-card);
}
.presence-item.present{border-color:var(--grass-dim); background:rgba(76,122,82,0.08);}
.presence-item img{width:30px; height:30px; border-radius:50%; object-fit:cover; background:var(--bg-elev); flex-shrink:0;}
.presence-item .pname{flex:1; font-size:13.5px;}
.presence-item .goal-ctrl{display:flex; align-items:center; gap:6px;}
.presence-item .goal-ctrl button{padding:2px 8px; font-size:13px; line-height:1;}
.presence-item .goal-ctrl .gnum{font-family:'Oswald'; width:16px; text-align:center; color:var(--accent);}
.checkbox{width:18px; height:18px; accent-color:var(--accent); flex-shrink:0;}

/* mural */
.mural-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:14px;}
.mural-card{background:var(--bg-card); border:1px solid var(--border-soft); overflow:hidden;}
.mural-card img{width:100%; aspect-ratio:4/3; object-fit:cover; display:block;}
.mural-card .cap{padding:10px 12px;}
.mural-card .cap .txt{font-size:13px;}
.mural-card .cap .meta{font-size:11px; color:var(--text-faint); margin-top:4px;}

.channel-row{display:flex; gap:10px; margin:18px 0 26px 0; flex-wrap:wrap;}
.channel-link{
  display:flex; align-items:center; gap:8px; border:1px solid var(--border);
  padding:9px 14px; font-size:13px; font-weight:600; color:var(--text);
  background:var(--bg-elev); text-decoration:none;
}
.channel-link:hover{border-color:var(--accent-dim);}
.channel-link svg{width:16px; height:16px; flex-shrink:0;}
.momentos-tabs{display:flex; gap:2px; margin-bottom:20px; border-bottom:1px solid var(--border-soft);}
.momentos-tabs button{background:none; border:none; border-bottom:2px solid transparent; border-radius:0; color:var(--text-faint); padding:9px 4px; margin-right:22px; font-family:'Oswald'; font-size:13px; letter-spacing:.05em; text-transform:uppercase;}
.momentos-tabs button.active{color:var(--accent); border-bottom-color:var(--accent);}
.video-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:18px;}
.video-card{background:var(--bg-card); border:1px solid var(--border-soft);}
.video-embed{position:relative; width:100%; aspect-ratio:16/9; background:#000;}
.video-embed iframe{position:absolute; inset:0; width:100%; height:100%; border:0;}
.video-card .cap{padding:12px 14px;}
.video-card .cap .txt{font-size:13.5px; font-weight:600;}

/* modal */
.overlay{
  position:fixed; inset:0; background:rgba(10,9,7,0.72);
  display:flex; align-items:center; justify-content:center; z-index:50; padding:20px;
}
.modal{
  background:var(--bg-elev); border:1px solid var(--border); padding:28px;
  width:100%; max-width:440px; max-height:88vh; overflow-y:auto;
}
.modal h3{font-size:19px; margin-bottom:20px;}
.modal-actions{display:flex; gap:10px; margin-top:22px; justify-content:flex-end;}
.photo-pick{
  border:1px dashed var(--border); padding:16px; text-align:center; font-size:12.5px;
  color:var(--text-dim); cursor:pointer; margin-bottom:6px;
}
.photo-pick img{max-width:100%; max-height:120px; display:block; margin:0 auto 8px auto; border-radius:50%; width:90px; height:90px; object-fit:cover;}

.empty{color:var(--text-faint); font-size:13.5px; padding:20px 0;}
.topbar-mobile{display:none;}

@media (max-width:820px){
  #app{flex-direction:column;}
  .sidebar{width:100%; flex-direction:row; align-items:center; padding:14px 16px; position:sticky; top:0; z-index:20;}
  .brand{border:none; padding:0; margin:0; margin-right:16px;}
  .brand h1{font-size:16px;}
  .nav{flex-direction:row; padding:0; overflow-x:auto;}
  .nav button{white-space:nowrap; padding:8px 10px; font-size:11.5px;}
  .nav button.active{padding-left:8px; border-left:none; border-bottom:2px solid var(--accent);}
  .sidebar-foot{display:none;}
  .main{padding:24px 18px;}
}
</style>
</head>
<body>

<div id="app"></div>

<script>
/* ============ storage helpers ============ */
async function sGet(key){ try{ const r = await window.storage.get(key, true); return r ? JSON.parse(r.value) : null; }catch(e){ return null; } }
async function sSet(key, val){ try{ await window.storage.set(key, JSON.stringify(val), true); }catch(e){ console.error('storage set failed', key, e); } }

const POSITIONS = ["Goleiro","Fixo","Ala","Pivô","Zagueiro","Lateral","Volante","Meia","Atacante"];

let state = {
  players: [],
  matches: [],
  mural: [],
  videos: [],
  view: 'dashboard',
  momentosTab: 'videos',
  openMatchId: null,
  modal: null // {type, data}
};

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function playerFrequency(playerId){
  return state.matches.filter(m=> (m.presence||[]).includes(playerId)).length;
}
function starsHtml(count, cls){
  let out = '';
  for(let i=1;i<=5;i++){ out += `<span class="${i<=count?'filled':''}">★</span>`; }
  return `<div class="${cls}">${out}</div>`;
}
function computeOVR(player){
  const a = player.attrs;
  if(!a) return 50;
  return Math.round((a.rit+a.fin+a.pas+a.dri+a.def+a.fis)/6);
}
const KNOWN_ATTRS = {
  'maciel': {rit:70,fin:85,pas:80,dri:45,def:90,fis:70},
  'resende': {rit:60,fin:90,pas:78,dri:62,def:70,fis:62},
  'pereira': {rit:65,fin:95,pas:92,dri:88,def:65,fis:66},
};
async function migratePlayers(){
  let changed = false;
  state.players.forEach(p=>{
    if(!p.attrs){
      const key = Object.keys(KNOWN_ATTRS).find(k=> p.name.toLowerCase().includes(k));
      p.attrs = key ? KNOWN_ATTRS[key] : {rit:50,fin:50,pas:50,dri:50,def:50,fis:50};
      changed = true;
    }
  });
  if(changed) await savePlayers();
}

async function seedExamplesIfEmpty(){
  if(state.players.length > 0 || state.matches.length > 0) return;
  const p1 = {id: uid(), name:'V. Maciel', number:'92', position:'Goleiro', stars:4, photo:null, attrs:{rit:70,fin:85,pas:80,dri:45,def:90,fis:70}};
  const p2 = {id: uid(), name:'Resende', number:'14', position:'Pivô', stars:3, photo:null, attrs:{rit:60,fin:90,pas:78,dri:62,def:70,fis:62}};
  const p3 = {id: uid(), name:'Pereira', number:'9', position:'Pivô', stars:5, photo:null, attrs:{rit:65,fin:95,pas:92,dri:88,def:65,fis:66}};
  state.players = [p1,p2,p3];

  const today = new Date();
  const matches = [];
  for(let i=5;i>=1;i--){
    const d = new Date(today); d.setDate(d.getDate() - i*7);
    const presence = [p1.id, p2.id];
    if(i<=3) presence.push(p3.id);
    matches.push({id: uid(), date: d.toISOString().slice(0,10), label:'', presence, goals:{}, finalized:true});
  }
  state.matches = matches;
  await savePlayers();
  await saveMatches();
}

async function loadAll(){
  const [players, matches, mural, videos] = await Promise.all([
    sGet('players'), sGet('matches'), sGet('mural'), sGet('videos')
  ]);
  state.players = players || [];
  state.matches = matches || [];
  state.mural = mural || [];
  state.videos = videos || [];
}

function savePlayers(){ return sSet('players', state.players); }
function saveMatches(){ return sSet('matches', state.matches); }
function saveMural(){ return sSet('mural', state.mural); }
function saveVideos(){ return sSet('videos', state.videos); }

function extractYoutubeId(url){
  const m = (url||'').match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
  return m ? m[1] : null;
}

async function seedVideosIfEmpty(){
  if(state.videos.length > 0) return;
  state.videos = [
    {id: uid(), title:'Amistoso - Cavernosos 3x1 Litoral Sul', url:'https://www.youtube.com/watch?v=u0tZxKiGxX4'},
    {id: uid(), title:'Pelada - 20 de agosto de 2026', url:'https://www.youtube.com/watch?v=49M3e1odJTs&t=58s'},
    {id: uid(), title:'Pelada - 23 de julho de 2026', url:'https://www.youtube.com/watch?v=nXuThg_Q0Qk&t=1s'},
  ];
  await saveVideos();
}

/* ============ image resize helper ============ */
function resizeImage(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e =>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > h){ if(w > maxDim){ h = Math.round(h * maxDim/w); w = maxDim; } }
        else { if(h > maxDim){ w = Math.round(w * maxDim/h); h = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ============ render root ============ */
function render(){
  const app = document.getElementById('app');
  app.innerHTML = renderShell();
  bindShell();
}
window.addEventListener('DOMContentLoaded', async ()=>{
  await loadAll();
  await seedExamplesIfEmpty();
  await migratePlayers();
  await seedVideosIfEmpty();
  render();
});

/* ============ SHELL ============ */
const NAV = [
  {id:'dashboard', label:'Painel'},
  {id:'players', label:'Jogadores'},
  {id:'matches', label:'Partidas'},

function renderShell(){
  return `
  <div class="sidebar">
    <div class="brand">
      <div class="brand-logo"><img src="${LOGO_DATA_URI}" alt="Cavernosos"></div>
      <div>
        <div class="kicker">Toda quinta</div>
        <h1>CAVERNOSOS</h1>
      </div>
    </div>
    <div class="nav">
      ${NAV.map(n=>`<button data-nav="${n.id}" class="${state.view===n.id?'active':''}">${n.label}</button>`).join('')}
    </div>
    <div class="sidebar-foot">
      <div class="when">Quinta-feira, 21h às 22h30</div>
      <div class="where">Sargento Wolf, Afogados</div>
    </div>
  </div>
  <div class="main">
    ${renderView()}
  </div>
  ${state.modal ? renderModal() : ''}
  `;
}
function bindShell(){
  document.querySelectorAll('[data-nav]').forEach(b=>{
    b.onclick = ()=>{ state.view = b.dataset.nav; state.modal=null; render(); };
  });
  bindViewEvents();
  bindModalEvents();
}

function renderView(){
  if(state.view === 'dashboard') return renderDashboard();
  if(state.view === 'players') return renderPlayers();
  if(state.view === 'matches') return renderMatches();
  if(state.view === 'mural') return renderMural();
  return '';
}

/* ============ DASHBOARD ============ */
function computeStats(){
  const totalMatches = state.matches.length;
  const totalGoals = state.matches.reduce((s,m)=> s + Object.values(m.goals||{}).reduce((a,b)=>a+b,0), 0);
  const totalPresences = state.matches.reduce((s,m)=> s + (m.presence||[]).length, 0);
  const scorers = {};
  const presences = {};
  state.matches.forEach(m=>{
    (m.presence||[]).forEach(pid=>{ presences[pid] = (presences[pid]||0)+1; });
    Object.entries(m.goals||{}).forEach(([pid,g])=>{ scorers[pid] = (scorers[pid]||0)+g; });
  });
  const topScorers = Object.entries(scorers).sort((a,b)=>b[1]-a[1]).slice(0,8)
    .map(([pid,g])=>({player: state.players.find(p=>p.id===pid), goals:g}))
    .filter(x=>x.player);
  const topPresence = Object.entries(presences).sort((a,b)=>b[1]-a[1]).slice(0,8)
    .map(([pid,c])=>({player: state.players.find(p=>p.id===pid), count:c}))
    .filter(x=>x.player);
  return {totalMatches, totalGoals, totalPresences, topScorers, topPresence};
}
function renderDashboard(){
  const s = computeStats();
  const avgGoals = s.totalMatches ? (s.totalGoals/s.totalMatches).toFixed(1) : '0.0';
  return `
    <div class="page-head">
      <div class="kicker">Placar geral</div>
      <h2>Painel</h2>
      <p>Quinta-feira, 21h às 22h30 · Sargento Wolf, Afogados</p>
    </div>
    <div class="stat-row">
      <div class="stat"><div class="label">Partidas</div><div class="value num">${s.totalMatches}</div></div>
      <div class="stat"><div class="label">Gols no total</div><div class="value num">${s.totalGoals}</div><div class="sub">${avgGoals} por partida</div></div>
      <div class="stat"><div class="label">Presenças confirmadas</div><div class="value num">${s.totalPresences}</div></div>
      <div class="stat"><div class="label">Jogadores cadastrados</div><div class="value num">${state.players.length}</div></div>
    </div>

    <div class="section-title">Artilheiros</div>
    ${s.topScorers.length === 0 ? `<div class="empty">Nenhum gol registrado ainda. Marque os gols em uma partida para ver o ranking.</div>` : `
    <div class="rank-list">
      ${s.topScorers.map((x,i)=>`
        <div class="rank-row">
          <div class="rank-pos">${i+1}</div>
          ${playerPhotoTag(x.player,'rank-photo')}
          <div class="rank-name">${x.player.name}<span class="pos-tag">${x.player.position}</span></div>
          <div class="rank-goals">${x.goals}</div>
        </div>
      `).join('')}
    </div>`}

    <div class="section-title">Mais presentes</div>
    ${s.topPresence.length === 0 ? `<div class="empty">Nenhuma presença confirmada ainda.</div>` : `
    <div class="rank-list">
      ${s.topPresence.map((x,i)=>`
        <div class="rank-row">
          <div class="rank-pos">${i+1}</div>
          ${playerPhotoTag(x.player,'rank-photo')}
          <div class="rank-name">${x.player.name}<span class="pos-tag">${x.player.position}</span></div>
          <div class="rank-goals">${x.count}</div>
        </div>
      `).join('')}
    </div>`}
  `;
}
function playerPhotoTag(player, cls){
  if(player && player.photo) return `<img src="${player.photo}" class="${cls}">`;
  const initial = player ? player.name.charAt(0).toUpperCase() : '?';
  return `<div class="${cls}" style="display:flex;align-items:center;justify-content:center;font-family:Oswald;font-size:13px;color:var(--text-faint);">${initial}</div>`;
}

/* ============ PLAYERS ============ */
function renderPlayers(){
  const view = state.playersView || 'grid';
  return `
    <div class="page-head" style="display:flex; align-items:flex-end; justify-content:space-between; gap:20px; flex-wrap:wrap;">
      <div>
        <div class="kicker">Elenco</div>
        <h2>Jogadores</h2>

/* ============ MATCHES ============ */
function renderMatches(){
  if(state.openMatchId){
    return renderMatchDetail(state.openMatchId);
  }
  const sorted = [...state.matches].sort((a,b)=> b.date.localeCompare(a.date));
  return `
    <div class="page-head" style="display:flex; align-items:flex-end; justify-content:space-between; gap:20px; flex-wrap:wrap;">
      <div>
        <div class="kicker">Registro</div>
        <h2>Partidas</h2>
        <p>Confirme presença e registre os gols de cada rodada.</p>
      </div>
      <button class="primary" id="addMatchBtn">Nova partida</button>
    </div>
    ${sorted.length === 0 ? `<div class="empty">Nenhuma partida registrada ainda.</div>` : `
    <div class="match-list">
      ${sorted.map(m=>{
        const goals = Object.values(m.goals||{}).reduce((a,b)=>a+b,0);
        const dateFmt = formatDate(m.date);
        return `
        <div class="match-row" data-open-match="${m.id}">
          <div class="match-date">${dateFmt}</div>
          <div class="match-info">
            <div class="label-line">${m.label || 'Pelada'}</div>
            <div class="sub-line">${(m.presence||[]).length} presentes · ${goals} gol${goals===1?'':'s'}</div>
          </div>
          <div class="match-status ${m.finalized ? 'closed' : 'open'}">${m.finalized ? 'Encerrada' : 'Aberta'}</div>
        </div>`;
      }).join('')}
    </div>`}
  `;
}
function renderMatchDetail(matchId){
  const m = state.matches.find(x=>x.id===matchId);
  if(!m){ state.openMatchId = null; return renderMatches(); }
  const presenceSet = new Set(m.presence||[]);
  return `
    <div class="page-head">
      <button class="ghost" id="backToMatches" style="padding:6px 0; margin-bottom:14px;">&larr; Partidas</button>
      <div class="kicker">${formatDate(m.date)}</div>
      <h2>${m.label || 'Pelada'}</h2>
      <p>Marque quem esteve presente e registre os gols de cada um.</p>
    </div>
    <div class="presence-grid">
      ${state.players.map(p=>{
        const present = presenceSet.has(p.id);
        const g = (m.goals && m.goals[p.id]) || 0;
        return `
        <div class="presence-item ${present?'present':''}">
          <input type="checkbox" class="checkbox" data-presence-toggle="${p.id}" ${present?'checked':''} ${m.finalized?'disabled':''}>
          ${playerPhotoTag(p,'')}
          <div class="pname">${p.name}</div>
          ${present ? `
          <div class="goal-ctrl">
            <button data-goal-minus="${p.id}" ${m.finalized?'disabled':''}>&minus;</button>
            <div class="gnum">${g}</div>
            <button data-goal-plus="${p.id}" ${m.finalized?'disabled':''}>+</button>
          </div>` : ''}
        </div>`;
      }).join('')}
    </div>
    <div style="margin-top:24px; display:flex; gap:10px;">
      <button id="toggleFinalize">${m.finalized ? 'Reabrir partida' : 'Encerrar partida'}</button>
      <button class="danger" id="deleteMatch">Excluir partida</button>
    </div>
  `;
}
function formatDate(iso){
  const d = new Date(iso + 'T12:00:00');
  return d.toLocaleDateString('pt-BR', {day:'2-digit', month:'short'}).replace('.','');
}

/* ============ VIEW EVENTS ============ */
function bindViewEvents(){
  // players
  const addPlayerBtn = document.getElementById('addPlayerBtn');
  if(addPlayerBtn) addPlayerBtn.onclick = ()=>{ state.modal = {type:'player', data:null}; render(); };
  document.querySelectorAll('[data-players-view]').forEach(b=>{
    b.onclick = ()=>{ state.playersView = b.dataset.playersView; render(); };
  });
  document.querySelectorAll('[data-edit-player]').forEach(b=>{
    b.onclick = ()=>{ const p = state.players.find(x=>x.id===b.dataset.editPlayer); state.modal = {type:'player', data:p}; render(); };
  });
  document.querySelectorAll('[data-del-player]').forEach(b=>{
    b.onclick = async ()=>{
      if(!confirm('Excluir este jogador?')) return;
      state.players = state.players.filter(p=>p.id !== b.dataset.delPlayer);
      await savePlayers();
      render();
    };
  });

  // matches
  const addMatchBtn = document.getElementById('addMatchBtn');
  if(addMatchBtn) addMatchBtn.onclick = ()=>{ state.modal = {type:'match', data:null}; render(); };
  document.querySelectorAll('[data-open-match]').forEach(b=>{
    b.onclick = ()=>{ state.openMatchId = b.dataset.openMatch; render(); };
  });
  const backBtn = document.getElementById('backToMatches');
  if(backBtn) backBtn.onclick = ()=>{ state.openMatchId = null; render(); };

  document.querySelectorAll('[data-presence-toggle]').forEach(cb=>{
    cb.onchange = async ()=>{
      const m = state.matches.find(x=>x.id===state.openMatchId);
      const pid = cb.dataset.presenceToggle;
      m.presence = m.presence || [];
      if(cb.checked){ if(!m.presence.includes(pid)) m.presence.push(pid); }
      else { m.presence = m.presence.filter(x=>x!==pid); if(m.goals) delete m.goals[pid]; }
      await saveMatches();
      render();
    };
  });
  document.querySelectorAll('[data-goal-plus]').forEach(b=>{
    b.onclick = async ()=>{
      const m = state.matches.find(x=>x.id===state.openMatchId);
      m.goals = m.goals || {};
      const pid = b.dataset.goalPlus;
      m.goals[pid] = (m.goals[pid]||0) + 1;
      await saveMatches();
      render();
    };
  });
  document.querySelectorAll('[data-goal-minus]').forEach(b=>{
    b.onclick = async ()=>{
      const m = state.matches.find(x=>x.id===state.openMatchId);
      const pid = b.dataset.goalMinus;
      if(m.goals && m.goals[pid]) m.goals[pid] = Math.max(0, m.goals[pid]-1);
      await saveMatches();
      render();
    };
  });
  const toggleFinalize = document.getElementById('toggleFinalize');
  if(toggleFinalize) toggleFinalize.onclick = async ()=>{
    const m = state.matches.find(x=>x.id===state.openMatchId);
    m.finalized = !m.finalized;
    await saveMatches();
    render();
  };
  const deleteMatch = document.getElementById('deleteMatch');
  if(deleteMatch) deleteMatch.onclick = async ()=>{
    if(!confirm('Excluir esta partida?')) return;
    state.matches = state.matches.filter(x=>x.id !== state.openMatchId);
    state.openMatchId = null;
    await saveMatches();
    render();
  };

  // mural
  const addPhotoBtn = document.getElementById('addPhotoBtn');
  if(addPhotoBtn) addPhotoBtn.onclick = ()=>{ state.modal = {type:'photo', data:null}; render(); };
  const addVideoBtn = document.getElementById('addVideoBtn');
  if(addVideoBtn) addVideoBtn.onclick = ()=>{ state.modal = {type:'video', data:null}; render(); };
  document.querySelectorAll('[data-momentos-tab]').forEach(b=>{
    b.onclick = ()=>{ state.momentosTab = b.dataset.momentosTab; render(); };
  });
}

function escAttr(s){ return (s||'').replace(/"/g,'&quot;'); }

function bindModalEvents(){
  const overlay = document.getElementById('modalOverlay');
  if(!overlay) return;
  overlay.onclick = (e)=>{ if(e.target === overlay){ state.modal = null; render(); } };
  const cancel = document.getElementById('cancelModal');
  if(cancel) cancel.onclick = ()=>{ state.modal = null; render(); };

  // player modal
  const photoPick = document.getElementById('photoPick');
  const photoInput = document.getElementById('photoInput');
  let pendingPhoto = state.modal.data ? state.modal.data.photo : null;
  if(photoPick){
    photoPick.onclick = ()=> photoInput.click();
    photoInput.onchange = async ()=>{
      const file = photoInput.files[0];
      if(!file) return;
      const dataUrl = await resizeImage(file, 400, 0.75);
      pendingPhoto = dataUrl;
      document.getElementById('photoPreview').outerHTML = `<img src="${dataUrl}" id="photoPreview">`;
    };
  }
  const starPicker = document.getElementById('starPicker');
  if(starPicker){
    starPicker.querySelectorAll('[data-star]').forEach(s=>{
      s.onclick = ()=>{
        const val = parseInt(s.dataset.star, 10);
        document.getElementById('starsInput').value = val;
        starPicker.querySelectorAll('[data-star]').forEach(x=>{
          x.classList.toggle('filled', parseInt(x.dataset.star,10) <= val);
        });
      };
    });
  }
  const playerForm = document.getElementById('playerForm');
  if(playerForm){
    playerForm.onsubmit = async (e)=>{
      e.preventDefault();
      const fd = new FormData(playerForm);
      const name = fd.get('name').trim();
      if(!name) return;
      const stars = parseInt(fd.get('stars')||'0', 10);
      const clamp99 = v => Math.max(0, Math.min(99, parseInt(v||'0',10)));
      const attrs = {
        rit: clamp99(fd.get('rit')), fin: clamp99(fd.get('fin')), pas: clamp99(fd.get('pas')),
        dri: clamp99(fd.get('dri')), def: clamp99(fd.get('def')), fis: clamp99(fd.get('fis'))
      };
      const existing = state.modal.data;
      let player;
      if(existing){
        player = state.players.find(p=>p.id === existing.id);
        player.name = name;
        player.position = fd.get('position');
        player.number = fd.get('number') || '';
        player.photo = pendingPhoto;
        player.stars = stars;
        player.attrs = attrs;
      } else {
        player = {id: uid(), name, position: fd.get('position'), number: fd.get('number')||'', photo: pendingPhoto, stars, attrs};
        state.players.push(player);
      }
      await savePlayers();
      state.modal = null;
      render();
    };
  }

  // match modal
  const matchForm = document.getElementById('matchForm');
  if(matchForm){
    matchForm.onsubmit = async (e)=>{
      e.preventDefault();
      const fd = new FormData(matchForm);
      const match = {id: uid(), date: fd.get('date'), label: fd.get('label')||'', presence: [], goals: {}, finalized:false};
      state.matches.push(match);
      await saveMatches();
      state.modal = null;
      state.openMatchId = match.id;
      render();
    };
  }

  // video modal
  const videoForm = document.getElementById('videoForm');
  if(videoForm){
    videoForm.onsubmit = async (e)=>{
      e.preventDefault();
      const fd = new FormData(videoForm);
      const url = fd.get('url').trim();
      if(!extractYoutubeId(url)){ alert('Não consegui reconhecer esse link do YouTube. Confira e tente de novo.'); return; }
      state.videos.push({id: uid(), title: fd.get('title').trim(), url});
      await saveVideos();
      state.modal = null;
      render();
    };
  }

  // mural modal
  const muralPick = document.getElementById('muralPhotoPick');
  const muralInput = document.getElementById('muralPhotoInput');
  let pendingMuralPhoto = null;
  if(muralPick){
    muralPick.onclick = ()=> muralInput.click();
    muralInput.onchange = async ()=>{
      const file = muralInput.files[0];
      if(!file) return;
      const dataUrl = await resizeImage(file, 900, 0.7);
      pendingMuralPhoto = dataUrl;
      document.getElementById('muralPhotoPreviewWrap').outerHTML = `<img src="${dataUrl}" style="max-width:100%; max-height:160px; border-radius:0;">`;
    };
  }
  const photoForm = document.getElementById('photoForm');
  if(photoForm){
    photoForm.onsubmit = async (e)=>{
      e.preventDefault();
      if(!pendingMuralPhoto){ alert('Escolha uma foto.'); return; }
      const fd = new FormData(photoForm);
      state.mural.push({
        id: uid(), photo: pendingMuralPhoto, caption: fd.get('caption')||'',
        author: (fd.get('authorName')||'').trim() || 'Anônimo', date: new Date().toISOString().slice(0,10)
      });
      await saveMural();
      state.modal = null;
      render();
    };
  }
}
</script>
</body>
</html>
