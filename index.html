<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cavernosos</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --bg:#000000;
  --bg-elev:#0E0E0E;
  --bg-card:#141414;
  --border:#2E2A22;
  --border-soft:#1F1C17;
  --accent:#F2B705;
  --accent-dim:#B98B0A;
  --grass:#4C7A52;
  --grass-dim:#345239;
  --text:#EDEAE3;
  --text-dim:#A79C87;
  --text-faint:#726A57;
  --danger:#D6604D;
  --radius:2px;
  --accent-soft:rgba(242,183,5,0.08);
  --accent-hover:#FFC91E;
  --on-accent:#191305;
  --ok:#8BC293;
  --hover:rgba(255,255,255,0.03);
  --glow:rgba(242,183,5,0.06);
}
/* ---------- ambientes (tema de cada um) ---------- */
html[data-env="boardgame"]{
  --bg:#2B2E33; --bg-elev:#33373D; --bg-card:#3A3F46;
  --border:#525862; --border-soft:#454A52;
  --accent:#C4CAD2; --accent-dim:#8A919B; --accent-soft:rgba(196,202,210,0.10); --accent-hover:#E1E5EA; --on-accent:#1C1F23;
  --text:#ECEEF1; --text-dim:#AEB4BC; --text-faint:#7E858E;
  --grass:#5FA877; --grass-dim:#3A6148; --ok:#8FD1A5; --danger:#E0705F;
  --hover:rgba(255,255,255,0.04); --glow:rgba(196,202,210,0.07);
}
html[data-env="games"]{
  --bg:#050E26; --bg-elev:#0A1838; --bg-card:#0E1F47;
  --border:#1F3A78; --border-soft:#15295A;
  --accent:#4DA3FF; --accent-dim:#2F6FC4; --accent-soft:rgba(77,163,255,0.12); --accent-hover:#7DBBFF; --on-accent:#04112B;
  --text:#EAF1FF; --text-dim:#9DB2D9; --text-faint:#6480B3;
  --grass:#3FB6A8; --grass-dim:#1E5E68; --ok:#6FE3C6; --danger:#FF6B81;
  --hover:rgba(255,255,255,0.05); --glow:rgba(0,112,209,0.35);
}
html[data-env="outros"]{
  --bg:#1F0E03; --bg-elev:#2B1506; --bg-card:#341A08;
  --border:#5C3010; --border-soft:#46240B;
  --accent:#D9731A; --accent-dim:#9E5213; --accent-soft:rgba(217,115,26,0.12); --accent-hover:#F08A2F; --on-accent:#1F0D02;
  --text:#F5E9DB; --text-dim:#C7A688; --text-faint:#8C6C52;
  --grass:#6E9C48; --grass-dim:#3D5A28; --ok:#A5D07E; --danger:#E0664F;
  --hover:rgba(255,255,255,0.04); --glow:rgba(217,115,26,0.14);
}
html[data-env="games"] body{
  background:
    radial-gradient(ellipse 1100px 600px at 50% -20%, var(--glow), transparent),
    radial-gradient(ellipse 700px 500px at 100% 100%, rgba(77,163,255,0.10), transparent),
    linear-gradient(180deg, #071640 0%, #050E26 60%);
  background-attachment:fixed;
}
body, .sidebar, .main{transition:background-color .25s ease, color .25s ease;}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  background:
    radial-gradient(ellipse 900px 500px at 15% -10%, var(--glow), transparent),
    var(--bg);
  color:var(--text);
  font-family:'Inter',sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
h1,h2,h3,.display{
  font-family:'Oswald',sans-serif;
  font-weight:600;
  letter-spacing:0.01em;
  text-transform:uppercase;
}
.num{font-family:'Oswald',sans-serif; font-weight:700;}
a{color:inherit;}
button{
  font-family:'Inter',sans-serif;
  cursor:pointer;
  border:1px solid var(--border);
  background:var(--bg-elev);
  color:var(--text);
  padding:10px 16px;
  border-radius:var(--radius);
  font-size:14px;
  font-weight:600;
  transition:border-color .15s ease, background .15s ease;
}
button:hover{border-color:var(--accent-dim);}
button:active{transform:translateY(1px);}
button.primary{
  background:var(--accent);
  color:var(--on-accent);
  border-color:var(--accent);
}
button.primary:hover{background:var(--accent-hover); border-color:var(--accent-hover);}
button.ghost{background:transparent; border-color:transparent; color:var(--text-dim);}
button.ghost:hover{color:var(--text); border-color:var(--border);}
button.danger{color:var(--danger); border-color:var(--danger); background:transparent;}
button:disabled{opacity:.4; cursor:not-allowed;}
input,select,textarea{
  font-family:'Inter',sans-serif;
  background:var(--bg);
  border:1px solid var(--border);
  color:var(--text);
  padding:10px 12px;
  border-radius:var(--radius);
  font-size:14px;
  width:100%;
}
input:focus,select:focus,textarea:focus{outline:none; border-color:var(--accent-dim);}
label{font-size:12.5px; color:var(--text-dim); display:block; margin-bottom:6px;}
.field{margin-bottom:16px;}

/* ---------- layout shell ---------- */
#app{display:flex; min-height:100vh;}
.sidebar{
  width:232px; flex-shrink:0;
  background:var(--bg-elev);
  border-right:1px solid var(--border-soft);
  display:flex; flex-direction:column;
  padding:20px 0;
  position:sticky; top:0; height:100vh;
  transition:width .2s ease;
}
.brand{
  padding:0 16px 20px 16px;
  border-bottom:1px solid var(--border-soft);
  margin-bottom:16px;
  display:flex; align-items:center; gap:10px;
  position:relative;
}
.brand-text{flex:1; min-width:0; white-space:nowrap;}
/* botão de recolher: preso na linha da borda da barra lateral */
.collapse-btn{
  position:absolute; top:30px; right:-14px; z-index:30;
  width:28px; height:28px; padding:0; border-radius:50%;
  background:var(--bg-elev); border:1px solid var(--border); color:var(--text-dim);
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 2px 8px rgba(0,0,0,.25);
}
.collapse-btn:hover{color:var(--accent); border-color:var(--accent-dim);}
.collapse-btn .lucide{width:15px; height:15px;}

/* seletor de ambiente */
.env-switch{display:grid; grid-template-columns:1fr 1fr; gap:4px; padding:0 12px; margin-bottom:16px;}
.env-switch button{
  display:flex; align-items:center; justify-content:center; gap:6px;
  padding:8px 4px; font-family:'Oswald'; font-size:11.5px; font-weight:500; letter-spacing:.05em; text-transform:uppercase;
  background:transparent; color:var(--text-dim); border:1px solid var(--border-soft);
}
.env-switch button .lucide{width:14px; height:14px;}
.env-switch button:hover{color:var(--text); border-color:var(--border);}
.env-switch button.active{color:var(--on-accent); background:var(--accent); border-color:var(--accent);}
.sidebar.collapsed .env-switch{grid-template-columns:1fr; padding:0 10px;}
.sidebar.collapsed .env-switch .env-label{display:none;}
.sidebar.collapsed .env-switch button{padding:8px 0;}
.nav-global{padding:0 12px; margin-top:8px; border-top:1px solid var(--border-soft); padding-top:10px;}
.sidebar.collapsed .nav-global{padding:10px 10px 0 10px;}
.nav-global button{width:100%;}
.nav-title{font-family:'Oswald'; font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--text-faint); padding:0 12px 6px 12px;}
.sidebar.collapsed .nav-title{display:none;}
/* ---------- BoardGame ---------- */
.trophy{display:inline-flex; align-items:center;}
.trophy .lucide{width:17px; height:17px; stroke-width:2.2;}
.trophy.gold{color:#D4A017;}
.trophy.silver{color:#9AA3AE;}
.trophy.bronze{color:#B87333;}
.pos-num{display:inline-flex; align-items:center; justify-content:center; min-width:17px; font-family:'Oswald'; font-size:13px; color:var(--text-faint);}
.bg-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(210px,1fr)); gap:14px;}
.bg-card{background:var(--bg-card); border:1px solid var(--border-soft); display:flex; flex-direction:column;}
.bg-cover{width:100%; aspect-ratio:4/3; object-fit:cover; display:block; background:var(--bg); border-bottom:1px solid var(--border-soft);}
.bg-cover.ph, .bg-thumb.ph{display:flex; align-items:center; justify-content:center; color:var(--text-faint);}
.bg-cover.ph .lucide{width:40px; height:40px;}
.bg-body{padding:14px; display:flex; flex-direction:column; gap:6px; flex:1;}
.bg-body h3{font-size:15px; text-transform:none; letter-spacing:0;}
.bg-meta{font-size:12.5px; color:var(--text-dim);}
.bg-tags{display:flex; gap:5px; flex-wrap:wrap; margin-top:4px;}
.bg-tags .chip{display:inline-flex; align-items:center; gap:5px;}
.bg-tags .chip .lucide{width:12px; height:12px;}
.bg-card .actions{display:flex; gap:6px; margin-top:auto; padding-top:8px;}
.bg-card .actions button{flex:1; padding:6px; font-size:12px;}
.bg-photo-pick{aspect-ratio:4/3; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;}
.bg-photo-pick img{width:100%; height:100%; max-height:none; border-radius:0; object-fit:cover; margin:0;}
.bg-photo-pick .lucide{width:28px; height:28px; color:var(--text-faint);}
.count-pills{display:flex; gap:6px; flex-wrap:wrap;}
.count-pill{margin:0; cursor:pointer;}
.count-pill input{position:absolute; opacity:0; width:0; height:0;}
.count-pill span{display:flex; align-items:center; justify-content:center; min-width:40px; height:40px; padding:0 8px; border:1px solid var(--border); font-family:'Oswald'; font-size:15px; color:var(--text-dim); background:var(--bg);}
.count-pill input:checked + span{background:var(--accent); border-color:var(--accent); color:var(--on-accent);}
.count-pill input:focus-visible + span{outline:2px solid var(--accent-dim); outline-offset:2px;}
.bg-match-list{display:flex; flex-direction:column; gap:12px;}
.bg-match{background:var(--bg-card); border:1px solid var(--border-soft); padding:14px 16px;}
.bg-match-head{display:flex; align-items:center; gap:12px;}
.bg-thumb{width:46px; height:46px; object-fit:cover; flex-shrink:0; border:1px solid var(--border-soft); background:var(--bg);}
.bg-match-game{font-weight:600; font-size:15px;}
.bg-results{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px;}
.bg-result{display:flex; align-items:center; gap:7px; padding:6px 10px; border:1px solid var(--border-soft); background:var(--bg); font-size:13.5px;}
.bg-result.p1{border-color:#D4A01766; background:rgba(212,160,23,0.08);}
.bg-result .score{color:var(--text-faint); font-size:12px;}
.bg-notes{margin-top:10px; font-size:12.5px; color:var(--text-dim);}
.result-rows{border:1px solid var(--border-soft);}
.result-row{display:grid; grid-template-columns:1fr 130px 110px; gap:10px; align-items:center; padding:8px 12px; border-bottom:1px solid var(--border-soft);}
.result-row:last-child{border-bottom:none;}
.result-row.head{font-family:'Oswald'; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-faint); background:var(--bg-elev);}
.result-row .name{display:flex; align-items:center; gap:8px; font-size:13.5px;}
.result-row select, .result-row input{padding:7px 9px; font-size:13px;}
.table-wrap{overflow-x:auto;}
.rank-table{width:100%; border-collapse:collapse; border:1px solid var(--border-soft);}
.rank-table th{text-align:left; font-family:'Oswald'; font-weight:500; font-size:11.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-faint); padding:10px 14px; border-bottom:1px solid var(--border); background:var(--bg-elev);}
.rank-table td{padding:11px 14px; border-bottom:1px solid var(--border-soft); font-size:13.5px; vertical-align:middle; background:var(--bg-card);}
.rank-table tr:last-child td{border-bottom:none;}
.rank-table th, .rank-table td{white-space:nowrap;}
.rank-table td.medal{font-family:'Oswald'; font-size:15px;}
.rank-table .rank-pos-cell{width:44px;}
.rank-table td.up{color:#4cbf7a;} .rank-table td.down{color:var(--danger);}

/* ---------- BoardGame: componentes ---------- */
.bg-link{color:inherit; cursor:pointer; text-decoration:none; border-bottom:1px dotted var(--border);}
.bg-link:hover{color:var(--accent); border-bottom-color:var(--accent);}
a.chip.bg-link{border-bottom:1px solid var(--border-soft); display:inline-flex; align-items:center; gap:5px;}
.bg-av{width:26px; height:26px; border-radius:50%; object-fit:cover; flex-shrink:0; display:inline-flex; align-items:center; justify-content:center;
  background:var(--bg-elev); color:var(--text-dim); font-family:'Oswald'; font-size:12px; border:1px solid var(--border-soft);}
.bg-av.guest{border-style:dashed;}
.bg-av.lg{width:44px; height:44px; font-size:18px;}
.bg-av.xl{width:96px; height:96px; font-size:40px;}
.bgm-list{display:flex; flex-direction:column; gap:8px;}
.bgm-row{display:flex; align-items:flex-start; gap:12px; padding:12px 14px; background:var(--bg-card); border:1px solid var(--border-soft); cursor:pointer; transition:border-color .15s;}
.bgm-row:hover, .bgm-row:focus-visible{border-color:var(--accent-dim); outline:none;}
.bgm-main{flex:1; min-width:0; display:flex; flex-direction:column; gap:4px;}
.bgm-title{font-weight:600; font-size:15px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.bgm-players{display:flex; flex-wrap:wrap; gap:6px; margin-top:4px;}
.bgm-p{display:inline-flex; align-items:center; gap:5px; font-size:12.5px; padding:3px 8px; border:1px solid var(--border-soft); background:var(--bg); color:var(--text-dim);}
.bgm-p.won{color:var(--text); border-color:#D4A01766; background:rgba(212,160,23,0.08);}
.bgm-p .lucide{width:13px; height:13px; color:#D4A017;}
.bgm-p i.pos-num{font-style:normal; font-size:11.5px; min-width:0;}
.bgm-p em{font-style:normal; color:var(--text-faint); font-size:11.5px;}
.bgm-side{display:flex; align-items:center; gap:4px; font-size:12px; color:var(--text-faint);}
.bgm-side .lucide{width:14px; height:14px;}
.bg-mode{display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:600; padding:2px 8px; border:1px solid var(--border); color:var(--text-dim); text-transform:uppercase; letter-spacing:.04em;}
.bg-mode .lucide{width:12px; height:12px;}
.bg-mode.win{color:#4cbf7a; border-color:rgba(76,191,122,.5);} .bg-mode.loss{color:var(--danger); border-color:var(--danger);}
.bg-hero{display:flex; gap:20px; align-items:flex-start; margin-top:4px;}
.bg-hero-img{width:150px; height:150px; object-fit:cover; flex-shrink:0; border:1px solid var(--border-soft); background:var(--bg);}
.bg-hero-img.ph .lucide{width:44px; height:44px;}
.bg-hero h2{margin-top:4px;}
.bg-facts{display:flex; flex-wrap:wrap; gap:14px; margin-top:10px; font-size:13px; color:var(--text-dim); align-items:center;}
.bg-facts span{display:inline-flex; align-items:center; gap:5px;}
.bg-facts .lucide{width:15px; height:15px;}
.bg-coop{display:flex; gap:14px; align-items:center; padding:16px 18px; border:1px solid; margin-bottom:8px;}
.bg-coop .lucide{width:30px; height:30px;}
.bg-coop b{display:block; font-family:'Oswald'; font-size:20px; letter-spacing:.03em;}
.bg-coop span{font-size:12.5px; color:var(--text-dim);}
.bg-coop.win{border-color:rgba(76,191,122,.5); background:rgba(76,191,122,.08); color:#4cbf7a;}
.bg-coop.loss{border-color:var(--danger); background:rgba(224,100,90,.08); color:var(--danger);}
.bg-podium{display:grid; grid-template-columns:repeat(3, minmax(0, 170px)); justify-content:center; align-items:end; gap:10px; margin:8px 0 6px;}
.bg-step{display:flex; flex-direction:column; align-items:center; gap:5px; text-align:center; min-width:0;}
.bg-step-name{font-size:13.5px; font-weight:600; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.bg-step-score{font-size:12px; color:var(--text-faint);}
.bg-step-block{width:100%; display:flex; align-items:flex-start; justify-content:center; padding-top:10px; background:var(--bg-card); border:1px solid var(--border-soft); border-bottom:none;}
.bg-step-block .trophy .lucide{width:26px; height:26px;}
.bg-step.s1 .bg-step-block{height:110px; border-color:#D4A01766; background:rgba(212,160,23,0.08);}
.bg-step.s2 .bg-step-block{height:80px;} .bg-step.s3 .bg-step-block{height:60px;}
.bg-teams{display:grid; grid-template-columns:repeat(auto-fill, minmax(200px,1fr)); gap:10px; margin-bottom:8px;}
.bg-team{border:1px solid var(--border-soft); background:var(--bg-card); padding:12px 14px; display:flex; flex-direction:column; gap:8px; font-size:13.5px;}
.bg-team > div:not(.bg-team-head){display:flex; align-items:center; gap:8px;}
.bg-team.won{border-color:#D4A01766; background:rgba(212,160,23,0.08);}
.bg-team-head{font-family:'Oswald'; font-size:15px; display:flex; align-items:center; gap:8px; text-transform:uppercase; letter-spacing:.04em;}
.bg-card{cursor:pointer; transition:border-color .15s;}
.bg-card:hover, .bg-card:focus-visible{border-color:var(--accent-dim); outline:none;}
.bg-cover-wrap{position:relative;}
.bg-rating{position:absolute; top:8px; left:8px; display:inline-flex; align-items:center; gap:4px; padding:3px 8px; background:rgba(0,0,0,.7); color:#fff; font-size:12px; font-weight:700;}
.bg-rating .lucide{width:12px; height:12px; fill:#D4A017; color:#D4A017;}
.bg-my{position:absolute; top:8px; right:8px; display:flex; gap:4px;}
.bg-my span{display:flex; padding:4px; background:rgba(0,0,0,.7); color:#fff;}
.bg-my .lucide{width:13px; height:13px;}
.bg-owners{font-size:12px; color:var(--text-faint); display:flex; gap:5px; align-items:center; margin-top:2px;}
.bg-owners .lucide{width:12px; height:12px; flex-shrink:0;}
.bg-collection-bar{display:flex; flex-wrap:wrap; gap:8px; margin-top:18px; align-items:center;}
.bg-collection-bar button{display:inline-flex; align-items:center; gap:6px; padding:7px 12px; font-size:13px;}
.bg-collection-bar button .lucide{width:15px; height:15px;}
.bg-collection-bar button.on{background:var(--accent-soft); border-color:var(--accent-dim); color:var(--accent);}
.bg-collection-bar button.danger-hover:hover{color:var(--danger); border-color:var(--danger);}
.bg-note{display:inline-flex; align-items:center; gap:6px; margin:0; padding:0 4px 0 10px; border:1px solid var(--border); font-size:13px; color:var(--text-dim);}
.bg-note .lucide{width:15px; height:15px;}
.bg-note select{width:auto; border:0; padding:6px 8px; background:transparent;}
.bg-taxo, .bg-people{display:flex; flex-direction:column; gap:8px; margin:6px 0 4px; font-size:13.5px;}
.bg-taxo > div, .bg-people > div{display:flex; flex-wrap:wrap; gap:6px; align-items:center;}
.bg-taxo-lbl{display:inline-flex; align-items:center; gap:5px; min-width:120px; font-family:'Oswald'; font-size:11.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-faint);}
.bg-taxo-lbl .lucide{width:13px; height:13px;}
.bg-people{margin-top:20px; padding:14px 16px; border:1px solid var(--border-soft); background:var(--bg-card);}
.bg-player-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(240px,1fr)); gap:12px;}
.bg-player{background:var(--bg-card); border:1px solid var(--border-soft); padding:14px 16px; display:flex; flex-direction:column; gap:12px; cursor:pointer; transition:border-color .15s;}
.bg-player:hover, .bg-player:focus-visible{border-color:var(--accent-dim); outline:none;}
.bg-player-head{display:flex; align-items:center; gap:12px;}
.bg-player-name{font-weight:600; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.bg-player-stats{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; text-align:center;}
.bg-player-stats b{display:block; font-family:'Oswald'; font-size:19px; color:var(--accent);}
.bg-player-stats span{font-size:10.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.05em;}
.bg-player .bg-meta{display:flex; align-items:center; gap:4px; flex-wrap:wrap;}
.bg-player .bg-meta .lucide{width:13px; height:13px;}
.bg-duo{display:grid; grid-template-columns:repeat(auto-fit, minmax(220px,1fr)); gap:10px; margin-top:-12px;}
.bg-fact-card{display:flex; gap:12px; align-items:flex-start; padding:14px 16px; background:var(--bg-card); border:1px solid var(--border-soft);}
.bg-fact-card > .lucide{width:22px; height:22px; color:var(--accent); flex-shrink:0; margin-top:2px;}
.bg-fact-card span{display:block; font-size:11.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.05em;}
.bg-fact-card b{display:block; font-size:15px; margin-top:3px;}
.bg-fact-card em{display:block; font-style:normal; font-size:12px; color:var(--text-dim); margin-top:2px;}
.chip.king{color:#D4A017; border-color:#D4A01766; display:inline-flex; align-items:center; gap:5px;}
.chip.king .lucide{width:12px; height:12px;}
.bg-badges{display:grid; grid-template-columns:repeat(auto-fill, minmax(170px,1fr)); gap:8px;}
.bg-badge{display:flex; flex-direction:column; gap:3px; padding:12px; border:1px dashed var(--border); opacity:.45; filter:grayscale(1);}
.bg-badge .lucide{width:24px; height:24px; color:var(--text-faint); margin-bottom:4px;}
.bg-badge b{font-size:13px;} .bg-badge span{font-size:11.5px; color:var(--text-dim);}
.bg-badge.on{opacity:1; filter:none; border-style:solid; border-color:var(--accent-dim); background:var(--accent-soft);}
.bg-badge.on .lucide{color:var(--accent);}
.bg-recap-hero{display:grid; grid-template-columns:repeat(auto-fit, minmax(140px,1fr)); gap:1px; background:var(--accent-dim); border:1px solid var(--accent-dim); margin-bottom:16px;}
.bg-recap-hero div{background:var(--bg-card); padding:22px 18px; text-align:center;}
.bg-recap-hero b{display:block; font-family:'Oswald'; font-size:42px; color:var(--accent); line-height:1.1;}
.bg-recap-hero span{font-size:12px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.08em;}
.bg-recap-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(210px,1fr)); gap:10px;}
.bg-recap-card{display:flex; flex-direction:column; gap:4px; padding:16px; background:var(--bg-card); border:1px solid var(--border-soft);}
.bg-recap-card > .lucide{width:22px; height:22px; color:var(--accent); margin-bottom:4px;}
.bg-recap-card span{font-size:11.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.06em;}
.bg-recap-card b{font-size:17px;}
.bg-recap-card em{font-style:normal; font-size:12.5px; color:var(--text-dim);}
/* gráficos: uma série, cor de destaque, tooltip no hover */
.bar-chart{width:100%; max-width:720px; overflow-x:auto;}
.bar-chart svg{width:100%; min-width:360px; height:calc(var(--h) + 22px); display:block;}
.bc-axis{stroke:var(--border); stroke-width:1;}
.bc-bar{fill:var(--accent);}
.bc-hit{fill:transparent;}
.bc-g:hover .bc-bar{opacity:.8;}
.bc-g:hover .bc-hit{fill:var(--accent-soft);}
.bc-val{font-size:11px; fill:var(--text-dim); text-anchor:middle; font-family:'Inter',sans-serif;}
.bc-lbl{font-size:10.5px; fill:var(--text-faint); text-anchor:middle; font-family:'Inter',sans-serif;}
.hbars{display:flex; flex-direction:column; gap:8px; max-width:720px;}
.hbar{display:grid; grid-template-columns:minmax(110px, 200px) 1fr auto; gap:12px; align-items:center; font-size:13px;}
.hbar-lbl{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.hbar-track{height:10px; background:var(--bg-elev);}
.hbar-fill{height:100%; background:var(--accent); border-radius:0 4px 4px 0;}
.hbar-val{min-width:70px; text-align:right; font-variant-numeric:tabular-nums;}
.hbar:hover .hbar-fill{opacity:.8;}
.chart-tip{position:fixed; z-index:200; display:none; pointer-events:none; padding:6px 10px; font-size:12px; background:var(--bg-elev); color:var(--text); border:1px solid var(--border); box-shadow:0 4px 14px rgba(0,0,0,.3);}
/* formulários do BoardGame */
.seg{display:inline-flex; border:1px solid var(--border); flex-wrap:wrap;}
.seg label{margin:0; cursor:pointer;}
.seg input{position:absolute; opacity:0; width:0; height:0;}
.seg span{display:inline-flex; align-items:center; gap:6px; padding:8px 14px; font-size:13px; color:var(--text-dim);}
.seg span .lucide{width:14px; height:14px;}
.seg input:checked + span{background:var(--accent); color:var(--on-accent);}
.seg input:focus-visible + span{outline:2px solid var(--accent-dim); outline-offset:-2px;}
.result-rows.mode-comp .result-row, .result-rows.mode-teams .result-row{grid-template-columns:minmax(120px,1.3fr) 110px 80px 1fr 44px;}
.result-rows.mode-coop .result-row{grid-template-columns:minmax(120px,1.3fr) 80px 1fr 44px;}
.result-row .checkbox{justify-self:center;}
.bg-team-pos{display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin-top:10px; font-size:13px; color:var(--text-dim);}
.bg-team-pos label{display:inline-flex; align-items:center; gap:6px; margin:0;}
.bg-team-pos select{width:auto; padding:5px 8px;}
.ludo-list{display:flex; flex-direction:column; gap:4px; margin-top:8px; max-height:240px; overflow-y:auto;}
.ludo-item{display:flex; align-items:center; gap:10px; text-align:left; padding:6px 8px; font-size:13px;}
.ludo-item img, .ludo-item .lucide{width:34px; height:34px; object-fit:cover; flex-shrink:0;}
.ludo-item em{color:var(--text-faint); font-style:normal;}
.bg-random-out{display:flex; align-items:center; gap:12px; min-height:74px; margin-top:14px; padding:12px; border:1px dashed var(--border); background:var(--bg);}
.bg-random-out > div{flex:1; min-width:0;}
.bg-random-out b{font-size:16px;}
.bg-spin{font-family:'Oswald'; font-size:20px; color:var(--accent); text-align:center; width:100%;}
@media (max-width:640px){
  .bg-hero{flex-direction:column; gap:12px;}
  .bg-hero-img{width:110px; height:110px;}
  .result-rows .result-row:not(.head){grid-template-columns:1fr 1fr !important;}
  .result-rows .result-row .name{grid-column:1 / -1;}
  .result-rows .result-row.head{display:none;}
  .hbar{grid-template-columns:110px 1fr auto;}
}
.coming-soon{border:1px dashed var(--border); background:var(--bg-card); padding:40px 24px; text-align:center; max-width:560px;}
.coming-soon .lucide{width:34px; height:34px; color:var(--accent); margin-bottom:12px;}
.coming-soon h3{font-size:16px; margin-bottom:8px;}
.coming-soon p{color:var(--text-dim); font-size:14px; line-height:1.5;}
.lucide{width:18px; height:18px; stroke-width:1.9; flex-shrink:0;}
button .lucide{vertical-align:-4px;}
.btn-icon{display:inline-flex; align-items:center; gap:8px;}
.nav-label{white-space:nowrap; overflow:hidden;}
.sidebar.collapsed{width:68px;}
.sidebar.collapsed .brand{flex-direction:column; padding:0 10px 16px 10px;}
.sidebar.collapsed .brand-logo{width:38px; height:38px;}
.sidebar.collapsed .brand-text,
.sidebar.collapsed .nav-label,
.sidebar.collapsed .schedule,
.sidebar.collapsed .account-info{display:none;}
.sidebar.collapsed .nav{padding:0 10px;}
.sidebar.collapsed .nav button{justify-content:center; padding:11px 0;}
.sidebar.collapsed .nav button.active{padding-left:0;}
.sidebar.collapsed .sidebar-foot{padding:14px 10px 0 10px;}
.sidebar.collapsed .account{flex-direction:column;}
.brand-logo{width:44px; height:44px; flex-shrink:0; border-radius:50%; overflow:hidden; border:1px solid var(--border);}
.brand-logo img{width:100%; height:100%; object-fit:cover;}
.brand .kicker{color:var(--accent); font-size:10px; letter-spacing:.1em; font-family:'Oswald'; text-transform:uppercase;}
.brand h1{font-size:17px; margin-top:2px; line-height:1.05; letter-spacing:.02em;}
.nav{flex:1; display:flex; flex-direction:column; gap:2px; padding:0 12px;}
.nav button{
  text-align:left; background:transparent; border:none; color:var(--text-dim);
  padding:11px 12px; font-family:'Oswald'; font-size:13px; letter-spacing:.03em;
  text-transform:uppercase; border-radius:var(--radius); font-weight:500;
  display:flex; align-items:center; gap:12px;
}
.nav button:hover{color:var(--text); background:var(--hover);}
.nav button.active{color:var(--accent); background:var(--accent-soft); border-left:2px solid var(--accent); padding-left:10px;}
.sidebar-foot{padding:16px 16px 0 16px; border-top:1px solid var(--border-soft); margin-top:12px;}
.sidebar-foot .when{font-family:'Oswald'; font-size:14px; color:var(--accent); letter-spacing:.01em;}
.sidebar-foot .where{font-size:12.5px; color:var(--text-dim); margin-top:3px;}
.schedule{margin-bottom:14px;}
.account{display:flex; align-items:center; gap:8px;}
.avatar{
  width:32px; height:32px; border-radius:50%; flex-shrink:0;
  background:var(--accent-soft); color:var(--accent); border:1px solid var(--accent-dim);
  display:flex; align-items:center; justify-content:center; font-family:'Oswald'; font-size:14px; text-transform:uppercase;
}
.account-info{flex:1; min-width:0;}
.account-info .uname{font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.account-info .urole{font-size:11px; color:var(--text-faint);}
.icon-btn{
  background:transparent; border:1px solid transparent; color:var(--text-dim);
  padding:7px; display:inline-flex; align-items:center; justify-content:center;
}
.icon-btn:hover{color:var(--text); border-color:var(--border);}
.icon-btn.danger-hover:hover{color:var(--danger); border-color:var(--danger);}
.login-btn{width:100%; display:flex; align-items:center; justify-content:center; gap:8px;}
.sidebar.collapsed .login-btn{padding:9px 0;}
.sidebar.collapsed .login-btn .nav-label{display:none;}

/* ---------- users ---------- */
.toolbar{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:16px;}
.search-box{position:relative; flex:1; min-width:200px; max-width:320px;}
.search-box .lucide{position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--text-faint); width:16px; height:16px;}
.search-box input{padding-left:34px;}
.chip-filter{display:flex; gap:6px; flex-wrap:wrap;}
.chip-filter button{padding:6px 12px; font-size:12.5px; font-weight:500; color:var(--text-dim); background:transparent;}
.chip-filter button.active{color:var(--accent); border-color:var(--accent-dim); background:var(--accent-soft);}
.users-table{width:100%; border-collapse:collapse; border:1px solid var(--border-soft);}
.users-table th{text-align:left; font-family:'Oswald'; font-weight:500; font-size:11.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-faint); padding:10px 14px; border-bottom:1px solid var(--border); background:var(--bg-elev);}
.users-table td{padding:12px 14px; border-bottom:1px solid var(--border-soft); font-size:13.5px; vertical-align:middle;}
.users-table tr:last-child td{border-bottom:none;}
.users-table tr.inactive td{opacity:.55;}
.user-cell{display:flex; align-items:center; gap:10px;}
.user-cell .you{font-size:10.5px; color:var(--text-faint); border:1px solid var(--border); padding:1px 6px; margin-left:6px; text-transform:uppercase; letter-spacing:.05em;}
.badge{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-family:'Oswald'; letter-spacing:.06em; text-transform:uppercase; padding:3px 8px; border:1px solid var(--border); color:var(--text-dim);}
.badge .lucide{width:13px; height:13px;}
.badge.admin{color:var(--accent); border-color:var(--accent-dim);}
.badge.ok{color:var(--ok); border-color:var(--grass-dim);}
.badge.off{color:var(--text-faint);}
.badge.pending{color:var(--accent); border-color:var(--accent-dim); background:var(--accent-soft);}
.users-table tr.pending-row td{background:var(--accent-soft);}
.td-actions button{margin-left:6px; padding:7px 12px; font-size:13px;}
.pending-notice{align-items:center;}
.pending-notice > div{flex:1;}
.nav-badge{margin-left:auto; background:var(--accent); color:var(--on-accent); font-family:'Inter'; font-size:10.5px; font-weight:700; min-width:18px; height:18px; padding:0 5px; border-radius:9px; display:inline-flex; align-items:center; justify-content:center; letter-spacing:0;}
.nav button{position:relative;}
.sidebar.collapsed .nav-badge{position:absolute; top:4px; right:6px; min-width:15px; height:15px; font-size:9.5px;}
.link-btn{background:none; border:none; padding:0; color:var(--accent); font-weight:600; font-size:inherit;}
.link-btn:hover{text-decoration:underline;}
.login-switch{margin-top:18px; padding-top:16px; border-top:1px solid var(--border-soft); text-align:center; font-size:13px; color:var(--text-dim);}
.login-done{text-align:center;}
.login-done .lucide{width:40px; height:40px; color:var(--accent); margin-bottom:10px;}
.login-done h2{font-size:20px; margin-bottom:8px;}
.login-done p{color:var(--text-dim); font-size:14px; line-height:1.5;}
.chips{display:flex; gap:5px; flex-wrap:wrap;}
.chip{font-size:11.5px; padding:2px 8px; background:var(--bg-elev); border:1px solid var(--border-soft); color:var(--text-dim);}
.td-actions{text-align:right; white-space:nowrap;}

.modal.wide{max-width:640px;}
.modal-sub{font-size:12px; color:var(--text-faint); margin:-12px 0 18px 0;}
.form-section{font-family:'Oswald'; font-size:12.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-dim); margin:22px 0 12px 0; padding-bottom:6px; border-bottom:1px solid var(--border-soft); display:flex; justify-content:space-between; align-items:center;}
.form-section .links{display:flex; gap:12px; text-transform:none; letter-spacing:0; font-family:'Inter';}
.form-section .links button{background:none; border:none; padding:0; font-size:12px; color:var(--accent); font-weight:500;}
.form-section .links button:disabled{color:var(--text-faint);}
.form-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.pw-wrap{position:relative;}
.pw-wrap input{padding-right:40px;}
.pw-wrap .icon-btn{position:absolute; right:3px; top:50%; transform:translateY(-50%); padding:5px;}
.hint{font-size:11.5px; color:var(--text-faint); margin-top:5px;}
.pw-rules{list-style:none; margin-top:8px; display:grid; gap:3px;}
.pw-rules li{display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--text-faint);}
.pw-rules .lucide{width:13px; height:13px;}
.pw-rules .lucide-circle-check{display:none;}
.pw-rules li.ok{color:var(--ok);}
.pw-rules li.ok .lucide-circle{display:none;}
.pw-rules li.ok .lucide-circle-check{display:inline;}
.form-error{color:var(--danger); font-size:12.5px; margin-top:10px; min-height:1em;}
.check-pills{display:flex; gap:8px; flex-wrap:wrap;}
.check-pill{display:flex; align-items:center; gap:7px; border:1px solid var(--border); padding:8px 12px; cursor:pointer; font-size:13px; color:var(--text-dim); margin:0;}
.check-pill:has(input:checked){border-color:var(--accent-dim); color:var(--text); background:var(--accent-soft);}
.check-pill input{width:auto; accent-color:var(--accent);}
.switch-row{display:flex; align-items:center; gap:10px; font-size:13.5px; color:var(--text); margin:0; cursor:pointer;}
.switch-row input{width:auto; accent-color:var(--accent);}

.perm-tree{border:1px solid var(--border-soft); background:var(--bg); padding:6px 0;}
.perm-tree ul{list-style:none;}
.perm-tree ul ul{padding-left:26px;}
.perm-tree li > label{display:flex; align-items:center; gap:9px; padding:6px 12px; margin:0; font-size:13px; color:var(--text); cursor:pointer;}
.perm-tree li > label:hover{background:var(--hover);}
.perm-tree li.group > label{font-weight:600;}
.perm-tree li.group > label .lucide{width:15px; height:15px; color:var(--text-faint);}
.perm-tree input{width:auto; accent-color:var(--accent); width:15px; height:15px;}
.perm-tree.locked{opacity:.6;}
.perm-tree .perm-note{font-size:11.5px; color:var(--text-faint); font-weight:400; margin-left:4px;}
.notice{display:flex; gap:10px; align-items:flex-start; font-size:12.5px; color:var(--text-dim); border:1px solid var(--border); background:var(--bg); padding:10px 12px; margin-bottom:12px;}
.notice .lucide{color:var(--accent); width:16px; height:16px; margin-top:1px;}
.modal-actions .spacer{flex:1;}

.login-screen{
  min-height:100vh; width:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:32px 16px; gap:20px;
  background:
    radial-gradient(ellipse 700px 420px at 50% 0%, var(--accent-soft), transparent),
    var(--bg);
}
.login-card{
  width:100%; max-width:380px; background:var(--bg-elev); border:1px solid var(--border);
  padding:32px 28px; box-shadow:0 20px 60px rgba(0,0,0,.45);
}
.login-brand{text-align:center; margin-bottom:26px;}
.login-logo{
  width:128px; height:128px; margin:0 auto 16px auto; border-radius:50%; overflow:hidden;
  border:2px solid var(--accent-dim); box-shadow:0 0 0 6px rgba(242,183,5,0.07), 0 10px 30px rgba(0,0,0,.5);
}
.login-logo img{width:100%; height:100%; object-fit:cover; display:block;}
.login-brand .kicker{color:var(--accent); font-size:11px; letter-spacing:.18em; font-family:'Oswald'; text-transform:uppercase;}
.login-brand h1{font-size:30px; letter-spacing:.04em; margin-top:2px;}
.login-submit{width:100%; justify-content:center; padding:12px 16px; font-size:15px;}
.google-btn{width:100%; display:flex; align-items:center; justify-content:center; gap:10px; padding:11px 16px; font-size:14.5px; font-weight:600;
  background:#fff; color:#1f1f1f; border:1px solid #dadce0;}
.google-btn:hover{background:#f3f4f6; color:#1f1f1f; border-color:#c6c9ce;}
.google-btn:disabled{opacity:.6; cursor:wait;}
.login-or{display:flex; align-items:center; gap:10px; margin:16px 0; color:var(--text-faint); font-size:12px;}
.login-or::before, .login-or::after{content:''; flex:1; height:1px; background:var(--border-soft);}
.login-foot{font-size:12px; color:var(--text-faint); text-align:center;}
.login-card .form-error{margin:0 0 12px 0; min-height:0;}
.toast-wrap{position:fixed; bottom:20px; right:20px; z-index:100; display:flex; flex-direction:column; gap:8px; max-width:calc(100vw - 40px);}
.toast{background:var(--bg-elev); border:1px solid var(--border); border-left:3px solid var(--grass); padding:11px 14px; font-size:13.5px; box-shadow:0 8px 24px rgba(0,0,0,.35); animation:toastIn .18s ease;}
.toast.error{border-left-color:var(--danger);}
@keyframes toastIn{from{opacity:0; transform:translateY(6px);}to{opacity:1; transform:none;}}
.card-del{position:absolute; top:8px; right:8px; background:var(--bg-elev); z-index:2;}
.mural-card, .video-card{position:relative;}
.gate{border:1px solid var(--border-soft); background:var(--bg-card); padding:40px 24px; text-align:center; color:var(--text-dim); max-width:420px;}
.gate .lucide{width:28px; height:28px; color:var(--accent); margin-bottom:10px;}

.main{flex:1; padding:36px 44px; max-width:1100px;}
.page-head{margin-bottom:28px;}
.page-head .kicker{color:var(--accent); font-size:11px; letter-spacing:.14em; font-family:'Oswald'; text-transform:uppercase;}
.page-head h2{font-size:30px; margin-top:6px;}
.page-head p{color:var(--text-dim); margin-top:8px; font-size:14.5px; max-width:60ch;}

/* ---------- scoreboard stat cards ---------- */
.stat-row{display:flex; gap:1px; background:var(--border); border:1px solid var(--border); margin-bottom:32px; flex-wrap:wrap;}
.stat{
  flex:1; min-width:150px;
  background:var(--bg-card);
  padding:20px 22px;
}
.stat .label{font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.1em; font-family:'Oswald';}
.stat .value{font-size:40px; color:var(--accent); line-height:1.1; margin-top:6px;}
.stat .sub{font-size:12px; color:var(--text-faint); margin-top:4px;}

.section-title{font-size:14px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.08em; font-family:'Oswald'; margin:32px 0 14px 0; padding-bottom:8px; border-bottom:1px solid var(--border-soft);}
.section-title:first-of-type{margin-top:0;}

/* artilheiros table */
.rank-list{border:1px solid var(--border-soft);}
.rank-row{display:flex; align-items:center; gap:14px; padding:12px 16px; border-bottom:1px solid var(--border-soft);}
.rank-row:last-child{border-bottom:none;}
.rank-pos{font-family:'Oswald'; font-size:15px; color:var(--text-faint); width:22px;}
.rank-photo{width:34px; height:34px; border-radius:50%; object-fit:cover; background:var(--bg-elev); border:1px solid var(--border);}
.rank-name{flex:1; font-size:14.5px; font-weight:500;}
.rank-name .pos-tag{color:var(--text-faint); font-size:11.5px; margin-left:8px; text-transform:uppercase;}
.rank-goals{font-family:'Oswald'; color:var(--accent); font-size:18px;}

/* player grid */
.grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(180px,1fr)); gap:14px;}
.player-card{
  background:var(--bg-card); border:1px solid var(--border-soft); padding:16px;
  position:relative;
}
.player-card .num-badge{
  position:absolute; top:12px; right:12px; font-family:'Oswald'; font-size:13px;
  color:var(--accent); border:1px solid var(--border); padding:2px 7px;
}
.player-photo{width:100%; aspect-ratio:1; object-fit:cover; background:var(--bg-elev); margin-bottom:12px; border:1px solid var(--border-soft);}
.player-photo.placeholder{display:flex; align-items:center; justify-content:center; font-family:'Oswald'; font-size:34px; color:var(--text-faint);}
.player-card h3{font-size:15px; text-transform:none; letter-spacing:0; font-weight:600;}
.player-card .pos{color:var(--text-dim); font-size:12.5px; margin-top:2px;}
.player-card .freq{color:var(--text-faint); font-size:11.5px; margin-top:8px;}
.stars{margin-top:4px; font-size:14px; letter-spacing:1px; color:var(--border);}
.stars .filled{color:var(--accent);}
.stars .half, .star-picker .half{background:linear-gradient(90deg, var(--accent) 50%, var(--border) 50%); -webkit-background-clip:text; background-clip:text; color:transparent;}
.star-picker{display:flex; gap:4px; font-size:22px; color:var(--border); cursor:pointer;}
.star-picker span.filled{color:var(--accent);}
#starsPreview .star-picker{cursor:default;}

/* fifa-style cards */
.fifa-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:22px;}
.fifa-card{
  position:relative;
  background:
    linear-gradient(160deg, var(--accent-soft), transparent 55%),
    var(--bg-card);
  border:1px solid var(--accent-dim);
  clip-path:polygon(0 0, 100% 0, 100% 88%, 50% 100%, 0 88%);
  padding:22px 20px 34px 20px;
  text-align:center;
}
.fifa-top{display:flex; align-items:flex-start; justify-content:space-between; text-align:left;}
.fifa-ovr{font-family:'Oswald'; font-size:34px; color:var(--accent); line-height:1;}
.fifa-pos{font-family:'Oswald'; font-size:14px; color:var(--text-dim); margin-top:4px; letter-spacing:.04em;}
.fifa-num{font-family:'Oswald'; font-size:13px; color:var(--text-faint); border:1px solid var(--border); padding:2px 7px; height:fit-content;}
.fifa-photo{width:92px; height:92px; margin:6px auto 10px auto; border-radius:50%; overflow:hidden; border:2px solid var(--accent-dim); background:var(--bg-elev);}
.fifa-photo img{width:100%; height:100%; object-fit:cover;}
.fifa-photo-ph{width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-family:'Oswald'; font-size:34px; color:var(--text-faint);}
.fifa-name{font-family:'Oswald'; font-size:17px; letter-spacing:.03em; text-transform:uppercase;}
.fifa-stars{justify-content:center; display:flex; gap:2px; margin-top:6px; font-size:13px;}
.vote-legend{border:1px solid var(--border-soft); background:var(--bg-card); margin-bottom:18px;}
.vote-legend summary{cursor:pointer; padding:10px 14px; font-size:13px; color:var(--text-dim); display:flex; align-items:center; gap:8px; list-style:none;}
.vote-legend summary svg{width:15px; height:15px;}
.vote-legend-body{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:14px 28px; padding:4px 14px 14px;}
.vote-legend-title{font-family:'Oswald'; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-faint); margin-bottom:6px;}
.vote-legend-row{font-size:13px; padding:3px 0;}
.vote-legend-row b{font-family:'Oswald'; font-weight:500; color:var(--accent); display:inline-block; min-width:34px;}
.vote-legend-row span{color:var(--text-faint);}
.vote-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:14px;}
.vote-card{background:var(--bg-card); border:1px solid var(--border-soft); padding:14px 16px;}
.vote-card.voted{border-color:var(--accent-dim);}
.vote-head{display:flex; align-items:center; gap:12px; margin-bottom:12px;}
.vote-photo{width:42px; height:42px; border-radius:50%; object-fit:cover; background:var(--bg-elev); border:1px solid var(--border); flex-shrink:0;}
.vote-name{font-weight:600; font-size:14.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.vote-name .you{font-size:10.5px; color:var(--text-faint); border:1px solid var(--border); padding:1px 6px; margin-left:6px; text-transform:uppercase; letter-spacing:.05em; font-weight:400;}
.vote-meta{font-size:12px; color:var(--text-faint); margin-top:2px;}
.vote-score{text-align:right; flex-shrink:0;}
.vote-score .stars{margin-top:0;}
.vote-fields{display:grid; grid-template-columns:repeat(3,1fr); gap:8px 10px;}
.vote-field{display:flex; align-items:center; gap:8px; margin:0; cursor:help;}
.vote-field span{font-family:'Oswald'; font-size:12.5px; letter-spacing:.04em; color:var(--text-dim); min-width:30px;}
.vote-field input{text-align:center; padding:7px 4px; min-width:0;}
.vote-bar{position:sticky; bottom:0; z-index:5; display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-top:18px; padding:12px 16px; background:var(--bg-elev); border:1px solid var(--border);}
.vote-progress{flex:1; font-size:13.5px; color:var(--text-dim);}
.vote-progress b{color:var(--accent); font-family:'Oswald'; font-weight:500;}
.fifa-type{font-family:'Oswald'; font-size:11.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-faint); margin-top:2px;}
.attr-list{border-top:1px solid var(--border-soft);}
.attr-row{display:grid; grid-template-columns:1fr 76px; gap:12px; align-items:center; padding:8px 0; border-bottom:1px solid var(--border-soft);}
.attr-name{font-size:13.5px; font-weight:600;}
.attr-name .abbr{font-family:'Oswald'; font-weight:500; color:var(--accent); margin-right:6px; letter-spacing:.04em;}
.attr-hint{font-size:11.5px; color:var(--text-faint); margin-top:2px;}
.attr-row input{text-align:center;}
.fifa-stats{
  display:grid; grid-template-columns:1fr 1fr; grid-template-rows:repeat(3,auto); grid-auto-flow:column; column-gap:18px; row-gap:8px;
  margin-top:18px; padding-top:16px; border-top:1px solid var(--border-soft);
}
.fifa-stat{display:flex; align-items:center; justify-content:center; gap:8px; font-family:'Oswald'; font-size:14px;}
.fifa-stat .v{color:var(--accent); font-size:17px;}
.fifa-stat .k{color:var(--text-dim); font-size:12px; letter-spacing:.03em;}
.player-card .actions{display:flex; gap:6px; margin-top:12px;}
.player-card .actions button{flex:1; padding:6px; font-size:12px;}

/* matches */
.match-list{display:flex; flex-direction:column; gap:10px;}
.match-row{
  background:var(--bg-card); border:1px solid var(--border-soft);
  padding:16px 18px; display:flex; align-items:center; gap:16px; cursor:pointer;
}
.match-row:hover{border-color:var(--border);}
.match-date{font-family:'Oswald'; font-size:20px; color:var(--text); width:110px;}
.match-info{flex:1;}
.match-info .label-line{font-size:14px; font-weight:600;}
.match-info .sub-line{font-size:12.5px; color:var(--text-dim); margin-top:2px;}
.match-status{font-size:11px; text-transform:uppercase; letter-spacing:.08em; font-family:'Oswald'; padding:4px 9px; border:1px solid var(--border);}
.match-status.open{color:var(--accent); border-color:var(--accent-dim);}
.match-status.closed{color:var(--text-faint);}

.presence-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:10px; margin-top:16px;}
.presence-item{
  display:flex; align-items:center; gap:10px; padding:10px 12px;
  border:1px solid var(--border-soft); background:var(--bg-card);
}
.presence-item.present{border-color:var(--grass-dim); background:rgba(76,122,82,0.08);}
.presence-item img{width:30px; height:30px; border-radius:50%; object-fit:cover; background:var(--bg-elev); flex-shrink:0;}
.presence-item .pname{flex:1; font-size:13.5px;}
.presence-item .goal-ctrl{display:flex; align-items:center; gap:6px;}
.presence-item .goal-ctrl button{padding:2px 8px; font-size:13px; line-height:1;}
.presence-item .goal-ctrl .gnum{font-family:'Oswald'; width:16px; text-align:center; color:var(--accent);}
.checkbox{width:18px; height:18px; accent-color:var(--accent); flex-shrink:0;}

/* mural */
.mural-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:14px;}
.mural-card{background:var(--bg-card); border:1px solid var(--border-soft); overflow:hidden;}
.mural-card img{width:100%; aspect-ratio:4/3; object-fit:cover; display:block;}
.mural-card .cap{padding:10px 12px;}
.mural-card .cap .txt{font-size:13px;}
.mural-card .cap .meta{font-size:11px; color:var(--text-faint); margin-top:4px;}

.channel-row{display:flex; gap:10px; margin:18px 0 26px 0; flex-wrap:wrap;}
.channel-link{
  display:flex; align-items:center; gap:8px; border:1px solid var(--border);
  padding:9px 14px; font-size:13px; font-weight:600; color:var(--text);
  background:var(--bg-elev); text-decoration:none;
}
.channel-link:hover{border-color:var(--accent-dim);}
.channel-link svg{width:16px; height:16px; flex-shrink:0;}
.momentos-tabs{display:flex; gap:2px; margin-bottom:20px; border-bottom:1px solid var(--border-soft);}
.momentos-tabs button{background:none; border:none; border-bottom:2px solid transparent; border-radius:0; color:var(--text-faint); padding:9px 4px; margin-right:22px; font-family:'Oswald'; font-size:13px; letter-spacing:.05em; text-transform:uppercase;}
.momentos-tabs button.active{color:var(--accent); border-bottom-color:var(--accent);}
.video-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:18px;}
.video-card{background:var(--bg-card); border:1px solid var(--border-soft);}
.video-embed{position:relative; width:100%; aspect-ratio:16/9; background:#000;}
.video-embed iframe{position:absolute; inset:0; width:100%; height:100%; border:0;}
.video-card .cap{padding:12px 14px;}
.video-card .cap .txt{font-size:13.5px; font-weight:600;}

/* modal */
.overlay{
  position:fixed; inset:0; background:rgba(10,9,7,0.72);
  display:flex; align-items:center; justify-content:center; z-index:50; padding:20px;
}
.modal{
  background:var(--bg-elev); border:1px solid var(--border); padding:28px;
  width:100%; max-width:440px; max-height:88vh; overflow-y:auto; overflow-x:hidden;
}
.modal h3{font-size:19px; margin-bottom:20px;}
.modal-actions{display:flex; gap:10px; margin-top:22px; justify-content:flex-end;}
.modal.modal-wide{max-width:640px;}

/* ---------- partidas ---------- */
.pm-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:16px;}
.pm-card{background:var(--bg-card); border:1px solid var(--border-soft); cursor:pointer; display:flex; flex-direction:column; transition:border-color .15s;}
.pm-card:hover, .pm-card:focus-visible{border-color:var(--accent-dim); outline:none;}
.pm-cover{position:relative; aspect-ratio:16/9; background:var(--bg-elev); display:flex; align-items:center; justify-content:center; color:var(--text-faint); overflow:hidden;}
.pm-cover img{width:100%; height:100%; object-fit:cover; display:block;}
.pm-cover > .lucide{width:34px; height:34px; opacity:.5;}
/* sem foto: a capa é a miniatura do vídeo e o play fica no centro; com foto: botão no canto */
/* carrossel da capa (arrasta no celular, setas no computador) */
.pm-slides{position:absolute; inset:0; display:flex; overflow-x:auto; scroll-snap-type:x mandatory; scroll-behavior:smooth; scrollbar-width:none;}
.pm-slides::-webkit-scrollbar{display:none;}
.pm-slide{position:relative; flex:0 0 100%; scroll-snap-align:start; background:#000;}
.pm-slide-video{cursor:pointer;}
.pm-play{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:64px; height:64px; border-radius:50%;
  display:flex; align-items:center; justify-content:center; color:#fff; background:rgba(0,0,0,.6); transition:background .15s, transform .15s; pointer-events:none;}
.pm-slide-video:hover .pm-play{background:var(--accent); color:#111; transform:translate(-50%,-50%) scale(1.08);}
.pm-play .lucide{width:28px; height:28px; fill:currentColor; margin-left:3px;}
.pm-nav{position:absolute; top:50%; transform:translateY(-50%); width:32px; height:32px; border-radius:50%; border:0; padding:0;
  display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.55); color:#fff; opacity:0; transition:opacity .15s;}
.pm-nav.prev{left:8px;} .pm-nav.next{right:8px;}
.pm-nav .lucide{width:18px; height:18px;}
.pm-card:hover .pm-nav, .pm-nav:focus-visible{opacity:1;}
.pm-nav[disabled]{opacity:0 !important; pointer-events:none;}
@media (hover:none){ .pm-nav{display:none;} }
.pm-dots{position:absolute; left:0; right:0; bottom:8px; display:flex; justify-content:center; gap:5px; pointer-events:none;}
.pm-dots span{width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,.45); transition:background .15s, transform .15s;}
.pm-dots span.vid{border-radius:1px; transform:rotate(45deg) scale(.9);}
.pm-dots span.on{background:#fff;}
.pm-vbadge{position:absolute; top:8px; right:8px; display:flex; align-items:center; gap:5px; padding:4px 10px 4px 8px; border:0; border-radius:14px;
  background:rgba(0,0,0,.65); color:#fff; font-size:12px; font-weight:600;}
.pm-vbadge:hover{background:var(--accent); color:#111;}
.pm-vbadge .lucide{width:13px; height:13px; fill:currentColor;}
/* popup do vídeo */
.video-pop{background:#000; width:min(960px, 94vw); position:relative;}
.video-pop .video-embed{aspect-ratio:16/9;}
.video-pop-bar{display:flex; align-items:center; gap:10px; padding:10px 12px; background:var(--bg-elev); color:var(--text);}
.video-pop-bar .t{flex:1; min-width:0; font-size:13.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.video-pop-bar .n{font-size:12px; color:var(--text-faint);}
.pm-body{padding:14px 16px 16px; display:flex; flex-direction:column; gap:10px;}
.pm-date{font-family:'Oswald'; font-size:18px; color:var(--text);}
.pm-label{font-size:13px; color:var(--text-dim); margin-top:-6px;}
.pm-avatars{display:flex; align-items:center;}
.pm-avatars > span{margin-right:-8px;}
.pm-av{width:28px; height:28px; border-radius:50%; object-fit:cover; background:var(--bg-elev); border:2px solid var(--bg-card); flex-shrink:0;}
.pm-more{margin-left:14px; font-size:12px; color:var(--text-faint);}
.pm-meta{display:flex; gap:14px; font-size:12.5px; color:var(--text-dim); flex-wrap:wrap;}
.pm-meta span{display:inline-flex; align-items:center; gap:5px;}
.pm-meta .lucide{width:14px; height:14px;}
.pm-notes{font-size:13px; color:var(--text-dim); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; white-space:pre-line;}
.pm-notes-full{font-size:14px; line-height:1.55; white-space:pre-line; max-width:75ch;}
.pm-present{display:flex; flex-wrap:wrap; gap:8px;}
.pm-chip{display:flex; align-items:center; gap:8px; padding:5px 12px 5px 5px; border:1px solid var(--border-soft); background:var(--bg-card); font-size:13px;}
.pm-chip .pm-av{border:0;}
.pm-chip b{font-weight:600; color:var(--accent); font-size:11.5px;}
.type-flag{flex-shrink:0; font-family:'Oswald'; font-size:10px; letter-spacing:.06em; text-transform:uppercase; padding:2px 7px; border:1px solid; line-height:1.4;}
.type-flag.men{color:#5aa9e6; border-color:rgba(90,169,230,.5); background:rgba(90,169,230,.1);}
.type-flag.dia{color:#e0a43a; border-color:rgba(224,164,58,.5); background:rgba(224,164,58,.1);}
.type-flag.gol{color:#4cbf7a; border-color:rgba(76,191,122,.5); background:rgba(76,191,122,.1);}
.type-summary{text-transform:none; letter-spacing:0; font-family:'Inter',sans-serif; font-size:12.5px; color:var(--text-faint);}
.pm-loose{margin-top:36px; border-top:1px solid var(--border-soft); padding-top:16px;}
.pm-loose summary{cursor:pointer; color:var(--text-dim); font-size:13.5px; display:flex; align-items:center; gap:8px;}
.pm-loose summary .lucide{width:16px; height:16px;}
.pm-field-head{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px;}
.pm-count{display:inline-block; min-width:22px; text-align:center; padding:1px 7px; margin-left:6px; background:var(--accent-soft); color:var(--accent); font-size:11.5px;}
.pm-mini{padding:4px 10px; font-size:12px;}
.pm-presence{margin-top:0; grid-template-columns:repeat(auto-fill, minmax(170px,1fr)); gap:6px;}
.pm-presence .presence-item{margin:0; cursor:pointer; padding:7px 10px; color:var(--text);}
.pm-presence .presence-item > div:not(.pname){width:26px; height:26px; border-radius:50%; background:var(--bg-elev); flex-shrink:0;}
.pm-presence .presence-item img{width:26px; height:26px;}
.pm-thumbs{display:grid; grid-template-columns:repeat(auto-fill, minmax(92px,1fr)); gap:8px; padding:4px; margin:-4px; border:1px dashed transparent; transition:border-color .15s, background .15s;}
.pm-thumbs.drag-over{border-color:var(--accent); background:var(--accent-soft);}
.pm-thumb{position:relative; aspect-ratio:1; background:var(--bg); border:1px solid var(--border-soft); overflow:hidden;}
.pm-thumb img{width:100%; height:100%; object-fit:cover; display:block;}
.pm-thumb-x{position:absolute; top:4px; right:4px; padding:3px; background:rgba(0,0,0,.6); color:#fff; border:0; display:flex;}
.pm-thumb-x .lucide{width:14px; height:14px;}
.pm-thumb-add{border:1px dashed var(--border); color:var(--text-dim); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; font-size:11.5px; background:transparent; padding:0;}
.pm-video-row{display:flex; align-items:center; gap:8px; padding:6px 8px; border:1px solid var(--border-soft); margin-bottom:6px; font-size:13px;}
.pm-video-row > .lucide{width:16px; height:16px; color:var(--text-faint); flex-shrink:0;}
.pm-video-title{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
textarea{width:100%; resize:vertical;}
.photo-pick{
  border:1px dashed var(--border); padding:16px; text-align:center; font-size:12.5px;
  color:var(--text-dim); cursor:pointer; margin-bottom:6px;
}
.photo-pick img{max-width:100%; max-height:120px; display:block; margin:0 auto 8px auto; border-radius:50%; width:90px; height:90px; object-fit:cover;}

.empty{color:var(--text-faint); font-size:13.5px; padding:20px 0;}
.topbar-mobile{display:none;}

@media (max-width:820px){
  #app{flex-direction:column;}
  .sidebar, .sidebar.collapsed{width:100%; height:auto; flex-direction:row; align-items:center; padding:10px 16px; position:sticky; top:0; z-index:20; gap:10px;}
  .brand, .sidebar.collapsed .brand{border:none; padding:0; margin:0; flex-direction:row;}
  .brand-logo, .sidebar.collapsed .brand-logo{width:34px; height:34px;}
  .brand-text, .collapse-btn{display:none;}
  .nav, .sidebar.collapsed .nav{flex-direction:row; padding:0; overflow-x:auto; flex:1;}
  .nav button, .sidebar.collapsed .nav button{white-space:nowrap; padding:8px 10px; font-size:11.5px; gap:6px; justify-content:flex-start;}
  .nav button .lucide{width:19px; height:19px;}
  .nav .nav-label{display:none;}
  .result-row{grid-template-columns:1fr 1fr;}
  .result-row .name{grid-column:1 / -1;}
  .result-row.head{display:none;}
  .sidebar, .sidebar.collapsed{flex-wrap:wrap;}
  .env-switch, .sidebar.collapsed .env-switch{order:10; width:100%; grid-template-columns:repeat(4,1fr); padding:0; margin:4px 0 0 0;}
  .sidebar.collapsed .env-switch .env-label{display:inline;}
  .env-switch button{font-size:10.5px; padding:7px 2px; gap:4px;}
  .nav-global, .sidebar.collapsed .nav-global{border:none; margin:0; padding:0; flex:0 0 auto;}
  .nav-title{display:none;}
  .nav-badge, .sidebar.collapsed .nav-badge{position:absolute; top:0; right:0; min-width:15px; height:15px; font-size:9.5px;}
  .nav, .sidebar.collapsed .nav{gap:0; justify-content:space-around;}
  .nav button.active{padding-left:10px; border-left:none; border-bottom:2px solid var(--accent);}
  .sidebar-foot, .sidebar.collapsed .sidebar-foot{border:none; margin:0; padding:0;}
  .schedule, .account-info, .account .avatar{display:none;}
  .account{gap:2px;}
  .nav button, .sidebar.collapsed .nav button{padding:8px;}
  .account, .sidebar.collapsed .account{flex-direction:row;}
  .login-btn{padding:8px;}
  .login-btn .nav-label{display:none;}
  .main{padding:24px 16px;}
  .form-row{grid-template-columns:1fr;}
  .users-table thead{display:none;}
  .users-table, .users-table tbody, .users-table tr, .users-table td{display:block; width:100%;}
  .users-table tr{border-bottom:1px solid var(--border-soft); padding:10px 4px;}
  .users-table td{border:none; padding:5px 10px;}
  .td-actions{text-align:left;}
}
</style>

<script>
/* ============ storage helpers (Firestore) ============ */
const firebaseConfig = {
  apiKey: "AIzaSyDciHxLskZdyZ9nWzSAwFmjvwJ2YT26G8A",
  authDomain: "pelada-cavernosos.firebaseapp.com",

};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

// Cada item (jogador, partida, foto, vídeo) é um documento na coleção de mesmo nome.
// `synced` guarda o último JSON salvo/lido de cada item, para só gravar o que mudou
// e só apagar o que este navegador conhecia (nunca itens que outra pessoa acabou de criar).
const synced = {};
let loadFailed = false;

async function sGet(key){
  try{
    const snap = await db.collection(key).get();
    const items = snap.docs.map(d=> d.data()).sort((a,b)=> (a._order||0) - (b._order||0));
    synced[key] = {};
    items.forEach(it=>{ delete it._order; synced[key][it.id] = JSON.stringify(it); });
    return items;
  }catch(e){
    console.error('storage get failed', key, e);
    loadFailed = true;
    return null;
  }
}
async function sSet(key, val){
  try{
    const known = synced[key] || (synced[key] = {});
    const batch = db.batch();
    const col = db.collection(key);
    const ids = new Set();
    let ops = 0;
    val.forEach((item, i)=>{
      ids.add(item.id);
      const json = JSON.stringify(item);
      if(known[item.id] === json) return;
      batch.set(col.doc(item.id), {...JSON.parse(json), _order: i});
      known[item.id] = json; ops++;
    });
    Object.keys(known).forEach(id=>{
      if(!ids.has(id)){ batch.delete(col.doc(id)); delete known[id]; ops++; }
    });
    if(ops) await batch.commit();
    return true;
  }catch(e){
    console.error('storage set failed', key, e);
    toast(e.code === 'permission-denied'
      ? 'Você não tem permissão para essa ação.'
      : 'Não foi possível salvar. Verifique a conexão e tente de novo.', 'error');
    // desfaz a mudança local recarregando o que está no banco
    const fresh = await sGet(key);
    if(fresh) state[key] = fresh;
    render();
    return false;
  }
}

async function syncDirectory(){
  try{
    const col = db.collection('directory');
    const current = new Map((await col.get()).docs.map(d=> [d.id, d.data()]));
    const batch = db.batch();
    let ops = 0;
    state.users.forEach(u=>{
      const entry = directoryEntry(u);
      const old = current.get(u.id);
      const same = old && old.username === entry.username && old.firstName === entry.firstName && old.lastName === entry.lastName
        && old.active === entry.active && (old.envs||[]).join() === entry.envs.join();
      if(!same){ batch.set(col.doc(u.id), entry); ops++; }
      current.delete(u.id);
    });
    current.forEach((_, id)=>{ batch.delete(col.doc(id)); ops++; });
    if(ops) await batch.commit();
    state.directory = state.users.map(directoryEntry);
  }catch(e){ console.error('directory sync failed', e); }

async function resolveCurrentUser(fbUser){
  if(state.settingUp) return; // o cadastro do primeiro admin ainda está sendo gravado

  try{

        return;
      }
      await auth.signOut();
      state.justLoggedIn = false;
      state.authMode = 'registered';
      state.registeredEmail = u.email;
      return;
    }
    if(!u || u.active === false){

        : userStatus(u) === 'pending' ? 'Seu cadastro está aguardando aprovação dos administradores.'

// Nome de usuário a partir do e-mail (joao.silva@gmail.com → joao.silva); se já existir, joao.silva2, 3...
async function freeUsernameFrom(email){
  let base = normUsername(email.split('@')[0]).normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/\+.*$/, '').replace(/[^a-z0-9._-]/g, '').slice(0, 26);
  if(base.length < 3) base = (base + 'user').slice(0, 26);
  for(let i = 1; i < 50; i++){
    const name = i === 1 ? base : base + i;
    const doc = await db.collection('logins').doc(name).get();
    if(!doc.exists) return name;
  }
  return base + Math.random().toString(36).slice(2, 6);
}
async function registerGoogleUser(fbUser){
  const g = fbUser.providerData.find(p=> p.providerId === 'google.com') || fbUser;
  const email = normEmail(g.email || fbUser.email || '');
  const parts = cleanName(g.displayName || fbUser.displayName || '').split(' ');
  const firstName = parts[0] || email.split('@')[0];
  const lastName = parts.slice(1).join(' ');
  const username = await freeUsernameFrom(email);
  const now = new Date().toISOString();
  const user = {id: fbUser.uid, username, firstName, lastName, email, role:'user', profiles:[], perms:[],
                active:false, status:'pending', selfRegistered:true, authProvider:'google',
                photoURL: g.photoURL || '', createdAt: now, createdBy: username};
  const batch = db.batch();
  batch.set(db.collection('users').doc(user.id), user);
  // reserva o nome de usuário (quem entra com Google não usa senha)
  batch.set(db.collection('logins').doc(username), {uid: user.id, email, google: true});
  await batch.commit();
  return user;
}

function playerAttrDefs(player){ return isGK(player) ? GK_ATTRS : FIELD_ATTRS; }
// Votos completos (os 6 campos) que o jogador recebeu, conforme o tipo atual dele.
function playerVotes(player){
  const defs = playerAttrDefs(player);
  return (state.votes || [])
    .map(v=>{
      const r = v.ratings && v.ratings[player.id];
      if(!r || !defs.every(d=> typeof r[d.k] === 'number')) return null;
      if(v.scale === 10) return r;
      const out = {}; defs.forEach(d=> out[d.k] = from99(r[d.k])); return out;   // voto antigo (0-99)
    })
    .filter(Boolean);

// Com votos, vale a média deles; sem votos, os valores do cadastro. Sempre inteiros de 0 a 10.
function playerAttrValues(player){
  const defs = playerAttrDefs(player);
  const votes = playerVotes(player);
  const out = {};
  if(votes.length){
    defs.forEach(d=> out[d.k] = clamp10(votes.reduce((s,r)=> s + r[d.k], 0) / votes.length));
    return out;
  }
  const src = isGK(player) ? player.gkAttrs : player.attrs;
  defs.forEach(d=> out[d.k] = src && src[d.k] != null ? (player.attrScale === 10 ? clamp10(src[d.k]) : from99(src[d.k])) : 5);
  return out;
}
function attrAverage(player){
  const v = playerAttrValues(player);
  const keys = Object.keys(v);
  return keys.reduce((s,k)=> s + v[k], 0) / keys.length;
}
function computeOVR(player){ return clamp10(attrAverage(player)); }
const KNOWN_ATTRS = {
  'maciel': {rit:70,fin:85,pas:80,dri:45,def:90,fis:70},
  'resende': {rit:60,fin:90,pas:78,dri:62,def:70,fis:62},
  'pereira': {rit:65,fin:95,pas:92,dri:88,def:65,fis:66},
};
async function migratePlayers(){
  let changed = false;
  state.players.forEach(p=>{
    if(!p.attrs){
      const key = Object.keys(KNOWN_ATTRS).find(k=> p.name.toLowerCase().includes(k));
      p.attrs = key ? KNOWN_ATTRS[key] : {rit:50,fin:50,pas:50,dri:50,def:50,fis:50};
      changed = true;
    }
  });
  if(changed) await savePlayers();
}

async function loadAll(){
  const [players, matches, mural, videos] = await Promise.all([
    sGet('players'), sGet('matches'), sGet('mural'), sGet('videos')
  ]);
  state.players = players || [];
  state.matches = matches || [];
  state.mural = mural || [];
  state.videos = videos || [];
  // coleções dos outros ambientes: se as regras do banco ainda não as liberam,
  // o resto do site segue funcionando
  const failedBefore = loadFailed;
  const lists = await Promise.all(EXTRA_COLLECTIONS.map(k=> sGet(k)));
  EXTRA_COLLECTIONS.forEach((k,i)=> state[k] = lists[i] || []);
  loadFailed = failedBefore;
}
const EXTRA_COLLECTIONS = ['games_videos','outros_videos','bg_games','bg_matches','bg_videos','bg_photos','bg_guests','bg_collection','directory','votes'];

function savePlayers(){ return sSet('players', state.players); }
function saveMatches(){ return sSet('matches', state.matches); }
function saveMural(){ return sSet('mural', state.mural); }

function extractYoutubeId(url){
  const m = (url||'').match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
  return m ? m[1] : null;
}

/* ============ image resize helper ============ */
function resizeImage(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e =>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > h){ if(w > maxDim){ h = Math.round(h * maxDim/w); w = maxDim; } }
        else { if(h > maxDim){ w = Math.round(w * maxDim/h); h = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ============ render root ============ */
let booted = false;
function render(){
  if(!booted) return;
  const app = document.getElementById('app');
  // mantém o foco/cursor da busca de usuários entre renders
  const search = document.getElementById('usersSearch');
  const keepFocus = search && document.activeElement === search;
  const caret = keepFocus ? search.selectionStart : null;
  applyEnvTheme();
  if(!state.currentUser){
    app.innerHTML = renderLoginScreen();
    bindAuthModals();
  } else if(loadFailed){
    app.innerHTML = `<div class="login-screen"><div class="login-card"><p class="empty">Não foi possível carregar os dados. Verifique a conexão.</p><button class="primary" onclick="location.reload()">Tentar de novo</button></div></div>`;
  } else {
    app.innerHTML = renderShell();
    bindShell();
  }
  if(window.lucide) lucide.createIcons();
  const newSearch = keepFocus && document.getElementById('usersSearch');
  if(newSearch){ newSearch.focus(); newSearch.setSelectionRange(caret, caret); }
}
window.addEventListener('DOMContentLoaded', async ()=>{
  await loadSettings();
  // se o Firebase não responder (rede lenta, navegador bloqueando), mostra a tela de login mesmo assim
  setTimeout(()=>{ if(!booted){ booted = true; render(); } }, 4000);
  auth.onAuthStateChanged(async fbUser=>{
    if(state.settingUp) return; // o formulário do primeiro admin cuida do resto
    await resolveCurrentUser(fbUser);
    if(state.currentUser) await enterApp();
    else clearData();
    booted = true;
    render();
  });
});
document.addEventListener('keydown', e=>{
  if(e.key === 'Escape' && state.modal){ state.modal = null; render(); }
});

function navButton(n){
  const badge = n.id === 'users' && isAdmin() ? pendingCount() : 0;
  return `<button data-nav="${n.id}" class="${state.view===n.id?'active':''}" title="${n.label}${badge ? ` (${badge} aguardando aprovação)` : ''}">${icon(n.icon)}<span class="nav-label">${n.label}</span>${badge ? `<span class="nav-badge">${badge}</span>` : ''}</button>`;
}
function renderShell(){
  const nav = visibleNav();
  if(!nav.some(n=> n.id === state.view) && nav.length) state.view = nav[0].id;
  const env = currentEnv();
  const envs = visibleEnvs();
  const envItems = env ? envNav(env) : [];
  const globalItems = GLOBAL_NAV.filter(n=> can(n.perm));
  const collapsed = state.sidebarCollapsed;
  const u = state.currentUser;
  return `
  <div class="sidebar ${collapsed ? 'collapsed' : ''}">
    <button class="collapse-btn" id="collapseBtn" title="${collapsed ? 'Expandir menu' : 'Recolher menu'}" aria-label="${collapsed ? 'Expandir menu' : 'Recolher menu'}">
      ${icon(collapsed ? 'chevron-right' : 'chevron-left')}
    </button>
    <div class="brand">
      <div class="brand-logo"><img src="${LOGO_DATA_URI}" alt="Cavernosos"></div>
      <div class="brand-text"><h1>CAVERNOSOS</h1></div>
    </div>
    ${envs.length > 1 ? `
    <div class="env-switch" role="tablist" aria-label="Ambiente">
      ${envs.map(e=>`<button role="tab" data-env="${e.id}" class="${env && env.id===e.id?'active':''}" aria-selected="${env && env.id===e.id}" title="${e.label}">${icon(e.icon)}<span class="env-label">${e.label}</span></button>`).join('')}
    </div>` : ''}
    <div class="nav">
      ${envItems.map(navButton).join('')}
    </div>
    ${globalItems.length ? `
    <div class="nav nav-global" style="flex:0 0 auto;">
      <div class="nav-title">Geral</div>
      ${globalItems.map(navButton).join('')}
    </div>` : ''}
    <div class="sidebar-foot">
      ${env && env.id === 'pelada' ? `
      <div class="schedule">
        <div class="when">Quinta-feira, 21h às 22h30</div>
        <div class="where">Sargento Wolf, Afogados</div>
      </div>` : ''}
      <div class="account">
        <div class="avatar" title="${esc(u.username)}">${esc(u.username.charAt(0))}</div>
        <div class="account-info">
          <div class="uname">${esc(u.username)}</div>
          <div class="urole">${ROLES[u.role] || u.role}</div>
        </div>
        <button class="icon-btn" id="myAccountBtn" title="Minha conta" aria-label="Minha conta">${icon('key-round')}</button>
        <button class="icon-btn danger-hover" id="logoutBtn" title="Sair" aria-label="Sair">${icon('log-out')}</button>
      </div>
    </div>
  </div>
  <div class="main">
    ${nav.length ? renderView() : renderNoAccess()}
  </div>
  ${state.modal ? renderModal() : ''}
  `;
}
function renderNoAccess(){
  return `
    <div class="gate">
      ${icon('lock')}
      <p>Seu usuário ainda não tem acesso a nenhuma área do site. Fale com um administrador.</p>
    </div>`;
}
function bindShell(){
  document.querySelectorAll('[data-nav]').forEach(b=>{
    b.onclick = ()=>{
      state.view = b.dataset.nav; state.modal=null; state.openMatchId=null; state.bgOpen=null; state.bgStack=[];
      const env = currentEnv();
      if(env && env.nav.some(n=> n.id === state.view)) state.envViews[env.id] = state.view;
      render();
    };
  });
  document.querySelectorAll('.env-switch [data-env]').forEach(b=>{
    b.onclick = ()=>{
      const env = ENVS.find(e=> e.id === b.dataset.env);
      state.env = env.id;
      lsSet('cavernosos:env', env.id);
      const nav = envNav(env);
      state.view = nav.some(n=> n.id === state.envViews[env.id]) ? state.envViews[env.id] : nav[0].id;
      state.modal = null; state.openMatchId = null; state.bgOpen = null; state.bgStack = [];
      render();
    };
  });
  const collapseBtn = document.getElementById('collapseBtn');
  if(collapseBtn) collapseBtn.onclick = ()=>{
    state.sidebarCollapsed = !state.sidebarCollapsed;
    lsSet('cavernosos:sidebar', state.sidebarCollapsed ? 'collapsed' : 'open');
    render();
  };
  const logoutBtn = document.getElementById('logoutBtn');
  if(logoutBtn) logoutBtn.onclick = async ()=>{ await auth.signOut(); toast('Você saiu.'); };
  const myAccountBtn = document.getElementById('myAccountBtn');
  if(myAccountBtn) myAccountBtn.onclick = ()=>{ state.modal = {type:'account', data:null}; render(); };
  bindViewEvents();
  bindOtherEnvEvents();
  bindUsersEvents();
  bindModalEvents();
  bindAuthModals();
}

function renderView(){
  if(state.view === 'dashboard') return renderDashboard();
  if(state.view === 'players') return renderPlayers();
  if(state.view === 'votes') return renderVotes();
  if(state.view === 'matches' || state.view === 'mural') return renderMatches();
  if(state.view === 'users') return renderUsers();
  if(state.view === 'games-videos') return renderGamesVideos();
  if(state.bgOpen && state.view.startsWith('bg-')) return renderBgDetail();
  if(state.view === 'bg-matches') return renderBgMatches();
  if(state.view === 'bg-players') return renderBgPlayers();
  if(state.view === 'bg-recap') return renderBgRecap();
  if(state.view === 'bg-rankings') return renderBgRankings();
  if(state.view === 'bg-library') return renderBgLibrary();
  if(state.view === 'bg-media') return renderBgMedia();
  if(state.view === 'outros-videos') return renderOutrosVideos();
  return '';
}

/* ============ DASHBOARD ============ */
function computeStats(){
  const totalMatches = state.matches.length;
  const totalGoals = state.matches.reduce((s,m)=> s + Object.values(m.goals||{}).reduce((a,b)=>a+b,0), 0);
  const totalPresences = state.matches.reduce((s,m)=> s + (m.presence||[]).length, 0);
  const scorers = {};
  const presences = {};
  state.matches.forEach(m=>{
    (m.presence||[]).forEach(pid=>{ presences[pid] = (presences[pid]||0)+1; });
    Object.entries(m.goals||{}).forEach(([pid,g])=>{ scorers[pid] = (scorers[pid]||0)+g; });
  });
  const topScorers = Object.entries(scorers).sort((a,b)=>b[1]-a[1]).slice(0,8)
    .map(([pid,g])=>({player: state.players.find(p=>p.id===pid), goals:g}))
    .filter(x=>x.player);
  const topPresence = Object.entries(presences).sort((a,b)=>b[1]-a[1]).slice(0,8)
    .map(([pid,c])=>({player: state.players.find(p=>p.id===pid), count:c}))
    .filter(x=>x.player);
  return {totalMatches, totalGoals, totalPresences, topScorers, topPresence};
}
function renderDashboard(){
  const s = computeStats();
  const avgGoals = s.totalMatches ? (s.totalGoals/s.totalMatches).toFixed(1) : '0.0';
  return `
    <div class="page-head">
      <div class="kicker">Placar geral</div>
      <h2>Painel</h2>
      <p>Quinta-feira, 21h às 22h30 · Sargento Wolf, Afogados</p>
    </div>
    <div class="stat-row">
      <div class="stat"><div class="label">Partidas</div><div class="value num">${s.totalMatches}</div></div>
      <div class="stat"><div class="label">Gols no total</div><div class="value num">${s.totalGoals}</div><div class="sub">${avgGoals} por partida</div></div>
      <div class="stat"><div class="label">Presenças confirmadas</div><div class="value num">${s.totalPresences}</div></div>
      <div class="stat"><div class="label">Jogadores cadastrados</div><div class="value num">${state.players.length}</div></div>
    </div>

    <div class="section-title">Artilheiros</div>
    ${s.topScorers.length === 0 ? `<div class="empty">Nenhum gol registrado ainda. Marque os gols em uma partida para ver o ranking.</div>` : `
    <div class="rank-list">
      ${s.topScorers.map((x,i)=>`
        <div class="rank-row">
          <div class="rank-pos">${i+1}</div>
          ${playerPhotoTag(x.player,'rank-photo')}
          <div class="rank-name">${esc(x.player.name)}<span class="pos-tag">${esc(x.player.position)}</span></div>
          <div class="rank-goals">${x.goals}</div>
        </div>
      `).join('')}
    </div>`}

    <div class="section-title">Mais presentes</div>
    ${s.topPresence.length === 0 ? `<div class="empty">Nenhuma presença confirmada ainda.</div>` : `
    <div class="rank-list">
      ${s.topPresence.map((x,i)=>`
        <div class="rank-row">
          <div class="rank-pos">${i+1}</div>
          ${playerPhotoTag(x.player,'rank-photo')}
          <div class="rank-name">${esc(x.player.name)}<span class="pos-tag">${esc(x.player.position)}</span></div>
          <div class="rank-goals">${x.count}</div>
        </div>
      `).join('')}
    </div>`}
  `;
}
function playerPhotoTag(player, cls){
  if(player && player.photo) return `<img src="${player.photo}" class="${cls}">`;
  const initial = player ? esc(playerName(player).charAt(0).toUpperCase()) : '?';
  return `<div class="${cls}" style="display:flex;align-items:center;justify-content:center;font-family:Oswald;font-size:13px;color:var(--text-faint);">${initial}</div>`;
}

/* ============ PLAYERS ============ */
function renderPlayers(){
  const view = state.playersView || 'grid';
  return `
    <div class="page-head" style="display:flex; align-items:flex-end; justify-content:space-between; gap:20px; flex-wrap:wrap;">
      <div>
        <div class="kicker">Elenco</div>
